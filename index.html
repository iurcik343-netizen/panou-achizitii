<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panou achiziții</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #F2F5F4;
    --panel: #FFFFFF;
    --border: #DCE4E1;
    --text: #1E2624;
    --text-soft: #71827D;
    --accent: #0F6E56;
    --accent-dark: #085041;
    --accent-soft: #E1F5EE;
    --rank1: #0F6E56; --rank1-bg: #E1F5EE;
    --rank2: #1B6FA8; --rank2-bg: #E6F1FB;
    --rank3: #A9762B; --rank3-bg: #FAEEDA;
    --bad: #C23B3B; --bad-bg: #FBEAEA;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --sans: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    --radius: 12px;
    --shadow-sm: 0 1px 3px rgba(15,110,86,0.07);
    --shadow-md: 0 4px 16px rgba(15,110,86,0.12);
  }
  * { box-sizing: border-box; }
  #pt-root { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; padding: 28px 20px 60px; }
  #pt-root .wrap { max-width: 1600px; margin: 0 auto; }
  #pt-root h1 { font-family: var(--sans); font-size: 27px; font-weight: 700; margin: 0 0 2px; letter-spacing: -0.01em; }
  #pt-root .sub { color: var(--text-soft); font-size: 13.5px; margin-bottom: 20px; }
  #pt-root .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; }
  #pt-root .tab-btn { background: none; border: none; padding: 10px 14px; font-size: 13.5px; font-weight: 700; color: var(--text); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: var(--sans); transition: color .15s ease, border-color .15s ease; }
  #pt-root .tab-btn:hover { color: var(--accent-dark); }
  #pt-root .tab-btn.active { color: var(--accent-dark); border-bottom-color: var(--accent); }
  #pt-root .subtabs { display: flex; gap: 8px; margin-bottom: 16px; }
  #pt-root .subtab-btn { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 12.5px; font-weight: 600; color: var(--text-soft); cursor: pointer; transition: background .15s ease, border-color .15s ease, color .15s ease; }
  #pt-root .subtab-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
  #pt-root .subtab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #pt-root .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
  #pt-root .panel h2 { font-family: var(--sans); font-weight: 600; font-size: 17px; margin: 0 0 4px; }
  #pt-root .panel .hint { color: var(--text-soft); font-size: 12.5px; margin-bottom: 14px; line-height: 1.5; }
  #pt-root label { display: block; font-size: 11.5px; font-weight: 700; color: var(--text); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.02em; }
  #pt-root input[type=text], #pt-root input[type=password], #pt-root input[type=number], #pt-root input[type=file], #pt-root select, #pt-root textarea {
    width: 100%; border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 9px 11px;
    font-size: 13.5px; font-family: var(--sans); color: var(--text); margin-bottom: 14px; transition: border-color .15s ease, box-shadow .15s ease;
  }
  #pt-root input[type=text]:focus, #pt-root input[type=password]:focus, #pt-root input[type=number]:focus, #pt-root select:focus, #pt-root textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #pt-root .auth-link { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 12px; font-weight: 600; padding: 0; }
  #pt-root .auth-link:hover { color: var(--accent-dark); text-decoration: underline; }
  #pt-root textarea { font-family: var(--mono); font-size: 12px; min-height: 120px; resize: vertical; }
  #pt-root .row { display: flex; gap: 12px; flex-wrap: wrap; }
  #pt-root .row > div { flex: 1; min-width: 130px; }
  #pt-root button.primary { background: var(--accent); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow-sm); transition: background .15s ease, box-shadow .15s ease, transform .1s ease; }
  #pt-root button.primary:hover { background: var(--accent-dark); box-shadow: var(--shadow-md); }
  #pt-root button.primary:active { transform: translateY(1px); }
  #pt-root button.primary:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
  #pt-root button.secondary { background: var(--panel); border: 1px solid var(--accent); color: var(--accent-dark); padding: 9px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s ease, box-shadow .15s ease; }
  #pt-root button.secondary:hover { background: var(--accent-soft); box-shadow: var(--shadow-sm); }
  #pt-root button.icon-x { background: none; border: none; color: var(--text-soft); cursor: pointer; font-size: 12.5px; padding: 2px 6px; border-radius: 5px; transition: color .15s ease, background .15s ease; }
  #pt-root button.icon-x:hover { color: var(--bad); background: var(--bad-bg); }
  #pt-root button.icon-link { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 11.5px; padding: 2px 6px; font-weight: 600; border-radius: 5px; transition: background .15s ease; }
  #pt-root button.icon-link:hover { background: var(--accent-soft); }
  #pt-root .supplier-chip { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; font-size: 14px; background: var(--panel); box-shadow: var(--shadow-sm); }
  #pt-root .feedback { font-size: 12.5px; padding: 10px 12px; border-radius: 7px; margin-top: 8px; white-space: pre-line; }
  #pt-root .feedback.ok { background: var(--rank1-bg); color: var(--rank1); }
  #pt-root .feedback.err { background: var(--bad-bg); color: var(--bad); }
  #pt-root .search-row { display: flex; gap: 10px; margin-bottom: 16px; }
  #pt-root .search-row input { margin-bottom: 0; }
  #pt-root .stat-strip { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  #pt-root .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; font-family: var(--mono); box-shadow: var(--shadow-sm); }
  #pt-root .stat .n { font-size: 20px; font-weight: 700; color: var(--accent-dark); }
  #pt-root .stat .l { font-size: 10.5px; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.04em; }
  #pt-root .legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--text-soft); margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  #pt-root .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  #pt-root .product-card { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow-sm); }
  #pt-root .product-head { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; background: var(--bg); border-bottom: 1px solid var(--border); gap: 8px; flex-wrap: wrap; }
  #pt-root .product-head .name { font-weight: 600; font-size: 13px; }
  #pt-root .product-head .meta { font-size: 10px; color: var(--text-soft); font-family: var(--mono); }
  #pt-root .product-head .rrp { font-family: var(--mono); font-size: 11px; background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 12px; }
  #pt-root .product-head .actions { display: flex; gap: 4px; align-items: center; }
  #pt-root table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  #pt-root th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-soft); padding: 8px 14px; }
  #pt-root td { padding: 7px 14px; border-top: 1px solid var(--border); font-family: var(--mono); }
  #pt-root .entry-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 12px; border-top: 1px solid var(--border); gap: 8px; flex-wrap: wrap; font-size: 11.5px; }
  #pt-root .entry-row.rank-1 { background: var(--rank1-bg); }
  #pt-root .entry-row.rank-2 { background: var(--rank2-bg); }
  #pt-root .entry-row.rank-3 { background: var(--rank3-bg); }
  #pt-root .entry-main { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-family: var(--mono); }
  #pt-root .entry-main b { font-family: var(--sans); font-weight: 600; font-size: 12px; }
  #pt-root .entry-tag { font-family: var(--sans); font-weight: 700; font-size: 9px; text-transform: uppercase; }
  #pt-root .entry-dim { color: var(--text-soft); }
  #pt-root .entry-actions { display: flex; gap: 0; align-items: center; }
  #pt-root .entry-actions button { padding: 2px 5px; }
  #pt-root .merge-toggle-row { padding: 4px 12px; border-top: 1px solid var(--border); }
  #pt-root .merge-toggle-row button { font-size: 10.5px; color: var(--text-soft); }
  #pt-root .merge-box { padding: 8px 12px; background: var(--bg); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  #pt-root .merge-box select { margin-bottom: 0; flex: 1; }
  #pt-root .cmp-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; table-layout: fixed; }
  #pt-root .cmp-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--text-soft); padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--bg); }
  #pt-root .sticky-col-table td:first-child, #pt-root .sticky-col-table th:first-child { position: sticky; left: 0; background: var(--panel); z-index: 2; box-shadow: 2px 0 4px rgba(0,0,0,0.05); }
  #pt-root .sticky-col-table th:first-child { background: var(--bg); z-index: 3; }
  #pt-root .cmp-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  #pt-root .cmp-table .prod-meta { font-size: 9.5px; color: var(--text-soft); font-family: var(--mono); margin-top: 1px; }
  #pt-root .prod-title-btn { background: none; border: none; cursor: pointer; text-align: left; padding: 0; font-family: var(--sans); font-weight: 700; font-size: 13px; color: var(--text); line-height: 1.3; }
  #pt-root .prod-title-btn:hover { color: var(--accent-dark); }
  #pt-root .price-cell-btn { background: none; border: none; cursor: pointer; font-family: var(--mono); font-size: 14px; text-align: left; padding: 3px 5px; border-radius: 5px; width: 100%; color: var(--text); }
  #pt-root .price-cell-btn:hover { background: var(--accent-soft); }
  #pt-root .price-cell-btn .sub { display: block; font-size: 11px; color: var(--text-soft); }
  #pt-root td.cheapest-cell { background: var(--rank1-bg); }
  #pt-root td.dim { color: var(--text-soft); text-align: center; font-size: 11px; }
  #pt-root .detail-panel { padding: 10px 12px; background: var(--bg); border-radius: 8px; }
  #pt-root tr.rank-1 td { background: var(--rank1-bg); }
  #pt-root tr.rank-1 .tag { color: var(--rank1); }
  #pt-root tr.rank-2 td { background: var(--rank2-bg); }
  #pt-root tr.rank-2 .tag { color: var(--rank2); }
  #pt-root tr.rank-3 td { background: var(--rank3-bg); }
  #pt-root tr.rank-3 .tag { color: var(--rank3); }
  #pt-root .tag { font-family: var(--sans); font-weight: 700; font-size: 10px; text-transform: uppercase; }
  #pt-root .price-up { color: var(--bad); font-weight: 700; }
  #pt-root .empty { text-align: center; padding: 40px 20px; color: var(--text-soft); font-size: 13.5px; }
  #pt-root .table-wrap { position: relative; overflow-x: auto; cursor: grab; scrollbar-width: thin; scrollbar-color: var(--accent) var(--bg); }
  #pt-root .cmp-sticky-header { display: flex; position: absolute; top: 0; left: 0; right: 0; z-index: 4; background: var(--bg); border-bottom: 1px solid var(--border); pointer-events: none; }
  #pt-root .cmp-sticky-header-cell { position: relative; flex: 0 0 auto; box-sizing: border-box; padding: 7px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; color: var(--text-soft); white-space: normal; word-break: break-word; line-height: 1.2; overflow: hidden; }
  #pt-root .cmp-sticky-header-cell:first-child { position: sticky; left: 0; background: var(--bg); box-shadow: 2px 0 4px rgba(0,0,0,0.05); }
  #pt-root .table-wrap.dragging { cursor: grabbing; user-select: none; }
  #pt-root .table-wrap::-webkit-scrollbar { height: 11px; }
  #pt-root .table-wrap::-webkit-scrollbar-track { background: var(--bg); }
  #pt-root .table-wrap::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 6px; }
  #pt-root .table-wrap::-webkit-scrollbar-thumb:hover { background: var(--accent-dark); }
  #pt-root input[type=number]::-webkit-inner-spin-button,
  #pt-root input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #pt-root input[type=number] { -moz-appearance: textfield; }
  #pt-root input[type=number].pt-pct-input::-webkit-inner-spin-button,
  #pt-root input[type=number].pt-pct-input::-webkit-outer-spin-button { -webkit-appearance: auto; margin: 0; }
  #pt-root input[type=number].pt-pct-input { -moz-appearance: auto; }
  #pt-root table.pt-order-pricing-table { width: max-content; min-width: 100%; }
  #pt-root .pt-prodname-resizable { display: inline-block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 50px; max-width: 640px; vertical-align: middle; }
  #pt-root th.pt-prodname-th, #pt-root th.pt-resizable-th { position: relative; }
  #pt-root .pt-colresize-handle { position: absolute; right: 0; top: 0; bottom: 0; width: 10px; cursor: col-resize; border-right: 2px solid var(--border); }
  #pt-root .pt-colresize-handle:hover, #pt-root .pt-colresize-handle.active { background: var(--accent); opacity: 0.4; border-right-color: var(--accent); }
  #pt-root .pt-colhide-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: var(--bg); border: none; color: var(--text-soft); font-size: 9px; line-height: 1; cursor: pointer; padding: 3px; border-radius: 3px; }
  #pt-root .pt-colhide-btn:hover { background: var(--bad); color: #fff; }
  #pt-root .qty-input { width: 70px; padding: 5px 7px; margin-bottom: 0; }
  #pt-root .map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 10px 14px; margin-bottom: 14px; }
  #pt-root .map-grid label { margin-bottom: 4px; }
  #pt-root .map-grid select { margin-bottom: 0; }
  #pt-root .preview-wrap { max-height: 220px; overflow: auto; border: 1px solid var(--border); border-radius: 7px; margin-bottom: 14px; }
  #pt-root .preview-wrap table { font-size: 11.5px; }
  #pt-root .order-summary { position: sticky; top: 0; }
  #pt-root .order-line { display: flex; justify-content: space-between; font-size: 12.5px; padding: 5px 0; border-bottom: 1px dashed var(--border); font-family: var(--mono); }
  #pt-root .order-total { display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; padding-top: 10px; margin-top: 6px; border-top: 1px solid var(--border); font-family: var(--mono); }
  #pt-root .two-col { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  #pt-root .two-col > .main { flex: 2; min-width: 320px; }
  #pt-root .two-col > .side { flex: 1; min-width: 260px; }
  #pt-root .history-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
  #pt-auth-gate { max-width: 380px; margin: 90px auto 0; }
  #pt-root .table-wrap { -webkit-overflow-scrolling: touch; }
  @media (max-width: 640px) {
    #pt-root { padding: 16px 12px 40px; }
    #pt-root h1 { font-size: 21px; }
    #pt-auth-gate { margin-top: 40px; max-width: 100%; }
    #pt-root .tabs { flex-wrap: nowrap; overflow-x: auto; }
    #pt-root .tab-btn { white-space: nowrap; padding: 10px 12px; }
    #pt-root .search-row { flex-direction: column; }
    #pt-root .stat-strip { gap: 8px; }
    #pt-root .stat { flex: 1 1 calc(50% - 8px); }
    #pt-root .panel { padding: 14px; }
  }
</style>
</head>
<body>

<div id="pt-root">
  <div id="pt-auth-gate">
    <form class="panel" id="pt-auth-form">
      <h2 id="pt-auth-title" style="font-family:var(--sans);font-weight:700;margin:0 0 4px">Panou achiziții</h2>
      <div class="hint" id="pt-auth-hint">Autentifică-te pentru a accesa datele.</div>
      <div id="pt-auth-email-row">
        <label>Email</label>
        <input type="text" id="pt-auth-email" name="email" autocomplete="username">
      </div>
      <label id="pt-auth-password-label">Parolă</label>
      <input type="password" id="pt-auth-password" autocomplete="current-password">
      <button class="primary" type="submit" id="pt-auth-submit" style="width:100%">Intră</button>
      <div style="text-align:center;margin-top:10px" id="pt-auth-forgot-row"><button type="button" class="auth-link" id="pt-auth-forgot">Am uitat parola</button></div>
      <div id="pt-auth-feedback" class="feedback" style="display:none"></div>
    </form>
  </div>
  <div class="wrap" id="pt-app-wrap" style="display:none">
    <h1>Panou achiziții</h1>
    <div class="sub">Compară furnizori pe barcode/nume, construiește comenzi, urmărește scumpirile.</div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="compare">Comparație produse</button>
      <button class="tab-btn" data-tab="add">Adaugă listă de preț</button>
      <button class="tab-btn" data-tab="orders">Comenzi</button>
      <button class="tab-btn" data-tab="catalog">Produse MoySklad</button>
      <button class="tab-btn" data-tab="suppliers">Furnizori</button>
      <button class="tab-btn" data-tab="settings">Setări</button>
    </div>

    <div id="tab-compare" class="tab-content"></div>
    <div id="tab-add" class="tab-content" style="display:none"></div>
    <div id="tab-orders" class="tab-content" style="display:none"></div>
    <div id="tab-catalog" class="tab-content" style="display:none"></div>
    <div id="tab-suppliers" class="tab-content" style="display:none"></div>
    <div id="tab-settings" class="tab-content" style="display:none"></div>
  </div>
</div>

<script>
(function(){
  // ================= CONFIG SUPABASE =================
  // 1) Creează un proiect gratuit pe https://supabase.com
  // 2) În proiectul nou → SQL Editor → rulează:
  //
  //      create table app_state (
  //        id text primary key default 'main',
  //        data jsonb not null default '{}'::jsonb,
  //        updated_at timestamptz not null default now()
  //      );
  //      alter table app_state enable row level security;
  //      create policy "authenticated select" on app_state for select using (auth.role() = 'authenticated');
  //      create policy "authenticated insert" on app_state for insert with check (auth.role() = 'authenticated');
  //      create policy "authenticated update" on app_state for update using (auth.role() = 'authenticated');
  //
  // 3) Authentication → Users → Add user: creează-ți contul (email + parolă). Nu e sign-up public,
  //    doar conturile create manual aici pot intra în aplicație.
  // 4) Settings → API: copiază "Project URL" și cheia "anon public" mai jos.
  var SUPABASE_URL = 'https://wijumzjsgjrzzipgdeyd.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_HSpJConvyLeGt3zPf7h8bw_RniB4NC7';
  var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var STATE_ROW_ID = 'main';
  var currentUserEmail = '';
  var appStarted = false;

  var state = {
    suppliers: [],
    products: {},
    orders: [],
    carts: {},
    importMappings: {},
    priceLists: [],
    brandCurrencies: [],
    settings: { exchangeRate: 17.68, krwPerUsd: 1375, eurPerUsd: 0.92, coef: 1.4, ratesUpdatedAt: null, defaultMarkup: 100, hiddenMoyskladBrandIds: [], hiddenMoyskladProductIds: [], pinnedBrands: [] }
  };

  var autoFetchFailed = false;
  function normName(s){ return String(s||'').toLowerCase().trim().replace(/\s+/g,' '); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function fmt(n){ return isFinite(n) ? Number(n).toFixed(2) : '—'; }

  // ================= REDIMENSIONARE COLOANE (persistă local, per dispozitiv) =================
  var COLWIDTH_KEY = 'pt_col_widths_v1';
  var colWidths = (function(){
    try { return JSON.parse(localStorage.getItem(COLWIDTH_KEY)) || {}; } catch(e){ return {}; }
  })();
  function getColWidth(table, col, dflt){
    return (colWidths[table] && colWidths[table][col]) || dflt;
  }
  function saveColWidthsToStorage(){
    try { localStorage.setItem(COLWIDTH_KEY, JSON.stringify(colWidths)); } catch(e){}
  }
  window.ptColResizeStart = function(e, table, col, dflt, min, max){
    e.preventDefault();
    e.stopPropagation();
    var handle = e.currentTarget || e.target;
    handle.classList.add('active');
    var startX = e.clientX;
    var startWidth = getColWidth(table, col, dflt);
    var sel = '[data-colw="' + table + ':' + col + '"]';
    function onMove(ev){
      var w = Math.max(min || 40, Math.min(max || 700, startWidth + (ev.clientX - startX)));

  function extractBarcodes(raw){
    if(raw === null || raw === undefined || raw === '') return [];
    var s = String(raw).trim();
    if(/^\d+\.0+$/.test(s)) s = s.split('.')[0];
    var matches = s.match(/\d{8,14}/g);
    if(matches && matches.length){
      var seen = {};
      return matches.filter(function(m){ if(seen[m]) return false; seen[m] = true; return true; });
    }
    var cleaned = s.replace(/\s+/g,'');
    return cleaned ? [cleaned] : [];
  }

  var saveTimer = null;
  var lastKnownUpdatedAt = null;
  var staleWarningShown = false;
  var sizeWarningShown = false;
  function save(){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(doSaveNow, 400);
  }
  async function doSaveNow(){
    try {
      // Verificăm dacă altcineva (alt tab, alt calculator) a salvat între timp — cu o singură
      // versiune partajată, o salvare de-a noastră ar suprascrie orbește modificările lor.
      // Nu blocăm salvarea (ar risca să pierdem chiar modificarea curentă), dar avertizăm clar,
      // o singură dată, ca să știe să reîncarce pagina înainte să mai schimbe ceva.
      if(lastKnownUpdatedAt && !staleWarningShown){
        try {
          var check = await supabaseClient.from('app_state').select('updated_at').eq('id', STATE_ROW_ID).maybeSingle();
          if(check.data && check.data.updated_at && check.data.updated_at !== lastKnownUpdatedAt){
            staleWarningShown = true;
            ptToast('⚠ Cineva a salvat modificări din altă parte (alt tab sau alt calculator) de când ai deschis pagina asta. Ca să nu le suprascrii, reîncarcă pagina (F5) ACUM, apoi refă ultima modificare.', false);
          }
        } catch(e){ /* verificarea e doar o măsură de siguranță — dacă eșuează, continuăm cu salvarea */ }
      }
      var payload = JSON.stringify(state);
      // Pragul e generos — un rând JSONB în Postgres/Supabase duce fără probleme mult peste atît;
      // avertizăm doar ca semnal timpuriu, nu pentru că am fi aproape de o limită reală. Avertizăm
      // o singură dată per sesiune, nu la fiecare salvare, ca să nu enerveze degeaba.
      if(payload.length > 15000000 && !sizeWarningShown){
        sizeWarningShown = true;
        ptToast('Atenție: baza de date e mare (~' + Math.round(payload.length/1024) + ' KB). Ia în calcul să ștergi cataloage vechi nefolosite.', false);
      }
      var nowIso = new Date().toISOString();
      // Cerem rândul înapoi (select) după upsert, ca să reținem exact formatul de timestamp pe
      // care îl întoarce Supabase — dacă am reține în schimb string-ul nostru local (toISOString),
      // comparația de mai sus la salvarea următoare ar pica mereu fals-pozitiv, pentru că Postgres
      // serializează timestamp-urile puțin diferit (alt format de precizie/fus orar).
      var result = await supabaseClient.from('app_state').upsert({ id: STATE_ROW_ID, data: state, updated_at: nowIso }).select('updated_at').maybeSingle();
      if(result.error) ptToast('Salvarea nu a reușit: ' + result.error.message, false);
      else { lastKnownUpdatedAt = (result.data && result.data.updated_at) || nowIso; staleWarningShown = false; }
    } catch(e){
      ptToast('Eroare la salvare: ' + (e && e.message ? e.message : 'necunoscută') + '. Modificarea ar putea să nu fi fost păstrată.', false);
    }
  }
  async function load(){
    try {
      var result = await supabaseClient.from('app_state').select('data, updated_at').eq('id', STATE_ROW_ID).maybeSingle();
      if(result.error){ ptToast('Eroare la încărcare: ' + result.error.message, false); return; }
      lastKnownUpdatedAt = (result.data && result.data.updated_at) || null;
      var parsed = result.data && result.data.data;
      if(parsed){
        state.suppliers = parsed.suppliers || [];
        state.products = parsed.products || {};
        state.orders = parsed.orders || [];
        state.carts = parsed.carts || {};
        state.importMappings = parsed.importMappings || {};
        state.priceLists = parsed.priceLists || [];
        state.brandCurrencies = parsed.brandCurrencies || [];
        state.settings = Object.assign(state.settings, parsed.settings || {});
        if(!parsed.settings || parsed.settings.coef === undefined){
          if(parsed.settings && parsed.settings.seaCoef !== undefined) state.settings.coef = parsed.settings.seaCoef;
        }
        // Migrare unică: un bug marca greșit aproape toate produsele ca „NEW” la prima încărcare
        // a unui price list (nu doar la actualizări ulterioare). Curățăm o singură dată etichetele
        // greșite deja salvate — logica de mai jos (doExcelImport) e reparată, deci de acum înainte
        // se marchează corect doar produsele apărute la o actualizare reală.
        if(!state.settings.newBadgeMigrated){
          Object.keys(state.products).forEach(function(k){ state.products[k].isNew = false; });
          state.settings.newBadgeMigrated = true;
          save();
        }
      }
    } catch(e){ /* first run */ }
  }

  function normalizeCurrency(raw, def){
    var c = String(raw||'').toUpperCase().trim();
    if(c === 'USD' || c === '$') return 'USD';
    if(c === 'MDL' || c === 'LEI' || c === 'L') return 'MDL';
    if(c === 'KRW' || c === 'WON' || c === '₩') return 'KRW';
    if(c === 'EUR' || c === '€') return 'EUR';
    return def;
  }
  function toUSD(price, currency){
    if(currency === 'KRW') return price / (state.settings.krwPerUsd || 1375);
    if(currency === 'EUR') return price / (state.settings.eurPerUsd || 0.92);
    if(currency === 'MDL') return price / state.settings.exchangeRate;
    return price;
  }
  function landedCost(price, currency, freight, coefOverride){
    if(currency === 'MDL') return price;
    var usd = toUSD(price, currency);

    return usd * state.settings.exchangeRate * coef;
  }
  function freightLabel(freight){

  async function fetchRates(){
    try {

        if(data.rates.MDL) state.settings.exchangeRate = data.rates.MDL;
        if(data.rates.KRW) state.settings.krwPerUsd = data.rates.KRW;
        if(data.rates.EUR) state.settings.eurPerUsd = data.rates.EUR;
        state.settings.ratesUpdatedAt = new Date().toISOString().slice(0,16).replace('T',' ');

  function unitCost(e){ return e.landedCost / (e.packQty && e.packQty > 0 ? e.packQty : 1); }
  function supplierDiscountPct(sid){
    var s = state.suppliers.find(function(x){ return x.id === sid; });
    return (s && s.discountPct) ? s.discountPct : 0;
  }
  function effectiveLandedCost(e, sid){
    var pct = supplierDiscountPct(sid);
    return pct ? e.landedCost * (1 - pct/100) : e.landedCost;
  }
  function effectiveUnitCost(e, sid){
    return effectiveLandedCost(e, sid) / (e.packQty && e.packQty > 0 ? e.packQty : 1);
  }
  function recomputeAllLandedCosts(){
    Object.keys(state.products).forEach(function(k){
      var p = state.products[k];
      Object.keys(p.bySupplier).forEach(function(sid){ var e = p.bySupplier[sid]; e.landedCost = landedCost(e.price, e.currency, e.freight); });
    });

  function supplierName(id){

  function todayStr(){ return new Date().toISOString().slice(0,10); }
  // Eticheta „NEW” ține cont doar de ultima lună — altfel ar rămâne agățată de un produs la
  // nesfârșit, dacă price list-ul lui nu se mai actualizează niciodată.
  function isRecentlyNew(p){
    if(!p.isNew || !p.newAt) return false;
    var ageMs = Date.now() - new Date(p.newAt).getTime();
    return ageMs <= 30 * 24 * 60 * 60 * 1000;

  var ORDER_STATUSES = ['trimisa','confirmata','in-transit','received'];
  var ORDER_STATUS_LABELS = { 'trimisa':'Trimisă', 'confirmata':'Confirmată', 'in-transit':'Pe drum', 'received':'Recepționată' };
  function getInTransitInfo(key){
    var qty = 0, eta = null, freight = null, sid = null;
    state.orders.forEach(function(o){
      if(o.status === 'received') return;
      o.lines.forEach(function(l){
        if(l.key === key){
          qty += l.qty;
          if(o.eta && (!eta || o.eta < eta)){ eta = o.eta; freight = o.freight; sid = o.supplierId; }
          else if(!eta && freight == null){ freight = o.freight; sid = o.supplierId; }
        }
      });
    });
    return { qty: qty, eta: eta, overdue: !!(eta && eta < todayStr()), freight: freight, sid: sid };
  }

  // Verifică automat, în fundal, dacă o comandă adusă din MoySklad (status „Pe drum") a fost
  // între timp recepționată acolo (o Приемка creată pe baza ei) — dacă da, trece statusul pe
  // „Recepționată", ca produsele să nu mai apară „pe drum" în Comparație produse.
  var orderStatusQueue = [];
  var orderStatusActive = 0;
  var orderStatusChecking = {};
  var ORDER_STATUS_CONCURRENCY = 2;
  var ORDER_STATUS_RECHECK_MS = 5 * 60 * 1000;
  function ensureOrderStatusChecked(o){
    if(!o.moyskladOrderId || o.status !== 'in-transit') return;
    if(!state.settings.moyskladProxyUrl) return;
    if(o.moyskladCheckedAt && (Date.now() - o.moyskladCheckedAt) < ORDER_STATUS_RECHECK_MS) return;
    if(orderStatusChecking[o.id]) return;
    orderStatusChecking[o.id] = true;
    orderStatusQueue.push(o);
    pumpOrderStatusQueue();
  }
  function pumpOrderStatusQueue(){
    while(orderStatusActive < ORDER_STATUS_CONCURRENCY && orderStatusQueue.length){
      (function(o){
        orderStatusActive++;
        var base = state.settings.moyskladProxyUrl;
        var url = base + (base.indexOf('?')===-1?'?':'&') + 'orderstatus=' + encodeURIComponent(o.moyskladOrderId);
        fetch(url).then(function(res){ return res.json(); }).then(function(data){
          o.moyskladCheckedAt = Date.now();
          if(data && data.received && o.status === 'in-transit'){
            o.status = 'received';
            save();
            rerenderVisibleTabs();
          }
        }).catch(function(){}).then(function(){
          delete orderStatusChecking[o.id];
          orderStatusActive--;
          pumpOrderStatusQueue();
        });
      })(orderStatusQueue.shift());
    }
  }

  function convertToMDL(amount, currency){
    if(!currency || currency === 'MDL') return amount;
    if(currency === 'KRW') return (amount / state.settings.krwPerUsd) * state.settings.exchangeRate;
    return amount * state.settings.exchangeRate;
  }
  function rrpCellHtml(p, minLanded){
    if(!p.rrp) return '—';
    var rrpMdl = convertToMDL(p.rrp, p.rrpCurrency);
    var out = '<span style="font-size:14px;font-weight:700">' + Math.round(rrpMdl) + '</span>';
    if(minLanded){
      var markup = ((rrpMdl - minLanded) / minLanded) * 100;
      out += '<br><span style="font-size:11px;color:' + (markup >= 0 ? 'var(--rank1)' : 'var(--bad)') + '">' + (markup >= 0 ? '+' : '') + Math.round(markup) + '%</span>';
    }
    return out;
  }
  function upsertProduct(fields, sid, today){
    // fields: {name, brand, quantity, barcode, altBarcodes, price, currency, freight, rrp, moq, packQty}
    // Dacă produsul există deja în MoySklad (potrivire pe barcode), denumirea de-acolo are prioritate — e deja curățată corect.
    if(fields.barcode && moyskladByBarcode[fields.barcode] && moyskladByBarcode[fields.barcode].name){
      fields.name = moyskladByBarcode[fields.barcode].name;
    }
    if(!fields.brand && fields.name){
      var bracketMatch = fields.name.match(/^\[([^\]]+)\]/);
      if(bracketMatch) fields.brand = bracketMatch[1].trim();
    }
    if(fields.brand && fields.name && normName(fields.name).indexOf(normName(fields.brand)) === -1){
      fields.name = fields.brand + ' ' + fields.name;
    }
    var key = makeKey(fields.barcode, fields.name, fields.quantity);
    if(!state.products[key]){
      state.products[key] = { displayName: fields.name, brand: fields.brand || '', quantity: fields.quantity || '', barcode: fields.barcode || '', altBarcodes: [], rrp: null, archived: false, bySupplier: {} };
    }
    var prod = state.products[key];
    if(fields.name) prod.displayName = fields.name;
    if(fields.brand) prod.brand = fields.brand;
    if(fields.quantity) prod.quantity = fields.quantity;
    if(fields.barcode) prod.barcode = fields.barcode;
    if(fields.altBarcodes && fields.altBarcodes.length){
      var existingAlt = prod.altBarcodes || [];
      fields.altBarcodes.forEach(function(b){ if(existingAlt.indexOf(b) === -1) existingAlt.push(b); });
      prod.altBarcodes = existingAlt;
    }
    if(fields.rrp !== null && fields.rrp !== undefined && !isNaN(fields.rrp) && fields.rrp !== ''){ prod.rrp = fields.rrp; prod.rrpCurrency = fields.currency; }

    var cost = landedCost(fields.price, fields.currency, fields.freight);
    var existing = prod.bySupplier[sid];
    var wasIncrease = false;
    var packQty = (fields.packQty !== null && fields.packQty !== undefined && !isNaN(fields.packQty) && fields.packQty > 0) ? fields.packQty : null;
    var weightGrams = (fields.weightGrams !== null && fields.weightGrams !== undefined && !isNaN(fields.weightGrams) && fields.weightGrams > 0) ? fields.weightGrams : null;
    if(existing){
      wasIncrease = fields.price > existing.price;
      existing.history.push({ date: today, price: fields.price, currency: fields.currency });
      if(existing.history.length > 20) existing.history.splice(0, existing.history.length - 20);
      existing.price = fields.price; existing.currency = fields.currency; existing.freight = fields.freight;
      existing.landedCost = cost; existing.updatedAt = today;
      if(fields.moq !== null && fields.moq !== undefined && !isNaN(fields.moq)) existing.moq = fields.moq;
      if(packQty !== null) existing.packQty = packQty;
      if(weightGrams !== null) existing.weightGrams = weightGrams;
      if(fields.barcode) existing.barcode = fields.barcode;
    } else {
      prod.bySupplier[sid] = { price: fields.price, currency: fields.currency, freight: fields.freight, landedCost: cost, updatedAt: today, history: [{ date: today, price: fields.price, currency: fields.currency }], moq: (fields.moq !== null && fields.moq !== undefined && !isNaN(fields.moq)) ? fields.moq : null, packQty: packQty, weightGrams: weightGrams, barcode: fields.barcode || '' };
    }
    return wasIncrease;
  }

  window.ptMergeSearch = function(key, query){

    var matches = Object.keys(state.products).filter(function(k2){

    if(matches.length === 0){ box.innerHTML = '<span style="font-size:11.5px;color:var(--text-soft)">Niciun rezultat</span>'; return; }
    box.innerHTML = matches.map(function(k2){
      var p2 = state.products[k2];

      return '<button class="icon-link" style="display:block;width:100%;text-align:left;border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin-top:4px" onclick="ptMergeProducts(\'' + key.replace(/'/g,"\\'") + '\', \'' + k2.replace(/'/g,"\\'") + '\')">' + label + '</button>';
    }).join('');
  };
  window.ptMergeProducts = function(sourceKey, targetKey){
    if(!targetKey || sourceKey === targetKey) return;
    var src = state.products[sourceKey], tgt = state.products[targetKey];
    if(!src || !tgt) return;
    var srcBarcode = src.barcode || '';
    var tgtBarcode = tgt.barcode || '';
    Object.keys(tgt.bySupplier).forEach(function(sid){
      if(!tgt.bySupplier[sid].barcode) tgt.bySupplier[sid].barcode = tgtBarcode;
    });
    Object.keys(src.bySupplier).forEach(function(sid){
      if(tgt.bySupplier[sid]){
        var merged = tgt.bySupplier[sid].history.concat(src.bySupplier[sid].history).sort(function(a,b){ return a.date.localeCompare(b.date); });
        tgt.bySupplier[sid].history = merged;
        if(src.bySupplier[sid].updatedAt >= tgt.bySupplier[sid].updatedAt){

  function setInnerHtmlKeepingFocus(el, html){
    var active = document.activeElement;

    if(active && active.id && el.contains(active)){
      focusInfo = { id: active.id, start: active.selectionStart, end: active.selectionEnd };
    }
    el.innerHTML = html;
    if(focusInfo){
      var restored = document.getElementById(focusInfo.id);
      if(restored){
        restored.focus();
        if(typeof restored.setSelectionRange === 'function' && focusInfo.start !== null && focusInfo.start !== undefined){
          try { restored.setSelectionRange(focusInfo.start, focusInfo.end); } catch(e){}

  // calculăm exact cît spațiu mai e disponibil pînă la baza ferestrei și întindem tabelul pînă acolo.
  var tableWrapResizeBound = false;

  // position:sticky pe <th> are un bug de randare cunoscut in Chrome: textul antetului dispare
  // intermitent la scroll. Il evitam complet: antetul real ramine neschimbat (nesticky, dar tot
  // functional pentru resize/ascundere coloane), iar aici construim un antet "fantoma" — un <div>
  // normal, in afara tabelului, care copiaza etichetele si latimile coloanelor. E afisat permanent
  // (nu doar dupa ce incepe scroll-ul, ca sa nu apara un "flash" la trecerea intre ele) si suprapus
  // exact peste antetul real; are pointer-events:none ca butoanele de resize/ascundere din antetul
  // real sa ramina clickabile prin el.
  function mountStickyHeader(wrapEl){
    var table = wrapEl.querySelector('table.cmp-table');
    var headRow = table && table.querySelector('thead tr');
    if(!headRow) return;
    var overlay = document.createElement('div');
    overlay.className = 'cmp-sticky-header';
    Array.prototype.forEach.call(headRow.children, function(th){
      var cell = document.createElement('div');
      cell.className = 'cmp-sticky-header-cell';
      cell.innerHTML = th.innerHTML;
      if(th.getAttribute('title')) cell.title = th.getAttribute('title');
      overlay.appendChild(cell);
    });
    wrapEl.insertBefore(overlay, wrapEl.firstChild);
    function syncWidths(){
      Array.prototype.forEach.call(headRow.children, function(th, i){
        if(overlay.children[i]) overlay.children[i].style.width = th.offsetWidth + 'px';
      });
    }
    function syncPosition(){
      overlay.style.transform = 'translateY(' + wrapEl.scrollTop + 'px)';
    }
    syncWidths();
    syncPosition();
    wrapEl.addEventListener('scroll', syncPosition);
    if(window.ResizeObserver){
      var ro = new ResizeObserver(syncWidths);
      Array.prototype.forEach.call(headRow.children, function(th){ ro.observe(th); });
    }
  }

  function saveHistoryCacheDebounced(){
    if(historyCacheSaveTimer) clearTimeout(historyCacheSaveTimer);
    historyCacheSaveTimer = setTimeout(function(){
      try {
        var toSave = {};
        Object.keys(catalogHistoryCache).forEach(function(id){
          var v = catalogHistoryCache[id];
          if(v && typeof v === 'object' && v.rows) toSave[id] = v;
        });
        localStorage.setItem(HISTORY_CACHE_KEY, JSON.stringify(toSave));

  function detectHeaderRowIndex(allRows){
    var maxScan = Math.min(allRows.length, 20);
    var bestIdx = 0, bestScore = -1;
    for(var i=0;i<maxScan;i++){
      var row = allRows[i];
      var nonEmpty = row.filter(function(c){ return String(c).trim() !== ''; }).length;
      if(nonEmpty < 2) continue;
      var score = 0;
      row.forEach(function(cell){
        var c = normName(cell);
        if(!c) return;
        HEADER_KEYWORDS.forEach(function(k){ if(c.indexOf(k) !== -1) score++; });
      });
      if(score > bestScore){ bestScore = score; bestIdx = i; }
    }
    return bestScore > 0 ? bestIdx : 0;
  }

  function doOrderImport(){
    var sid = document.getElementById('pt-ord-supplier').value;
    var fb = document.getElementById('pt-ord-feedback');
    if(!sid){ fb.className='feedback err'; fb.textContent='Selectează furnizorul.'; return; }
    var m = {};
    ORDER_FIELD_DEFS.forEach(function(f){ m[f.key] = parseInt(document.getElementById('pt-ord-map-'+f.key).value, 10); });
    if(m.name < 0 || m.price < 0 || m.orderQty < 0){
      fb.className='feedback err'; fb.textContent='Trebuie mapate cel puțin Nume, Preț și Cantitate comandată.'; return;
    }
    var defCurrency = document.getElementById('pt-ord-def-currency').value;
    var freight = document.getElementById('pt-ord-freight').value;
    var coef = parseFloat(document.getElementById('pt-ord-coef').value) || state.settings.coef;
    var eta = document.getElementById('pt-ord-eta').value || null;
    var today = todayStr();
    var lines = [], added = 0, updated = 0, errors = 0;

    importOrderFile.rows.forEach(function(r){
      var name = m.name>=0 ? String(r[m.name]||'').trim() : '';
      var price = parseFloat(String(r[m.price]).replace(',','.'));
      var qty = m.orderQty>=0 ? parseInt(String(r[m.orderQty]).replace(/[^0-9]/g,''),10) : NaN;
      if(!name || isNaN(price) || isNaN(qty) || qty <= 0){ errors++; return; }
      var currency = m.currency>=0 ? normalizeCurrency(r[m.currency], defCurrency) : defCurrency;
      var barcodeList = m.barcode>=0 ? extractBarcodes(r[m.barcode]) : [];
      var barcode = barcodeList.length ? barcodeList[0] : '';
      var altBarcodes = barcodeList.slice(1);
      // NU mai substituim automat barcode-ul lipsă cu unul găsit după nume în catalogul MoySklad —
      // am încercat asta, dar când barcode-ul din MoySklad e el însuși greșit/neactualizat pentru
      // acel produs, substituirea lega factura de un produs GREȘIT (alt barcode = altă cheie =
      // rescriere silențioasă a numelui după produsul greșit din MoySklad), motiv pentru care unele
      // produse (ex: ELROEL) preau ca „lipsesc" — de fapt fuseseră redenumite pe ascuns. Datele din
      // factură rămân sursa de adevăr aici; legarea de MoySklad se face doar dacă factura însăși are
      // barcode corect, sau manual prin „unește" din Comparație produse.
      var quantity = m.quantity>=0 ? String(r[m.quantity]||'').trim() : '';
      var brand = m.brand>=0 ? String(r[m.brand]||'').trim() : '';
      var rrpVal = m.rrp>=0 ? parseFloat(String(r[m.rrp]).replace(',','.')) : NaN;
      var moqVal = m.moq>=0 ? parseInt(String(r[m.moq]).replace(/[^0-9]/g,''),10) : NaN;
      var packQtyVal = m.packQty>=0 ? parseInt(String(r[m.packQty]).replace(/[^0-9]/g,''),10) : NaN;
      var weightVal = m.weight>=0 ? parseFloat(String(r[m.weight]).replace(',','.')) : NaN;

      var key = makeKey(barcode, name, quantity);
      var existedBefore = !!state.products[key] && !!(state.products[key].bySupplier[sid]);
      upsertProduct({ name:name, brand:brand, quantity:quantity, barcode:barcode, altBarcodes:altBarcodes, price:price, currency:currency, freight:freight, rrp:isNaN(rrpVal)?null:rrpVal, moq:isNaN(moqVal)?null:moqVal, packQty:isNaN(packQtyVal)?null:packQtyVal, weightGrams:isNaN(weightVal)?null:weightVal }, sid, today);
      if(existedBefore) updated++; else added++;

      var finalKey = makeKey(barcode, name, quantity);
      var priceUSD = toUSD(price, currency);
      var discPct = supplierDiscountPct(sid);
      var finalUSD = discPct ? priceUSD * (1 - discPct/100) : priceUSD;
      lines.push({ key: finalKey, name: state.products[finalKey].displayName, brand: brand, currency: 'USD', price: finalUSD, qty: qty, lineTotal: finalUSD * qty, discPct: discPct });
    });

    if(lines.length === 0){ fb.className='feedback err'; fb.textContent='Niciun rând valid găsit — verifică maparea (Nume, Preț, Cantitate comandată).'; return; }

    var totals = {};
    lines.forEach(function(l){ totals[l.currency] = (totals[l.currency]||0) + l.lineTotal; });
    var landedTotal = 0;
    lines.forEach(function(l){ landedTotal += toUSD(l.price, l.currency) * state.settings.exchangeRate * coef; });
    // O comandă adusă direct din MoySklad (Заказы поставщикам) înseamnă că factura e deja
    // înregistrată acolo, deci marfa e deja „pe drum" — dacă MoySklad arată că a fost și
    // recepționată integral (shippedSum >= sum), sare direct la „Recepționată".
    var msOrderId = importOrderFile.moyskladOrderId || null;
    var initialStatus = 'confirmata';
    if(msOrderId){
      var msFullyReceived = importOrderFile.moyskladSum > 0 && importOrderFile.moyskladShippedSum >= importOrderFile.moyskladSum;
      initialStatus = msFullyReceived ? 'received' : 'in-transit';
    }
    state.orders.unshift({ id: uid(), supplierId: sid, date: today, eta: eta, status: initialStatus, freight: freight, coef: coef, landedTotal: landedTotal, lines: lines, totals: totals, moyskladOrderId: msOrderId, moyskladCheckedAt: msOrderId ? Date.now() : null });
    lines.forEach(function(l){
      var prod = state.products[l.key];
      if(prod && prod.bySupplier[sid]){
        var lpLanded = toUSD(l.price, l.currency) * state.settings.exchangeRate * coef;
        prod.bySupplier[sid].lastPurchase = { price: l.price, currency: l.currency, date: today, qty: l.qty, landedCost: lpLanded };
      }
    });

    save();
    fb.className='feedback ok';
    fb.textContent = 'Comandă înregistrată: ' + lines.length + ' produse (' + added + ' noi, ' + updated + ' actualizate)' + (errors>0?(', '+errors+' rânduri ignorate'):'') + '. Status: ' + ORDER_STATUS_LABELS[initialStatus] + '.';
    importOrderFile = null;
    renderCompare();
    if(document.getElementById('pt-order-history')) renderOrderHistory();
    ptToast('Comandă înregistrată — produsele sunt marcate „rezervat".', true);
  }

  // ================= POZE INSERATE ÎN EXCEL (per rând, la import) =================
  // Excel-ul ține pozele lipite în celule ca fișiere separate în arhiva .xlsx, cu un XML de
  // "desen" care leagă fiecare poză de un anumit rând din foaie. Le extragem cu JSZip, le
  // micșorăm (sunt doar pentru referință vizuală) și le urcăm în Supabase Storage — NU în
  // starea partajată direct, ca să nu îngreunăm fiecare salvare cu megaocteți de imagini.
  async function extractExcelImagesByRow(arrayBuffer){
    var out = {};
    var TAG = '[poze Excel]';
    try {
      var zip = await JSZip.loadAsync(arrayBuffer);
      var wbXmlFile = zip.file('xl/workbook.xml');
      var wbRelsFile = zip.file('xl/_rels/workbook.xml.rels');
      if(!wbXmlFile || !wbRelsFile){ console.warn(TAG, 'lipsește xl/workbook.xml sau rels — fișier neașteptat'); return out; }
      var parser = new DOMParser();
      var wbDoc = parser.parseFromString(await wbXmlFile.async('string'), 'application/xml');
      var firstSheetEl = wbDoc.getElementsByTagName('sheet')[0];
      if(!firstSheetEl){ console.warn(TAG, 'nu am găsit elementul <sheet> în workbook.xml'); return out; }
      var rId = firstSheetEl.getAttribute('r:id') || firstSheetEl.getAttribute('rId');
      var wbRelsDoc = parser.parseFromString(await wbRelsFile.async('string'), 'application/xml');
      var rels = Array.prototype.slice.call(wbRelsDoc.getElementsByTagName('Relationship'));
      var sheetRel = rels.find(function(r){ return r.getAttribute('Id') === rId; });
      if(!sheetRel){ console.warn(TAG, 'nu am găsit relația r:id=' + rId + ' pentru prima foaie'); return out; }
      var sheetTarget = sheetRel.getAttribute('Target').replace(/^\/?/,'');
      var sheetPath = sheetTarget.indexOf('xl/') === 0 ? sheetTarget : ('xl/' + sheetTarget);
      var pathParts = sheetPath.split('/');
      var sheetFile = pathParts.pop();
      var sheetRelsPath = pathParts.join('/') + '/_rels/' + sheetFile + '.rels';
      var sheetRelsFile = zip.file(sheetRelsPath);
      if(!sheetRelsFile){ console.log(TAG, 'foaia „' + sheetFile + '" nu are fișier de relații (' + sheetRelsPath + ') — probabil nu conține nicio poză'); return out; }
      var sheetRelsDoc = parser.parseFromString(await sheetRelsFile.async('string'), 'application/xml');
      var sheetRels = Array.prototype.slice.call(sheetRelsDoc.getElementsByTagName('Relationship'));
      var drawingRel = sheetRels.find(function(r){ return (r.getAttribute('Type')||'').indexOf('/drawing') !== -1; });
      if(!drawingRel){ console.log(TAG, 'foaia „' + sheetFile + '" nu are nicio relație de tip drawing — probabil nu conține poze inserate în celule'); return out; }
      var drawingTarget = drawingRel.getAttribute('Target').replace(/^\.\.\//,'').replace(/^\/?/,'');
      var drawingPath = drawingTarget.indexOf('xl/') === 0 ? drawingTarget : ('xl/' + drawingTarget);
      var drawingFile = zip.file(drawingPath);
      if(!drawingFile){ console.warn(TAG, 'fișierul de desen ' + drawingPath + ' lipsește din arhivă'); return out; }
      var drawingParts = drawingPath.split('/');
      var drawingFileName = drawingParts.pop();
      var drawingRelsPath = drawingParts.join('/') + '/_rels/' + drawingFileName + '.rels';
      var drawingRelsFile = zip.file(drawingRelsPath);
      var imgIdToPath = {};
      if(drawingRelsFile){
        var drawingRelsDoc = parser.parseFromString(await drawingRelsFile.async('string'), 'application/xml');
        Array.prototype.slice.call(drawingRelsDoc.getElementsByTagName('Relationship')).forEach(function(r){
          var target = r.getAttribute('Target').replace(/^\.\.\//,'').replace(/^\/?/,'');
          imgIdToPath[r.getAttribute('Id')] = target.indexOf('xl/') === 0 ? target : ('xl/' + target);
        });
      }
      var drawingDoc = parser.parseFromString(await drawingFile.async('string'), 'application/xml');
      var anchors = Array.prototype.slice.call(drawingDoc.getElementsByTagName('xdr:twoCellAnchor'))
        .concat(Array.prototype.slice.call(drawingDoc.getElementsByTagName('xdr:oneCellAnchor')));
      console.log(TAG, anchors.length + ' ancore de desen găsite, ' + Object.keys(imgIdToPath).length + ' imagini referențiate');
      var rowToPath = {};
      anchors.forEach(function(anchor){
        var from = anchor.getElementsByTagName('xdr:from')[0];
        var rowEl = from && from.getElementsByTagName('xdr:row')[0];
        var blip = anchor.getElementsByTagName('a:blip')[0];
        var embedId = blip && (blip.getAttribute('r:embed') || blip.getAttribute('r:link'));
        if(rowEl && embedId && imgIdToPath[embedId]){
          rowToPath[parseInt(rowEl.textContent, 10)] = imgIdToPath[embedId];
        }
      });
      var uniquePaths = Array.from(new Set(Object.values(rowToPath)));
      var blobs = {};
      await Promise.all(uniquePaths.map(async function(p){
        var f = zip.file(p);
        if(f) blobs[p] = await f.async('blob');
        else console.warn(TAG, 'fișierul imagine ' + p + ' nu există în arhivă');
      }));
      Object.keys(rowToPath).forEach(function(row){
        var blob = blobs[rowToPath[row]];
        if(blob) out[row] = blob;
      });
      console.log(TAG, Object.keys(out).length + ' poze potrivite cu un rând de date');
    } catch(e){ console.warn(TAG, 'eroare la extragere', e); }
    return out;
  }
  function downscaleImageBlob(blob, maxDim){
    return new Promise(function(resolve){
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        canvas.toBlob(function(outBlob){ resolve(outBlob || blob); }, 'image/jpeg', 0.82);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(blob); };
      img.src = url;
    });
  }
  async function uploadPriceListImage(blob, keyHint){
    try {
      var path = 'pricelist/' + keyHint + '_' + Date.now() + '.jpg';
      var res = await supabaseClient.storage.from('product-images').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
      if(res.error){ console.warn('[poze Excel] eroare la urcare în Storage:', res.error); return null; }
      var pub = supabaseClient.storage.from('product-images').getPublicUrl(path);
      return (pub && pub.data && pub.data.publicUrl) || null;
    } catch(e){ console.warn('[poze Excel] eroare neașteptată la urcare:', e); return null; }
  }
  async function attachExcelImagesForFile(file, rowKeyMap){
    if(!file.rawBuffer || !file.rowOrigIndices) return;
    var imagesByRow = await extractExcelImagesByRow(file.rawBuffer);
    var rowNums = Object.keys(imagesByRow);
    if(!rowNums.length){ ptToast('„' + file.fileName + '": nicio poză găsită în fișier (verifică consola browserului — F12 — pentru detalii).', false); return; }
    var sheetRowToDataIndex = {};
    file.rowOrigIndices.forEach(function(sheetRow, dataIdx){ sheetRowToDataIndex[sheetRow] = dataIdx; });
    var matched = 0, uploaded = 0;
    for(var i=0; i<rowNums.length; i++){
      var sheetRow = parseInt(rowNums[i], 10);
      var dataRowIndex = sheetRowToDataIndex[sheetRow];
      var key = dataRowIndex != null ? rowKeyMap[dataRowIndex] : null;
      if(!key || !state.products[key]) continue;
      matched++;
      var small = await downscaleImageBlob(imagesByRow[sheetRow], 300);
      var url = await uploadPriceListImage(small, key.replace(/[^a-zA-Z0-9]/g,'_'));
      if(url){ state.products[key].excelImageUrl = url; uploaded++; }
    }
    if(uploaded > 0){ save(); renderCompare(); }
    if(matched === 0){
      ptToast('„' + file.fileName + '": am găsit ' + rowNums.length + ' poză/poze în fișier, dar niciuna nu s-a potrivit cu un rând importat.', false);
    } else if(uploaded < matched){
      ptToast('„' + file.fileName + '": ' + uploaded + ' din ' + matched + ' poze urcate — verifică dacă bucket-ul „product-images” din Supabase Storage există și are politica de upload activă.', false);
    } else {
      ptToast('„' + file.fileName + '": ' + uploaded + ' poze adăugate.', true);
    }
  }

      var parsed = [];

      fileList.forEach(function(file){

            var data = new Uint8Array(e.target.result);

            var sheet = wb.Sheets[wb.SheetNames[0]];
            var rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            // Ținem evidența rândului ORIGINAL din foaie pentru fiecare rând care rămâne după
            // eliminarea celor goale — pozele lipite în Excel sunt legate de numărul de rând
            // real din foaie, nu de poziția din lista filtrată, așa că trebuie păstrată corect

            var rows = [], origIndices = [];

          pendingCount--;
          if(pendingCount === 0){
            if(parsed.length === 0){ ptToast('Niciun fișier nu a putut fi citit.', false); return; }
            // Fișierele NU se importă imediat — devin „în așteptare" ca să verifici maparea
            // pentru fiecare (poate diferi de la un brand la altul) înainte să creeze produse.
            // rawBuffer (conținutul binar, pentru pozele din Excel) NU intră în starea salvată
            // — un ArrayBuffer nu se poate serializa în JSON — rămâne doar în memorie, per sesiune.
            var reusedCount = 0;
            parsed.forEach(function(f){
              // Dacă acest fișier are exact același nume ca un price list DEJA aplicat (nu unul
              // încă în așteptare — ăla poate fi un frate din același lot, cu nume coincident) la
              // același furnizor, îl tratăm ca pe o versiune actualizată a aceluiași brand: preluăm
              // maparea folosită data trecută (nu mai trebuie setată din nou) și, la reaplicare,
              // înlocuim prețurile vechi cu cele noi în loc să adăugăm o listă separată/duplicat.
              var prevApplied = state.priceLists.find(function(pl){ return !pl.pending && pl.supplierId === sid && pl.fileName === f.fileName; });
              if(prevApplied){
                pendingRawBuffers[prevApplied.id] = f.rawBuffer;
                prevApplied.headers = f.headers;
                prevApplied.rows = f.rows;
                prevApplied.skippedRows = f.skippedRows;
                prevApplied.rowOrigIndices = f.rowOrigIndices;
                prevApplied.pending = true;
                reusedCount++;

                pendingRawBuffers[newId] = f.rawBuffer;

              }
            });
            save();
            ev.target.value = '';
            ptToast(parsed.length + ' fișier(e) încărcate' + (reusedCount ? (', ' + reusedCount + ' recunoscute ca actualizare a unei liste deja importate (maparea se completează automat)') : '') + ' — verifică mai jos înainte să se creeze produse.', true);
            renderExcelImport();
          }
        };
        reader.readAsArrayBuffer(file);
      });
    });

  function colLabel(idx){
    var letters = '';

    do { letters = String.fromCharCode(65 + (n % 26)) + letters; n = Math.floor(n/26) - 1; } while(n >= 0);
    return letters;
  }

  function patternMatches(header, pattern){
    if(pattern.length <= 4){
      var re = new RegExp('\\b' + pattern.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b', 'i');
      return re.test(header);
    }
    return header.indexOf(pattern) !== -1;
  }
  function guessColumn(headers, patterns, excludePatterns){
    for(var pass=0; pass<2; pass++){
      for(var i=0;i<headers.length;i++){
        if(pass===0 && hasHangul(headers[i])) continue;
        var h = normName(headers[i]);
        if(excludePatterns && excludePatterns.some(function(ex){ return h.indexOf(ex) !== -1; })) continue;
        for(var j=0;j<patterns.length;j++){ if(patternMatches(h, patterns[j])) return i; }
      }
    }
    return -1;
  }

    var warnBox = document.getElementById('pt-currency-warn');
    if(warnBox) warnBox.remove();
    if(m.price >= 0){
      var defCurEl = document.getElementById('pt-map-def-currency');
      var defCur = defCurEl ? defCurEl.value : 'USD';
      var prices = sample.map(function(r){ return parseFloat(String(r[m.price]).replace(',','.')); }).filter(function(n){ return !isNaN(n); });
      if(prices.length){
        var avg = prices.reduce(function(a,b){ return a+b; }, 0) / prices.length;
        var warnMsg = null;
        if((defCur === 'USD' || defCur === 'MDL') && avg > 300) warnMsg = 'Prețurile din previzualizare par mari pentru ' + defCur + ' (medie ~' + Math.round(avg) + '). Verifică — nu cumva sunt de fapt woni (KRW)?';
        else if(defCur === 'KRW' && avg < 50) warnMsg = 'Prețurile din previzualizare par mici pentru woni (medie ~' + Math.round(avg) + '). Verifică — nu cumva sunt de fapt USD?';
        if(warnMsg){
          var w = document.createElement('div');
          w.id = 'pt-currency-warn';
          w.style.cssText = 'background:var(--rank3-bg);border:1px solid var(--rank3);color:var(--rank3);border-radius:7px;padding:8px 12px;font-size:12px;margin-top:8px';
          w.textContent = '⚠ ' + warnMsg;
          preview.parentNode.insertBefore(w, preview.nextSibling);
        }
      }
    }
  };

  function doExcelImport(){
    var sid = document.getElementById('pt-imp-supplier').value;
    if(!sid){
      var fb0 = document.getElementById('pt-imp-feedback');
      fb0.className = 'feedback err'; fb0.textContent = 'Selectează furnizorul înainte de a importa.';
      return;
    }
    var m = currentMapping();
    if(m.name < 0 || m.price < 0){
      var fb = document.getElementById('pt-imp-feedback');
      fb.className = 'feedback err'; fb.textContent = 'Trebuie să mapezi cel puțin coloana Produs și coloana Preț.';
      return;
    }
    var defBrand = document.getElementById('pt-map-def-brand').value.trim();
    var defCurrency = document.getElementById('pt-map-def-currency').value;
    var defFreight = document.getElementById('pt-map-def-freight').value;
    var today = new Date().toISOString().slice(0,10);
    var added=0, updated=0, increases=0, errors=0;
    var filesToProcess = (importFiles && importFiles.length) ? importFiles : [importState];

    filesToProcess.forEach(function(file){
      var fileBrand = file.detectedBrand || defBrand;
      if(fileBrand) setBrandCurrency(fileBrand, defCurrency);
      var touchedKeys = [];
      var rowKeyMap = {};
      file.rows.forEach(function(r, i){
        var name = m.name>=0 ? String(r[m.name]||'').trim() : '';
        var priceRaw = m.price>=0 ? r[m.price] : '';
        var price = parseFloat(String(priceRaw).replace(',','.'));
        if(!name || isNaN(price)){ errors++; return; }
        var currency = m.currency>=0 ? normalizeCurrency(r[m.currency], defCurrency) : defCurrency;
        var barcodeList = m.barcode>=0 ? extractBarcodes(r[m.barcode]) : [];
        var barcode = barcodeList.length ? barcodeList[0] : '';
        var altBarcodes = barcodeList.slice(1);
        var quantity = m.quantity>=0 ? String(r[m.quantity]||'').trim() : '';
        var brand = (m.brand>=0 ? String(r[m.brand]||'').trim() : '') || fileBrand;
        var rrpVal = m.rrp>=0 ? parseFloat(String(r[m.rrp]).replace(',','.')) : NaN;
        var moqVal = m.moq>=0 ? parseInt(String(r[m.moq]).replace(/[^0-9]/g,''), 10) : NaN;
        var packQtyVal = m.packQty>=0 ? parseInt(String(r[m.packQty]).replace(/[^0-9]/g,''), 10) : NaN;
        var weightVal = m.weight>=0 ? parseFloat(String(r[m.weight]).replace(',','.')) : NaN;

        var key = makeKey(barcode, name, quantity);
        var existedBefore = !!state.products[key] && !!(state.products[key].bySupplier[sid]);
        var wasIncrease = upsertProduct({ name: name, brand: brand, quantity: quantity, barcode: barcode, altBarcodes: altBarcodes, price: price, currency: currency, freight: defFreight, rrp: isNaN(rrpVal) ? null : rrpVal, moq: isNaN(moqVal) ? null : moqVal, packQty: isNaN(packQtyVal) ? null : packQtyVal, weightGrams: isNaN(weightVal) ? null : weightVal }, sid, today);
        if(existedBefore){ updated++; if(wasIncrease) increases++; } else { added++; }
        touchedKeys.push(key);
        rowKeyMap[i] = key;
      });
      if(touchedKeys.length){
        // Țintim exact price list-ul respectiv, după id — NICIODATĂ după nume de fișier
        // (fișiere diferite de la branduri diferite pot avea din întâmplare același nume,
        // iar potrivirea după nume a dus la pierderea unor liste distincte).
        var existingPL = editingPriceListId ? state.priceLists.find(function(pl){ return pl.id === editingPriceListId; }) : null;
        if(existingPL){
          var wasPending = existingPL.pending;
          // Produsele care n-au fost în versiunea anterioară a acestui price list sunt noi —
          // le marcăm ca „NEW" în Comparație produse; cele care erau deja acolo nu mai sunt noi.
          // La PRIMA aplicare a unei liste (wasPending true) productKeys e mereu gol, deci fără
          // acest control totul ar ieși „nou" — de-asta NEW apărea practic la toate produsele.
          var oldKeySet = {};
          existingPL.productKeys.forEach(function(k){ oldKeySet[k] = true; });
          var newKeySet = {};
          touchedKeys.forEach(function(k){
            newKeySet[k] = true;
            if(!state.products[k]) return;
            if(!oldKeySet[k]){
              if(wasPending){ state.products[k].isNew = false; }
              else { state.products[k].isNew = true; state.products[k].newAt = today; }
            } else { state.products[k].isNew = false; }
          });
          // Produsele care erau în versiunea anterioară a acestei liste dar au dispărut din cea
          // nouă — furnizorul nu le mai oferă — nu mai primesc preț de la acest furnizor, ca să
          // nu rămână agățate cu date vechi.
          var removedFromSupplier = 0;
          existingPL.productKeys.forEach(function(k){
            if(newKeySet[k]) return;
            var p = state.products[k];
            if(p && p.bySupplier[sid]){ delete p.bySupplier[sid]; removedFromSupplier++; }
          });
          existingPL.fileName = file.fileName;
          existingPL.brand = fileBrand || '';
          existingPL.importedAt = today;
          existingPL.productKeys = touchedKeys;
          existingPL.headers = file.headers;
          existingPL.rows = file.rows;
          existingPL.skippedRows = file.skippedRows || 0;
          existingPL.mapping = m;
          existingPL.pending = false;
          delete pendingRawBuffers[existingPL.id];
          if(wasPending) justAppliedIds[existingPL.id] = true;
        } else {
          state.priceLists.push({ id: uid(), supplierId: sid, fileName: file.fileName, brand: fileBrand || '', importedAt: today, productKeys: touchedKeys, headers: file.headers, rows: file.rows, skippedRows: file.skippedRows || 0, mapping: m, pending: false });
        }
      }
      // Extragerea și urcarea pozelor lipite în Excel se face în fundal, fără să blocheze
      // înregistrarea prețurilor de mai sus (asta e partea critică, trebuie să rămână rapidă).
      if(file.rawBuffer) attachExcelImagesForFile(file, rowKeyMap);
    });

    // Brandul implicit NU se ține minte între importuri — de la același furnizor vin mereu
    // fișiere cu branduri diferite, deci ar rămâne greșit completat cu cel anterior.
    state.importMappings[sid] = { mapping: m, defCurrency: defCurrency, defFreight: defFreight };
    save();
    var fb = document.getElementById('pt-imp-feedback');
    var msg = (editingPriceListId ? 'Price list actualizat: ' : '') + added + ' produse noi, ' + updated + ' actualizate';
    if(filesToProcess.length > 1) msg += ' (din ' + filesToProcess.length + ' fișiere)';
    if(increases>0) msg += ', ' + increases + ' cu preț crescut';
    if(errors>0) msg += ', ' + errors + ' rânduri ignorate (lipsă produs/preț)';
    fb.className = 'feedback ok'; fb.textContent = msg;
    importFiles = null; importState = null; editingPriceListId = null;
    renderCompare();
    renderExcelImport();
  }

  function productsForSupplier(sid){
    return Object.keys(state.products).filter(function(k){ return state.products[k].bySupplier[sid] && !state.products[k].archived; })
      .map(function(k){ return { key: k, p: state.products[k], e: state.products[k].bySupplier[sid] }; })
      .sort(function(a,b){ return a.p.displayName.localeCompare(b.p.displayName, undefined, {sensitivity:'base', numeric:true}); });
  }

  function renderOrderRows(){
    var tbody = document.getElementById('pt-order-rows');
    var items = productsForSupplier(currentOrderSupplier);
    var cart = state.carts[currentOrderSupplier] || {};
    var cartKeys = Object.keys(cart).filter(function(k){ return cart[k] > 0; });
    if(cartKeys.length === 0){ tbody.innerHTML = '<tr><td colspan="5" style="font-family:var(--sans);color:var(--text-soft);padding:16px 14px">Coșul e gol. Adaugă produse de mai jos sau direct din tab-ul Comparație produse.</td></tr>'; return; }
    tbody.innerHTML = cartKeys.map(function(key){
      var it = items.find(function(x){ return x.key === key; });
      if(!it) return '';
      var qty = cart[key];
      var transit = getInTransitInfo(it.key);
      var transitNote = transit.qty > 0 ? ('<br><span style="font-size:10px;color:' + (transit.overdue?'var(--bad)':'var(--rank2)') + '">' + (transit.overdue ? 'întârziat' : 'pe drum (' + freightLabel(transit.freight) + ')') + ': ' + transit.qty + (transit.eta ? (' · '+transit.eta) : '') + '</span>') : '';
      var lastP = it.e.lastPurchase ? ('<br><span style="font-size:10px;color:var(--text-soft)">ultima achiziție: ' + fmt(toUSD(it.e.lastPurchase.price, it.e.lastPurchase.currency)) + ' USD</span>') : '';
      var moqNote = it.e.moq ? ('<br><span style="font-size:10px;color:var(--text-soft)">MOQ: ' + it.e.moq + ' buc</span>') : '';
      var belowMoq = it.e.moq && qty && qty < it.e.moq;
      return '<tr><td style="font-family:var(--sans)">' + it.p.displayName + (it.p.quantity ? ' <span style="color:var(--text-soft)">(' + it.p.quantity + ')</span>' : '') + transitNote + '</td>' +
        '<td>' + (it.p.brand||'—') + '</td><td>' + fmt(toUSD(it.e.price, it.e.currency)) + ' USD' + lastP + moqNote + '</td>' +
        '<td><input class="qty-input" type="number" min="0" value="' + qty + '" style="' + (belowMoq?'border-color:var(--bad)':'') + '" onchange="ptSetOrderQty(\'' + it.key.replace(/'/g,"\\'") + '\', this.value)">' +
        (belowMoq ? '<br><span style="font-size:10px;color:var(--bad)">sub MOQ (min ' + it.e.moq + ')</span>' : '') + '</td>' +
        '<td><button class="icon-x" onclick="ptSetOrderQty(\'' + it.key.replace(/'/g,"\\'") + '\', 0)" title="Elimină din coș">✕</button></td></tr>';
    }).join('');
  }

  window.ptOrderSearch = function(query){
    var box = document.getElementById('pt-order-search-results');
    if(!box) return;
    var q = normName(query);
    if(q.length < 2){ box.innerHTML = ''; return; }
    var cart = state.carts[currentOrderSupplier] || {};
    var matches = productsForSupplier(currentOrderSupplier).filter(function(it){
      return !cart[it.key] && normName(it.p.displayName).indexOf(q) !== -1;
    }).slice(0, 8);
    if(matches.length === 0){ box.innerHTML = '<span style="font-size:11.5px;color:var(--text-soft)">Niciun rezultat</span>'; return; }
    box.innerHTML = matches.map(function(it){
      return '<button class="icon-link" style="display:block;width:100%;text-align:left;border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin-top:4px" onclick="ptAddOrderProduct(\'' + it.key.replace(/'/g,"\\'") + '\')">' + it.p.displayName + ' — ' + fmt(toUSD(it.e.price, it.e.currency)) + ' USD</button>';
    }).join('');
  };
  window.ptAddOrderProduct = function(key){
    if(!state.carts[currentOrderSupplier]) state.carts[currentOrderSupplier] = {};
    state.carts[currentOrderSupplier][key] = (state.carts[currentOrderSupplier][key] || 0) + 1;
    save(); renderOrderRows(); renderOrderSummary();
    var box = document.getElementById('pt-order-search-results'); if(box) box.innerHTML = '';
    var inp = document.getElementById('pt-order-search'); if(inp) inp.value = '';
  };

  window.ptSetOrderQty = function(key, val){
    var n = parseInt(val, 10);
    if(!state.carts[currentOrderSupplier]) state.carts[currentOrderSupplier] = {};
    if(!n || n <= 0) delete state.carts[currentOrderSupplier][key]; else state.carts[currentOrderSupplier][key] = n;
    save(); renderOrderRows(); renderOrderSummary();
  };

  function getOrderLines(){
    var items = productsForSupplier(currentOrderSupplier);
    var cart = state.carts[currentOrderSupplier] || {};
    var discPct = supplierDiscountPct(currentOrderSupplier);
    return Object.keys(cart).map(function(key){
      var it = items.find(function(x){ return x.key === key; });
      if(!it) return null;
      var qty = cart[key];
      var priceUSD = toUSD(it.e.price, it.e.currency) * (1 - discPct/100);
      return { key: key, name: it.p.displayName, brand: it.p.brand, currency: 'USD', price: priceUSD, qty: qty, lineTotal: priceUSD * qty, discPct: discPct, weightGrams: it.e.weightGrams || 0 };
    }).filter(Boolean);
  }

  function getOrderCoef(){
    var el = document.getElementById('pt-order-coef');
    return el && parseFloat(el.value) > 0 ? parseFloat(el.value) : state.settings.coef;
  }
  function getOrderFreight(){
    var el = document.getElementById('pt-order-freight');
    return el ? el.value : 'sea';
  }
  function renderOrderSummary(){
    var lines = getOrderLines();
    var box = document.getElementById('pt-order-summary');
    if(lines.length === 0){ box.innerHTML = '<div style="color:var(--text-soft);font-size:13px">Nicio cantitate introdusă încă.</div>'; return; }
    var totals = {};
    lines.forEach(function(l){ totals[l.currency] = (totals[l.currency]||0) + l.lineTotal; });
    var coef = getOrderCoef();
    var landedTotal = 0;
    lines.forEach(function(l){ landedTotal += toUSD(l.price, l.currency) * state.settings.exchangeRate * coef; });
    var totalWeightKg = 0;
    lines.forEach(function(l){ totalWeightKg += (l.weightGrams * l.qty) / 1000; });
    var discPct = lines[0] ? lines[0].discPct : 0;
    var html = discPct ? ('<div class="feedback ok" style="margin-bottom:8px">Reducere ' + discPct + '% aplicată la prețurile ' + supplierName(currentOrderSupplier) + ' (prețuri deja finale).</div>') : '';
    html += lines.map(function(l){ return '<div class="order-line"><span>' + l.name + ' × ' + l.qty + '</span><span>' + fmt(l.lineTotal) + ' ' + l.currency + '</span></div>'; }).join('');
    Object.keys(totals).forEach(function(cur){
      html += '<div class="order-total"><span>Total ' + cur + '</span><span>' + fmt(totals[cur]) + '</span></div>';
    });
    html += '<div class="order-total" style="color:var(--accent-dark)"><span>Cost estimat la destinație</span><span>' + fmt(landedTotal) + ' MDL</span></div>';
    if(totalWeightKg > 0){
      html += '<div class="order-total" style="color:var(--text-soft);font-weight:400"><span>Greutate totală estimată</span><span>' + fmt(totalWeightKg) + ' kg</span></div>';
    }
    box.innerHTML = html;
  }

  function exportOrderExcel(){
    var lines = getOrderLines();
    if(lines.length === 0){ ptToast('Adaugă cel puțin o cantitate.', false); return; }
    var coef = getOrderCoef(), freight = getOrderFreight();
    var wsData = [['Produs','Brand','Cantitate','Preț unitar','Monedă','Total linie']];
    lines.forEach(function(l){ wsData.push([l.name, l.brand, l.qty, l.price, l.currency, l.lineTotal]); });
    var totals = {};
    lines.forEach(function(l){ totals[l.currency] = (totals[l.currency]||0) + l.lineTotal; });

  var ORDER_STATUS_COLORS = { 'trimisa':'var(--text-soft)', 'confirmata':'var(--rank2)', 'in-transit':'var(--rank3)', 'received':'var(--rank1)' };

  // ================= COST TRANSPORT REAL → COEFICIENT REAL PE COMANDĂ =================
  function orderInvoiceUSD(o){
    var sum = 0;
    Object.keys(o.totals || {}).forEach(function(c){ sum += toUSD(o.totals[c], c); });
    return sum;
  }
  function computeRealCoef(o){
    var af = o.actualFreight;
    if(!af || af.cost == null || isNaN(af.cost)) return null;
    var invoiceUSD = orderInvoiceUSD(o);
    if(!invoiceUSD) return null;
    var invoiceMDL = invoiceUSD * state.settings.exchangeRate;
    var freightMDL = toUSD(af.cost, af.currency) * state.settings.exchangeRate;
    var customsPct = (af.customsPct != null && !isNaN(af.customsPct)) ? af.customsPct : 27;
    var baseMDL = invoiceMDL + freightMDL;
    var totalLandedMDL = baseMDL * (1 + customsPct/100);
    return totalLandedMDL / invoiceMDL;
  }
  function buildRealFreightPanelHtml(o){
    var af = o.actualFreight || {};
    var currency = af.currency || 'USD';
    var rateLabel = currency === 'MDL' ? 'Curs USD → MDL' : (currency === 'EUR' ? 'Curs USD → EUR' : 'Curs');
    var rateVal = currency === 'MDL' ? state.settings.exchangeRate : (currency === 'EUR' ? state.settings.eurPerUsd : 1);
    var realCoef = computeRealCoef(o);
    var appliedNote = (o.appliedRealCoef != null) ? ('<div style="color:var(--rank1);font-size:11.5px;margin-top:6px">✓ Coeficient real aplicat comenzii: ' + fmt(o.appliedRealCoef) + ' (implicit era ' + fmt(state.settings.coef) + ')</div>') : '';
    return '<div class="panel" style="background:var(--bg)"><h2 style="font-size:14px">Cost transport real (de la transportator)</h2>' +
      '<div class="hint">Dacă transportatorul ți-a dat deja prețul de transport pentru comandă, introdu-l aici — sinecostul se recalculează automat pe baza sumei reale (invoice + transport + ~taxe vamale), în loc de coeficientul implicit.</div>' +
      '<div class="row"><div><label>Cost transport</label><input type="number" step="0.01" id="pt-rf-cost" value="' + (af.cost != null ? af.cost : '') + '" placeholder="ex: 450"></div>' +
      '<div><label>Monedă</label><select id="pt-rf-currency"><option value="USD" ' + (currency==='USD'?'selected':'') + '>USD</option><option value="MDL" ' + (currency==='MDL'?'selected':'') + '>MDL</option><option value="EUR" ' + (currency==='EUR'?'selected':'') + '>EUR</option></select></div>' +
      '<div><label>' + rateLabel + '</label><input type="number" step="0.0001" id="pt-rf-rate" value="' + rateVal + '" ' + (currency==='USD'?'disabled title="Nu e nevoie de curs — transportul e deja în USD"':'title="Ajustează cursul dacă nu e cel corect — se salvează în Setări"') + '></div>' +
      '<div><label>Taxe vamale (%)</label><input type="number" step="0.5" id="pt-rf-customs" value="' + (af.customsPct != null ? af.customsPct : 27) + '"></div></div>' +
      (realCoef != null ? ('<div class="feedback ok" style="margin-top:0">Coeficient real calculat: <b>' + fmt(realCoef) + '</b> (invoice ' + fmt(orderInvoiceUSD(o)) + ' USD + transport + ~' + (af.customsPct != null ? af.customsPct : 27) + '% taxe vamale)</div>') : '') +
      '<button class="primary" id="pt-rf-apply" style="margin-top:8px">Aplică acest coeficient produselor din comandă</button>' +
      appliedNote + '</div>';
  }
  window.ptApplyRealFreight = function(id){
    var o = state.orders.find(function(x){ return x.id === id; });
    if(!o) return;
    var cost = parseFloat(document.getElementById('pt-rf-cost').value);
    var currency = document.getElementById('pt-rf-currency').value;
    var customsPct = parseFloat(document.getElementById('pt-rf-customs').value);
    if(isNaN(cost)){ ptToast('Introdu costul de transport.', false); return; }
    o.actualFreight = { cost: cost, currency: currency, customsPct: isNaN(customsPct) ? 27 : customsPct };
    var realCoef = computeRealCoef(o);
    if(realCoef == null){ ptToast('Nu am putut calcula — verifică valorile comenzii.', false); return; }
    o.appliedRealCoef = realCoef;
    o.coef = realCoef;
    o.landedTotal = orderInvoiceUSD(o) * state.settings.exchangeRate * realCoef;
    o.lines.forEach(function(l){
      var prod = state.products[l.key];
      if(prod && prod.bySupplier[o.supplierId] && prod.bySupplier[o.supplierId].lastPurchase && prod.bySupplier[o.supplierId].lastPurchase.date === o.date){
        prod.bySupplier[o.supplierId].lastPurchase.landedCost = toUSD(l.price, l.currency) * state.settings.exchangeRate * realCoef;
      }
    });
    save();
    renderOrderHistory(); renderCompare(); renderOrderRows();
    ptToast('Coeficient real aplicat: ' + fmt(realCoef) + '. Sinecosturile produselor din comandă au fost actualizate.', true);
  };

  function renderOrderHistory(){

      ensureOrderStatusChecked(o);

      var overdue = o.status !== 'received' && o.eta && o.eta < today;

        '</select>' + (overdue ? ' <span style="color:var(--bad);font-size:11px">· întârziat (est. ' + o.eta + ')</span>' : (o.eta && o.status !== 'received' ? ' <span style="color:var(--text-soft);font-size:11px">· sosire est. ' + o.eta + '</span>' : ''));
      var isOpen = openOrderId === o.id;
      var row = '<div class="history-row"><span>' + o.date + ' — ' + supplierName(o.supplierId) + ' (' + o.lines.length + ' produse) · ' + statusSelect + '</span>' +

        ' <button class="icon-link" onclick="ptToggleOrderDetail(\'' + o.id + '\')">' + (isOpen ? '▲ Închide' : '▼ Deschide') + '</button>' +
