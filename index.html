  function doOrderImport(){
    var sid = document.getElementById('pt-ord-supplier').value;
    var fb = document.getElementById('pt-ord-feedback');
    if(!sid){ fb.className='feedback err'; fb.textContent='Selectează furnizorul.'; return; }
    var m = {};
    ORDER_FIELD_DEFS.forEach(function(f){ m[f.key] = parseInt(document.getElementById('pt-ord-map-'+f.key).value, 10); });
    if(m.name < 0 || m.price < 0 || m.orderQty < 0){
      fb.className='feedback err'; fb.textContent='Trebuie mapate cel puțin Nume, Preț și Cantitate comandată.'; return;
    }
    var defCurrency = document.getElementById('pt-ord-def-currency').value;
    var freight = document.getElementById('pt-ord-freight').value;
    var coef = parseFloat(document.getElementById('pt-ord-coef').value) || state.settings.coef;
    var eta = document.getElementById('pt-ord-eta').value || null;
    var today = todayStr();
    var lines = [], added = 0, updated = 0, errors = 0;

    importOrderFile.rows.forEach(function(r){
      var name = m.name>=0 ? String(r[m.name]||'').trim() : '';
      var price = parseFloat(String(r[m.price]).replace(',','.'));
      var qty = m.orderQty>=0 ? parseInt(String(r[m.orderQty]).replace(/[^0-9]/g,''),10) : NaN;
      if(!name || isNaN(price) || isNaN(qty) || qty <= 0){ errors++; return; }
      var currency = m.currency>=0 ? normalizeCurrency(r[m.currency], defCurrency) : defCurrency;
      var barcodeList = m.barcode>=0 ? extractBarcodes(r[m.barcode]) : [];
      var barcode = barcodeList.length ? barcodeList[0] : '';
      var altBarcodes = barcodeList.slice(1);
      // NU mai substituim automat barcode-ul lipsă cu unul găsit după nume în catalogul MoySklad —
      // am încercat asta, dar când barcode-ul din MoySklad e el însuși greșit/neactualizat pentru
      // acel produs, substituirea lega factura de un produs GREȘIT (alt barcode = altă cheie =
      // rescriere silențioasă a numelui după produsul greșit din MoySklad), motiv pentru care unele
      // produse (ex: ELROEL) preau ca „lipsesc" — de fapt fuseseră redenumite pe ascuns. Datele din
      // factură rămân sursa de adevăr aici; legarea de MoySklad se face doar dacă factura însăși are
      // barcode corect, sau manual prin „unește" din Comparație produse.
      var quantity = m.quantity>=0 ? String(r[m.quantity]||'').trim() : '';
      var brand = m.brand>=0 ? String(r[m.brand]||'').trim() : '';
      var rrpVal = m.rrp>=0 ? parseFloat(String(r[m.rrp]).replace(',','.')) : NaN;
      var moqVal = m.moq>=0 ? parseInt(String(r[m.moq]).replace(/[^0-9]/g,''),10) : NaN;
      var packQtyVal = m.packQty>=0 ? parseInt(String(r[m.packQty]).replace(/[^0-9]/g,''),10) : NaN;
      var weightVal = m.weight>=0 ? parseFloat(String(r[m.weight]).replace(',','.')) : NaN;

      var key = makeKey(barcode, name, quantity);
      var existedBefore = !!state.products[key] && !!(state.products[key].bySupplier[sid]);
      // skipPriceUpdate=true: prețul de pe factura comenzii nu trebuie NICIODATĂ să înlocuiască
      // prețul din price list-ul furnizorului (chiar dacă unul există deja) — sînt lucruri diferite.
      // Prețul facturii rămâne separat, în lastPurchase (mai jos), exact ca sursă pentru sinecost.
      upsertProduct({ name:name, brand:brand, quantity:quantity, barcode:barcode, altBarcodes:altBarcodes, price:price, currency:currency, freight:freight, rrp:isNaN(rrpVal)?null:rrpVal, moq:isNaN(moqVal)?null:moqVal, packQty:isNaN(packQtyVal)?null:packQtyVal, weightGrams:isNaN(weightVal)?null:weightVal }, sid, today, true);
      if(existedBefore) updated++; else added++;

      var finalKey = makeKey(barcode, name, quantity);
      var priceUSD = toUSD(price, currency);
      var discPct = supplierDiscountPct(sid);
      var finalUSD = discPct ? priceUSD * (1 - discPct/100) : priceUSD;
      lines.push({ key: finalKey, name: state.products[finalKey].displayName, brand: brand, currency: 'USD', price: finalUSD, qty: qty, lineTotal: finalUSD * qty, discPct: discPct });
    });

    if(lines.length === 0){ fb.className='feedback err'; fb.textContent='Niciun rând valid găsit — verifică maparea (Nume, Preț, Cantitate comandată).'; return; }

    var totals = {};
    lines.forEach(function(l){ totals[l.currency] = (totals[l.currency]||0) + l.lineTotal; });
    var landedTotal = 0;
    lines.forEach(function(l){ landedTotal += toUSD(l.price, l.currency) * state.settings.exchangeRate * coef; });
    // O comandă adusă direct din MoySklad (Заказы поставщикам) înseamnă că factura e deja
    // înregistrată acolo, deci marfa e deja „pe drum" — dacă MoySklad arată că a fost și
    // recepționată integral (shippedSum >= sum), sare direct la „Recepționată".
    var msOrderId = importOrderFile.moyskladOrderId || null;
    // Dacă redu deja aceeași comandă MoySklad (identificată după moyskladOrderId), actualizăm
    // comanda existentă în loc s-o duplicăm — util cînd corectezi ceva direct în MoySklad
    // (preț, cantitate) și vrei ca datele de-aici să reflecte modificarea, fără o comandă nouă.
    var existingOrder = msOrderId ? state.orders.find(function(x){ return x.moyskladOrderId === msOrderId; }) : null;
    if(existingOrder){
      existingOrder.lines = lines;
      existingOrder.totals = totals;
      var landedTotalExisting = 0;
      lines.forEach(function(l){ landedTotalExisting += toUSD(l.price, l.currency) * state.settings.exchangeRate * existingOrder.coef; });
      existingOrder.landedTotal = landedTotalExisting;
      existingOrder.moyskladCheckedAt = Date.now();
      // Nu retrogradăm un status deja avansat manual (ex: marcat „Recepționată" de utilizator) —
      // doar promovăm automat la „Recepționată" dacă MoySklad arată acum că a fost recepționată.
      var msFullyReceivedNow = importOrderFile.moyskladSum > 0 && importOrderFile.moyskladShippedSum >= importOrderFile.moyskladSum;
      if(msFullyReceivedNow) existingOrder.status = 'received';
      lines.forEach(function(l){
        var prod = state.products[l.key];
        if(prod && prod.bySupplier[sid]){
          var lpLanded = toUSD(l.price, l.currency) * state.settings.exchangeRate * existingOrder.coef;
          prod.bySupplier[sid].lastPurchase = { price: l.price, currency: l.currency, date: today, qty: l.qty, landedCost: lpLanded };
        }
      });
      save();
      fb.className='feedback ok';
      fb.textContent = 'Comandă actualizată din MoySklad: ' + lines.length + ' produse (' + added + ' noi, ' + updated + ' actualizate)' + (errors>0?(', '+errors+' rânduri ignorate'):'') + '.';
      importOrderFile = null;
      renderCompare();
      if(document.getElementById('pt-order-history')) renderOrderHistory();
      ptToast('Comandă actualizată din MoySklad.', true);
      return;
    }
    var initialStatus = 'confirmata';
    if(msOrderId){
      var msFullyReceived = importOrderFile.moyskladSum > 0 && importOrderFile.moyskladShippedSum >= importOrderFile.moyskladSum;
      initialStatus = msFullyReceived ? 'received' : 'in-transit';
    }
    state.orders.unshift({ id: uid(), supplierId: sid, date: today, eta: eta, status: initialStatus, freight: freight, coef: coef, landedTotal: landedTotal, lines: lines, totals: totals, moyskladOrderId: msOrderId, moyskladCheckedAt: msOrderId ? Date.now() : null });
    lines.forEach(function(l){
      var prod = state.products[l.key];
      if(prod && prod.bySupplier[sid]){
        var lpLanded = toUSD(l.price, l.currency) * state.settings.exchangeRate * coef;
        prod.bySupplier[sid].lastPurchase = { price: l.price, currency: l.currency, date: today, qty: l.qty, landedCost: lpLanded };
      }
    });

    save();
    fb.className='feedback ok';
    fb.textContent = 'Comandă înregistrată: ' + lines.length + ' produse (' + added + ' noi, ' + updated + ' actualizate)' + (errors>0?(', '+errors+' rânduri ignorate'):'') + '. Status: ' + ORDER_STATUS_LABELS[initialStatus] + '.';
    importOrderFile = null;
    renderCompare();
    if(document.getElementById('pt-order-history')) renderOrderHistory();
    ptToast('Comandă înregistrată — produsele sunt marcate „rezervat".', true);
  }

  // ================= POZE INSERATE ÎN EXCEL (per rând, la import) =================
  // Excel-ul ține pozele lipite în celule ca fișiere separate în arhiva .xlsx, cu un XML de
  // "desen" care leagă fiecare poză de un anumit rând din foaie. Le extragem cu JSZip, le
  // micșorăm (sunt doar pentru referință vizuală) și le urcăm în Supabase Storage — NU în
  // starea partajată direct, ca să nu îngreunăm fiecare salvare cu megaocteți de imagini.
  async function extractExcelImagesByRow(arrayBuffer){
    var out = {};
    var TAG = '[poze Excel]';
    try {
      var zip = await JSZip.loadAsync(arrayBuffer);
      var wbXmlFile = zip.file('xl/workbook.xml');
      var wbRelsFile = zip.file('xl/_rels/workbook.xml.rels');
      if(!wbXmlFile || !wbRelsFile){ console.warn(TAG, 'lipsește xl/workbook.xml sau rels — fișier neașteptat'); return out; }
      var parser = new DOMParser();
      var wbDoc = parser.parseFromString(await wbXmlFile.async('string'), 'application/xml');
      var firstSheetEl = wbDoc.getElementsByTagName('sheet')[0];
      if(!firstSheetEl){ console.warn(TAG, 'nu am găsit elementul <sheet> în workbook.xml'); return out; }
      var rId = firstSheetEl.getAttribute('r:id') || firstSheetEl.getAttribute('rId');
      var wbRelsDoc = parser.parseFromString(await wbRelsFile.async('string'), 'application/xml');
      var rels = Array.prototype.slice.call(wbRelsDoc.getElementsByTagName('Relationship'));
      var sheetRel = rels.find(function(r){ return r.getAttribute('Id') === rId; });
      if(!sheetRel){ console.warn(TAG, 'nu am găsit relația r:id=' + rId + ' pentru prima foaie'); return out; }
      var sheetTarget = sheetRel.getAttribute('Target').replace(/^\/?/,'');
      var sheetPath = sheetTarget.indexOf('xl/') === 0 ? sheetTarget : ('xl/' + sheetTarget);
      var pathParts = sheetPath.split('/');
      var sheetFile = pathParts.pop();
      var sheetRelsPath = pathParts.join('/') + '/_rels/' + sheetFile + '.rels';
      var sheetRelsFile = zip.file(sheetRelsPath);
      if(!sheetRelsFile){ console.log(TAG, 'foaia „' + sheetFile + '" nu are fișier de relații (' + sheetRelsPath + ') — probabil nu conține nicio poză'); return out; }
      var sheetRelsDoc = parser.parseFromString(await sheetRelsFile.async('string'), 'application/xml');
      var sheetRels = Array.prototype.slice.call(sheetRelsDoc.getElementsByTagName('Relationship'));
      var drawingRel = sheetRels.find(function(r){ return (r.getAttribute('Type')||'').indexOf('/drawing') !== -1; });
      if(!drawingRel){ console.log(TAG, 'foaia „' + sheetFile + '" nu are nicio relație de tip drawing — probabil nu conține poze inserate în celule'); return out; }
      var drawingTarget = drawingRel.getAttribute('Target').replace(/^\.\.\//,'').replace(/^\/?/,'');
      var drawingPath = drawingTarget.indexOf('xl/') === 0 ? drawingTarget : ('xl/' + drawingTarget);
      var drawingFile = zip.file(drawingPath);
      if(!drawingFile){ console.warn(TAG, 'fișierul de desen ' + drawingPath + ' lipsește din arhivă'); return out; }
      var drawingParts = drawingPath.split('/');
      var drawingFileName = drawingParts.pop();
      var drawingRelsPath = drawingParts.join('/') + '/_rels/' + drawingFileName + '.rels';
      var drawingRelsFile = zip.file(drawingRelsPath);
      var imgIdToPath = {};
      if(drawingRelsFile){
        var drawingRelsDoc = parser.parseFromString(await drawingRelsFile.async('string'), 'application/xml');
        Array.prototype.slice.call(drawingRelsDoc.getElementsByTagName('Relationship')).forEach(function(r){
          var target = r.getAttribute('Target').replace(/^\.\.\//,'').replace(/^\/?/,'');
          imgIdToPath[r.getAttribute('Id')] = target.indexOf('xl/') === 0 ? target : ('xl/' + target);
        });
      }
      var drawingDoc = parser.parseFromString(await drawingFile.async('string'), 'application/xml');
      var anchors = Array.prototype.slice.call(drawingDoc.getElementsByTagName('xdr:twoCellAnchor'))
        .concat(Array.prototype.slice.call(drawingDoc.getElementsByTagName('xdr:oneCellAnchor')));
      console.log(TAG, anchors.length + ' ancore de desen găsite, ' + Object.keys(imgIdToPath).length + ' imagini referențiate');
      var rowToPath = {};
      anchors.forEach(function(anchor){
        var from = anchor.getElementsByTagName('xdr:from')[0];
        var rowEl = from && from.getElementsByTagName('xdr:row')[0];
        var blip = anchor.getElementsByTagName('a:blip')[0];
        var embedId = blip && (blip.getAttribute('r:embed') || blip.getAttribute('r:link'));
        if(rowEl && embedId && imgIdToPath[embedId]){
          rowToPath[parseInt(rowEl.textContent, 10)] = imgIdToPath[embedId];
        }
      });
      var uniquePaths = Array.from(new Set(Object.values(rowToPath)));
      var blobs = {};
      await Promise.all(uniquePaths.map(async function(p){
        var f = zip.file(p);
        if(f) blobs[p] = await f.async('blob');
        else console.warn(TAG, 'fișierul imagine ' + p + ' nu există în arhivă');
      }));
      Object.keys(rowToPath).forEach(function(row){
        var blob = blobs[rowToPath[row]];
        if(blob) out[row] = blob;
      });
      console.log(TAG, Object.keys(out).length + ' poze potrivite cu un rând de date');
    } catch(e){ console.warn(TAG, 'eroare la extragere', e); }
    return out;
  }
  function downscaleImageBlob(blob, maxDim){
    return new Promise(function(resolve){
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        canvas.toBlob(function(outBlob){ resolve(outBlob || blob); }, 'image/jpeg', 0.82);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(blob); };
      img.src = url;
    });
  }
  async function uploadPriceListImage(blob, keyHint){
    try {
      var path = 'pricelist/' + keyHint + '_' + Date.now() + '.jpg';
      var res = await supabaseClient.storage.from('product-images').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
      if(res.error){ console.warn('[poze Excel] eroare la urcare în Storage:', res.error); return null; }
      var pub = supabaseClient.storage.from('product-images').getPublicUrl(path);
      return (pub && pub.data && pub.data.publicUrl) || null;
    } catch(e){ console.warn('[poze Excel] eroare neașteptată la urcare:', e); return null; }
  }
  async function attachExcelImagesForFile(file, rowKeyMap){
    if(!file.rawBuffer || !file.rowOrigIndices) return;
    var imagesByRow = await extractExcelImagesByRow(file.rawBuffer);
    var rowNums = Object.keys(imagesByRow);
    if(!rowNums.length){ ptToast('„' + file.fileName + '": nicio poză găsită în fișier (verifică consola browserului — F12 — pentru detalii).', false); return; }
    var sheetRowToDataIndex = {};
    file.rowOrigIndices.forEach(function(sheetRow, dataIdx){ sheetRowToDataIndex[sheetRow] = dataIdx; });
    var matched = 0, uploaded = 0;
    for(var i=0; i<rowNums.length; i++){
      var sheetRow = parseInt(rowNums[i], 10);
      var dataRowIndex = sheetRowToDataIndex[sheetRow];
      var key = dataRowIndex != null ? rowKeyMap[dataRowIndex] : null;
      if(!key || !state.products[key]) continue;
      matched++;
      var small = await downscaleImageBlob(imagesByRow[sheetRow], 300);
      var url = await uploadPriceListImage(small, key.replace(/[^a-zA-Z0-9]/g,'_'));
      if(url){ state.products[key].excelImageUrl = url; uploaded++; }
    }
    if(uploaded > 0){ save(); renderCompare(); }
    if(matched === 0){
      ptToast('„' + file.fileName + '": am găsit ' + rowNums.length + ' poză/poze în fișier, dar niciuna nu s-a potrivit cu un rând importat.', false);
    } else if(uploaded < matched){
      ptToast('„' + file.fileName + '": ' + uploaded + ' din ' + matched + ' poze urcate — verifică dacă bucket-ul „product-images” din Supabase Storage există și are politica de upload activă.', false);
    } else {
      ptToast('„' + file.fileName + '": ' + uploaded + ' poze adăugate.', true);
    }
  }

  function renderExcelImport(){
    var body = document.getElementById('pt-add-body');
    var html = '<div class="panel"><h2>Importă din Excel</h2><div class="hint">Poți încărca mai multe fișiere deodată (ex: câte unul per brand). Fișierele NU creează produse imediat — rămân „în așteptare" până verifici maparea coloanelor pentru fiecare, mai jos, și apeși „Importă produsele" pe rând.</div>';
    html += '<label>Furnizor</label><select id="pt-imp-supplier">' + supplierOptions(preselectImportSupplier) + '</select>';
    html += '<label>Fișiere' + (editingPriceListId ? ' (opțional — completează doar dacă vrei să încarci o versiune nouă a fișierului)' : ' (poți selecta mai multe)') + '</label><input type="file" id="pt-imp-file" accept=".xlsx,.xls,.csv" multiple>';
    // Maparea se deschide chiar sub fișierul editat (dacă e unul „în așteptare"), nu la capătul
    // paginii — altfel, cu 24 de fișiere în listă, trebuia să derulezi mult ca s-o găsești.
    var editingIsPending = editingPriceListId && state.priceLists.some(function(pl){ return pl.id === editingPriceListId && pl.pending; });
    if(editingPriceListId && !editingIsPending){
      html += '<div class="feedback ok">✏️ Verifici price list-ul „' + escAttr(importState.fileName) + '" — corectează maparea de mai jos și apasă „Importă produsele", <b>fără să mai selectezi fișierul din nou</b>. <button class="icon-link" onclick="ptCancelEditPriceList()">Anulează</button></div>' +
        '<div id="pt-imp-mapping"></div>';
    }
    html += '<div id="pt-imp-pending"></div>';
    html += '</div>';
    body.innerHTML = html;
    preselectImportSupplier = null;

    function renderPendingList(){
      var box = document.getElementById('pt-imp-pending');
      if(!box) return;
      var sidNow = document.getElementById('pt-imp-supplier').value;
      var byName = function(a,b){ return a.fileName.localeCompare(b.fileName, undefined, {sensitivity:'base', numeric:true}); };
      var pendingHere = state.priceLists.filter(function(pl){ return pl.pending && (pl.id === editingPriceListId || !sidNow || pl.supplierId === sidNow); }).sort(byName);
      var justAppliedHere = state.priceLists.filter(function(pl){ return justAppliedIds[pl.id] && (!sidNow || pl.supplierId === sidNow); }).sort(byName);
      if(!pendingHere.length && !justAppliedHere.length){ box.innerHTML = ''; return; }
      var rowsHtml = pendingHere.map(function(pl){
        var isEditingThis = editingPriceListId === pl.id;
        var row = '<div class="supplier-chip" style="margin:0;border-radius:0;border-left:none;border-right:none;border-top:none">' +
          '<span>' + escAttr(pl.fileName) + ' <span class="dim" style="color:var(--text-soft);font-size:11.5px">· ' + (pl.rows ? pl.rows.length : 0) + ' rânduri</span></span>' +
          '<span>' + (isEditingThis ? '<button class="icon-link" onclick="ptCancelEditPriceList()">Anulează</button>' : '<button class="secondary" onclick="ptEditPriceList(\'' + pl.id + '\')">Verifică și importă</button>') +
          ' <button class="icon-x" onclick="ptDeletePriceList(\'' + pl.id + '\')" title="Șterge — nu mai am nevoie de acest price list">✕</button></span>' +
          '</div>';
        if(isEditingThis) row += '<div id="pt-imp-mapping" style="padding:12px 14px;border-bottom:1px solid var(--border)"></div>';
        return row;
      }).join('');
      var doneHtml = justAppliedHere.map(function(pl){
        return '<div class="supplier-chip" style="margin:0;border-radius:0;border-left:none;border-right:none;border-top:none;background:var(--rank1-bg)">' +
          '<span style="color:var(--rank1);font-weight:600">✓ ' + escAttr(pl.fileName) + ' — importat (' + pl.productKeys.length + ' produse)</span>' +
          '<span><button class="icon-link" onclick="ptEditPriceList(\'' + pl.id + '\')">✏️ editează</button> <button class="icon-x" onclick="ptDeletePriceList(\'' + pl.id + '\')">✕</button></span>' +
          '</div>';
      }).join('');
      box.innerHTML = '<div class="panel" style="background:var(--rank3-bg);border-color:var(--rank3)">' +
        (pendingHere.length ? '<h2 style="margin:0 0 8px;font-size:15px">⏳ În așteptare (' + pendingHere.length + ')</h2>' : '<h2 style="margin:0 0 8px;font-size:15px">✓ Gata</h2>') +
        '<div class="panel" style="padding:0;margin-bottom:0;background:var(--panel)">' + doneHtml + rowsHtml + '</div></div>';
    }
    renderPendingList();

    document.getElementById('pt-imp-supplier').addEventListener('change', function(){
      // Golim selecția fișierului la schimbarea furnizorului — altfel inputul native tot arată
      // fișierele alese pentru furnizorul anterior, deși ele au fost deja transformate în intrări
      // „în așteptare" (filtrate mai jos strict pe furnizorul curent selectat).
      var fileInput = document.getElementById('pt-imp-file');
      if(fileInput) fileInput.value = '';
      renderPendingList();
      if(importState) renderMapping();
    });
    if(editingPriceListId && importState) renderMapping();

    document.getElementById('pt-imp-file').addEventListener('change', function(ev){
      var fileList = Array.prototype.slice.call(ev.target.files || []);
      if(!fileList.length) return;
      var sid = document.getElementById('pt-imp-supplier').value;
      if(!sid){ ptToast('Selectează furnizorul înainte de a încărca fișiere.', false); ev.target.value = ''; return; }
      var parsed = [];
      var pendingCount = fileList.length;
      fileList.forEach(function(file){
        var reader = new FileReader();
        reader.onload = function(e){
          try {
            var data = new Uint8Array(e.target.result);
            var wb = XLSX.read(data, { type: 'array' });
            var sheet = wb.Sheets[wb.SheetNames[0]];
            var rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            // Ținem evidența rândului ORIGINAL din foaie pentru fiecare rând care rămâne după
            // eliminarea celor goale — pozele lipite în Excel sunt legate de numărul de rând
            // real din foaie, nu de poziția din lista filtrată, așa că trebuie păstrată corect
            // corespondența ca să potrivim fiecare poză cu produsul corect.
            var rows = [], origIndices = [];
            rawRows.forEach(function(r, idx){
              if(r.some(function(c){ return String(c).trim() !== ''; })){ rows.push(r); origIndices.push(idx); }
            });
            if(rows.length >= 1){
              var headerIdx = detectHeaderRowIndex(rows);
              var dataStartIdx = headerIdx >= 0 ? headerIdx + 1 : 0;
              parsed.push({ fileName: file.name, headers: rows[headerIdx >= 0 ? headerIdx : 0], rows: rows.slice(dataStartIdx), skippedRows: headerIdx >= 0 ? headerIdx : 0, rawBuffer: e.target.result, rowOrigIndices: origIndices.slice(dataStartIdx) });
            }
          } catch(err){
            ptToast('Nu am putut citi "' + file.name + '": ' + err.message, false);
          }
          pendingCount--;
          if(pendingCount === 0){
            if(parsed.length === 0){ ptToast('Niciun fișier nu a putut fi citit.', false); return; }
            // Fișierele NU se importă imediat — devin „în așteptare" ca să verifici maparea
            // pentru fiecare (poate diferi de la un brand la altul) înainte să creeze produse.
            // rawBuffer (conținutul binar, pentru pozele din Excel) NU intră în starea salvată
            // — un ArrayBuffer nu se poate serializa în JSON — rămâne doar în memorie, per sesiune.
            var reusedCount = 0;
            parsed.forEach(function(f){
              // Dacă acest fișier are exact același nume ca un price list DEJA aplicat (nu unul
              // încă în așteptare — ăla poate fi un frate din același lot, cu nume coincident) la
              // același furnizor, îl tratăm ca pe o versiune actualizată a aceluiași brand: preluăm
              // maparea folosită data trecută (nu mai trebuie setată din nou) și, la reaplicare,
              // înlocuim prețurile vechi cu cele noi în loc să adăugăm o listă separată/duplicat.
              var prevApplied = state.priceLists.find(function(pl){ return !pl.pending && pl.supplierId === sid && pl.fileName === f.fileName; });
              if(prevApplied){
                pendingRawBuffers[prevApplied.id] = f.rawBuffer;
                prevApplied.headers = f.headers;
                prevApplied.rows = f.rows;
                prevApplied.skippedRows = f.skippedRows;
                prevApplied.rowOrigIndices = f.rowOrigIndices;
                prevApplied.pending = true;
                reusedCount++;
              } else {
                var newId = uid();
                pendingRawBuffers[newId] = f.rawBuffer;
                state.priceLists.push({ id: newId, supplierId: sid, fileName: f.fileName, brand: '', importedAt: null, productKeys: [], headers: f.headers, rows: f.rows, skippedRows: f.skippedRows, rowOrigIndices: f.rowOrigIndices, mapping: null, pending: true });
              }
            });
            save();
            ev.target.value = '';
            ptToast(parsed.length + ' fișier(e) încărcate' + (reusedCount ? (', ' + reusedCount + ' recunoscute ca actualizare a unei liste deja importate (maparea se completează automat)') : '') + ' — verifică mai jos înainte să se creeze produse.', true);
            renderExcelImport();
          }
        };
        reader.readAsArrayBuffer(file);
      });
    });
  }

  var FIELD_DEFS = [
    { key: 'barcode', label: 'Barcode / EAN' },

    { key: 'weight', label: 'Greutate (grame)' },
  ];

  function colLabel(idx){
    var letters = '';
    var n = idx;
    do { letters = String.fromCharCode(65 + (n % 26)) + letters; n = Math.floor(n/26) - 1; } while(n >= 0);
    return letters;
  }

  function patternMatches(header, pattern){
    if(pattern.length <= 4){
      var re = new RegExp('\\b' + pattern.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b', 'i');
      return re.test(header);
    }
    return header.indexOf(pattern) !== -1;
  }
  function guessColumn(headers, patterns, excludePatterns){
    for(var pass=0; pass<2; pass++){
      for(var i=0;i<headers.length;i++){
        if(pass===0 && hasHangul(headers[i])) continue;
        var h = normName(headers[i]);
        if(excludePatterns && excludePatterns.some(function(ex){ return h.indexOf(ex) !== -1; })) continue;
        for(var j=0;j<patterns.length;j++){ if(patternMatches(h, patterns[j])) return i; }
      }
    }
    return -1;
  }

  function renderMapping(){
    var wrap = document.getElementById('pt-imp-mapping');
    if(!wrap) return;
    var headers = importState.headers;
    var guesses = {
      name: guessColumn(headers, ['name english','english name'], ['korean']) !== -1
              ? guessColumn(headers, ['name english','english name'], ['korean'])
              : guessColumn(headers, ['produs','denumire','nume','product','description','item','name'], ['korean','한글','hangul']),
      price: guessColumn(headers, ['pret','price','cost','wholesale','unit price','average price']),
      barcode: guessColumn(headers, ['barcode','ean','cod bare','upc']),
      rrp: guessColumn(headers, ['rrp','recommended price','recommended','pret recomandat','retail']),
      moq: guessColumn(headers, ['moq','min order','cantitate minima','minim comanda','box qty','cutie']),
      packQty: guessColumn(headers, ['buc/pachet','buc/cutie','units per','pachet','set of','x buc','cantitate/pachet']),
      weight: guessColumn(headers, ['weight','greutate','net weight','gross weight','grame','gram(s)'])
    };
    var colOptions = '<option value="-1">— nu există —</option>' + headers.map(function(h,i){ return '<option value="'+i+'">' + colLabel(i) + ': ' + (h || '(fără titlu)') + '</option>'; }).join('');

    var supSel = document.getElementById('pt-imp-supplier');
    var currentSid = supSel ? supSel.value : '';
    var editingPL = editingPriceListId ? state.priceLists.find(function(pl){ return pl.id === editingPriceListId; }) : null;
    // La editare, maparea salvată chiar pe acest price list e mai exactă decât cea generică
    // pe furnizor (care poate fi alta dacă furnizorul trimite fișiere cu structuri diferite).
    var saved = (editingPL && editingPL.mapping) ? { mapping: editingPL.mapping } : (currentSid ? state.importMappings[currentSid] : null);

    var html = '';
    if(importFiles && importFiles.length > 1){
      html += '<div class="hint" style="margin-top:0"><b>' + importFiles.length + ' fișiere încărcate</b> — maparea de mai jos (bazată pe primul fișier) se aplică la toate:</div>';
      html += '<div class="preview-wrap" style="margin-bottom:14px"><table><thead><tr><th>Fișier</th><th>Brand detectat</th></tr></thead><tbody>' +
        importFiles.map(function(f){ return '<tr><td>' + f.fileName + '</td><td>' + (f.detectedBrand ? '<b>' + f.detectedBrand + '</b>' : '<span style="color:var(--text-soft)">— foloseşte brand implicit —</span>') + '</td></tr>'; }).join('') +
        '</tbody></table></div>';
    }
    if(importState.skippedRows > 0){
      html += '<div class="hint" style="margin-top:0">Am sărit automat primele ' + importState.skippedRows + ' rând' + (importState.skippedRows>1?'uri':'') + ' din fișier (probabil detalii de firmă) și am găsit rândul de antet cu coloanele produsului.</div>';
    }
    if(saved){
      html += '<div class="feedback ok" style="margin-bottom:10px">Am completat maparea folosită ultima dată pentru acest furnizor. Verific-o și corectează dacă structura fișierului s-a schimbat.</div>';
    }
    html += '<div class="map-grid">';
    FIELD_DEFS.forEach(function(f){
      html += '<div><label>' + f.label + '</label><select id="pt-map-' + f.key + '" onchange="ptRenderPreview()">' + colOptions + '</select></div>';
    });
    html += '</div>';
    html += '<div class="row"><div><label>Monedă implicită</label><select id="pt-map-def-currency" onchange="ptRenderPreview()"><option value="USD">USD</option><option value="MDL">MDL</option><option value="EUR">EUR</option><option value="KRW">KRW (won coreean)</option></select></div></div>';
    html += '<div class="hint">Previzualizare (primele 5 rânduri din primul fișier):</div><div class="preview-wrap" id="pt-imp-preview"></div>';
    html += '<button class="primary" id="pt-imp-submit">Importă produsele' + (importFiles && importFiles.length > 1 ? (' (' + importFiles.length + ' fișiere)') : '') + '</button><div id="pt-imp-feedback"></div>';
    wrap.innerHTML = html;

    FIELD_DEFS.forEach(function(f){
      var sel = document.getElementById('pt-map-' + f.key);
      var savedIdx = saved && saved.mapping ? saved.mapping[f.key] : undefined;
      if(savedIdx !== undefined && savedIdx !== -1 && savedIdx < headers.length){ sel.value = String(savedIdx); }
      else if(guesses[f.key] !== undefined && guesses[f.key] !== -1){ sel.value = String(guesses[f.key]); }
    });
    // Moneda implicită vine, în ordine: din maparea salvată a acestui price list (dacă editezi),
    // altfel din moneda implicită a furnizorului (dacă e setată în Furnizori), altfel rămîne USD.
    var supForCurrency = currentSid ? state.suppliers.find(function(s){ return s.id === currentSid; }) : null;
    if(saved && saved.defCurrency) document.getElementById('pt-map-def-currency').value = saved.defCurrency;
    else if(supForCurrency && supForCurrency.defaultCurrency) document.getElementById('pt-map-def-currency').value = supForCurrency.defaultCurrency;
    window.ptRenderPreview();
    document.getElementById('pt-imp-submit').addEventListener('click', doExcelImport);

  window.ptRenderPreview = function(){
    var m = currentMapping();

    // setări cu cea din previzualizare, fără să te mai încurci care unde a ajuns.
    var previewCols = ['barcode','name','price','moq','rrp','packQty','weight'];
    var previewLabels = ['Barcode','Produs','Preț','MOQ','RRP','Buc/pachet','Greutate'];
    var html = '<table><thead><tr>' + previewLabels.map(function(l){ return '<th>' + l + '</th>'; }).join('') + '</tr></thead><tbody>';
    sample.forEach(function(r){
      html += '<tr>' + previewCols.map(function(k){
        var idx = m[k];
        return '<td>' + (idx>=0 && r[idx]!==undefined ? r[idx] : '') + '</td>';
      }).join('') + '</tr>';
    });
    html += '</tbody></table>';
    preview.innerHTML = html;

    var warnBox = document.getElementById('pt-currency-warn');
    if(warnBox) warnBox.remove();
    if(m.price >= 0){
      var defCurEl = document.getElementById('pt-map-def-currency');
      var defCur = defCurEl ? defCurEl.value : 'USD';
      var prices = sample.map(function(r){ return parseFloat(String(r[m.price]).replace(',','.')); }).filter(function(n){ return !isNaN(n); });
      if(prices.length){
        var avg = prices.reduce(function(a,b){ return a+b; }, 0) / prices.length;
        var warnMsg = null;
        if((defCur === 'USD' || defCur === 'MDL') && avg > 300) warnMsg = 'Prețurile din previzualizare par mari pentru ' + defCur + ' (medie ~' + Math.round(avg) + '). Verifică — nu cumva sunt de fapt woni (KRW)?';
        else if(defCur === 'KRW' && avg < 50) warnMsg = 'Prețurile din previzualizare par mici pentru woni (medie ~' + Math.round(avg) + '). Verifică — nu cumva sunt de fapt USD?';
        if(warnMsg){
          var w = document.createElement('div');
          w.id = 'pt-currency-warn';
          w.style.cssText = 'background:var(--rank3-bg);border:1px solid var(--rank3);color:var(--rank3);border-radius:7px;padding:8px 12px;font-size:12px;margin-top:8px';
          w.textContent = '⚠ ' + warnMsg;
          preview.parentNode.insertBefore(w, preview.nextSibling);
        }
      }
    }
  };

  function doExcelImport(){
    var sid = document.getElementById('pt-imp-supplier').value;
    if(!sid){
      var fb0 = document.getElementById('pt-imp-feedback');
      fb0.className = 'feedback err'; fb0.textContent = 'Selectează furnizorul înainte de a importa.';
      return;
    }
    var m = currentMapping();
    if(m.name < 0 || m.price < 0){
      var fb = document.getElementById('pt-imp-feedback');
      fb.className = 'feedback err'; fb.textContent = 'Trebuie să mapezi cel puțin coloana Produs și coloana Preț.';
      return;
    }
    var defCurrency = document.getElementById('pt-map-def-currency').value;
    var today = new Date().toISOString().slice(0,10);
    var added=0, updated=0, increases=0, errors=0;
    var filesToProcess = (importFiles && importFiles.length) ? importFiles : [importState];

    filesToProcess.forEach(function(file){
      // Brandul vine mereu din numele fișierului/price list-ului — nu mai există cîmp manual de
      // rezervă sau coloană de mapare pentru el, ca să nu inducă în eroare cînd diferă de invoice.
      var fileBrand = file.detectedBrand || '';
      var touchedKeys = [];
      var rowKeyMap = {};
      file.rows.forEach(function(r, i){
        var name = m.name>=0 ? String(r[m.name]||'').trim() : '';
        var priceRaw = m.price>=0 ? r[m.price] : '';
        var price = parseFloat(String(priceRaw).replace(',','.'));
        if(!name || isNaN(price)){ errors++; return; }
        var currency = defCurrency;
        var barcodeList = m.barcode>=0 ? extractBarcodes(r[m.barcode]) : [];
        var barcode = barcodeList.length ? barcodeList[0] : '';
        var altBarcodes = barcodeList.slice(1);
        var quantity = m.quantity>=0 ? String(r[m.quantity]||'').trim() : '';
        var brand = fileBrand;
        var rrpVal = m.rrp>=0 ? parseFloat(String(r[m.rrp]).replace(',','.')) : NaN;
        var moqVal = m.moq>=0 ? parseInt(String(r[m.moq]).replace(/[^0-9]/g,''), 10) : NaN;
        var packQtyVal = m.packQty>=0 ? parseInt(String(r[m.packQty]).replace(/[^0-9]/g,''), 10) : NaN;
        var weightVal = m.weight>=0 ? parseFloat(String(r[m.weight]).replace(',','.')) : NaN;

        var key = makeKey(barcode, name, quantity);
        var existedBefore = !!state.products[key] && !!(state.products[key].bySupplier[sid]);
        var wasIncrease = upsertProduct({ name: name, brand: brand, quantity: quantity, barcode: barcode, altBarcodes: altBarcodes, price: price, currency: currency, freight: 'sea', rrp: isNaN(rrpVal) ? null : rrpVal, moq: isNaN(moqVal) ? null : moqVal, packQty: isNaN(packQtyVal) ? null : packQtyVal, weightGrams: isNaN(weightVal) ? null : weightVal }, sid, today);
        if(existedBefore){ updated++; if(wasIncrease) increases++; } else { added++; }
        touchedKeys.push(key);
        rowKeyMap[i] = key;
      });
      if(touchedKeys.length){
        // Țintim exact price list-ul respectiv, după id — NICIODATĂ după nume de fișier
        // (fișiere diferite de la branduri diferite pot avea din întâmplare același nume,
        // iar potrivirea după nume a dus la pierderea unor liste distincte).
        var existingPL = editingPriceListId ? state.priceLists.find(function(pl){ return pl.id === editingPriceListId; }) : null;
        if(existingPL){
          var wasPending = existingPL.pending;
          // Produsele care n-au fost în versiunea anterioară a acestui price list sunt noi —
          // le marcăm ca „NEW" în Comparație produse; cele care erau deja acolo nu mai sunt noi.
          // La PRIMA aplicare a unei liste (wasPending true) productKeys e mereu gol, deci fără
          // acest control totul ar ieși „nou" — de-asta NEW apărea practic la toate produsele.
          var oldKeySet = {};
          existingPL.productKeys.forEach(function(k){ oldKeySet[k] = true; });
          var newKeySet = {};
          touchedKeys.forEach(function(k){
            newKeySet[k] = true;
            if(!state.products[k]) return;
            if(!oldKeySet[k]){
              if(wasPending){ state.products[k].isNew = false; }
              else { state.products[k].isNew = true; state.products[k].newAt = today; }
            } else { state.products[k].isNew = false; }
          });
          // Produsele care erau în versiunea anterioară a acestei liste dar au dispărut din cea
          // nouă — furnizorul nu le mai oferă — nu mai primesc preț de la acest furnizor, ca să
          // nu rămână agățate cu date vechi.
          var removedFromSupplier = 0;
          existingPL.productKeys.forEach(function(k){
            if(newKeySet[k]) return;
            var p = state.products[k];
            if(p && p.bySupplier[sid]){ delete p.bySupplier[sid]; removedFromSupplier++; }
          });
          existingPL.fileName = file.fileName;
          existingPL.brand = fileBrand || '';
          existingPL.importedAt = today;
          existingPL.productKeys = touchedKeys;
          existingPL.headers = file.headers;
          existingPL.rows = file.rows;
          existingPL.skippedRows = file.skippedRows || 0;
          existingPL.mapping = m;
          existingPL.pending = false;
          delete pendingRawBuffers[existingPL.id];
          if(wasPending) justAppliedIds[existingPL.id] = true;
        } else {
          state.priceLists.push({ id: uid(), supplierId: sid, fileName: file.fileName, brand: fileBrand || '', importedAt: today, productKeys: touchedKeys, headers: file.headers, rows: file.rows, skippedRows: file.skippedRows || 0, mapping: m, pending: false });
        }
      }
      // Extragerea și urcarea pozelor lipite în Excel se face în fundal, fără să blocheze
      // înregistrarea prețurilor de mai sus (asta e partea critică, trebuie să rămână rapidă).
      if(file.rawBuffer) attachExcelImagesForFile(file, rowKeyMap);
    });

    // Brandul implicit NU se ține minte între importuri — de la același furnizor vin mereu
    // fișiere cu branduri diferite, deci ar rămâne greșit completat cu cel anterior.
    state.importMappings[sid] = { mapping: m, defCurrency: defCurrency };
    save();
    var fb = document.getElementById('pt-imp-feedback');
    var msg = (editingPriceListId ? 'Price list actualizat: ' : '') + added + ' produse noi, ' + updated + ' actualizate';
    if(filesToProcess.length > 1) msg += ' (din ' + filesToProcess.length + ' fișiere)';
    if(increases>0) msg += ', ' + increases + ' cu preț crescut';
    if(errors>0) msg += ', ' + errors + ' rânduri ignorate (lipsă produs/preț)';
    fb.className = 'feedback ok'; fb.textContent = msg;
    importFiles = null; importState = null; editingPriceListId = null;
    renderCompare();
    renderExcelImport();
  }

    document.getElementById('pt-order-coef').addEventListener('input', renderOrderSummary);
    document.getElementById('pt-order-search').addEventListener('input', function(ev){ ptOrderSearch(ev.target.value); });
    document.getElementById('pt-order-export').addEventListener('click', exportOrderExcel);
    document.getElementById('pt-order-save').addEventListener('click', saveOrderToHistory);
    renderOrderRows();
    renderOrderSummary();
    renderOrderHistory();
  }

  function productsForSupplier(sid){
    return Object.keys(state.products).filter(function(k){ return state.products[k].bySupplier[sid] && !state.products[k].archived; })
      .map(function(k){ return { key: k, p: state.products[k], e: state.products[k].bySupplier[sid] }; })
      .sort(function(a,b){ return a.p.displayName.localeCompare(b.p.displayName, undefined, {sensitivity:'base', numeric:true}); });
  }

  function renderOrderRows(){
    var tbody = document.getElementById('pt-order-rows');
    var items = productsForSupplier(currentOrderSupplier);
    var cart = myCart(currentOrderSupplier);
    var cartKeys = Object.keys(cart).filter(function(k){ return cart[k] > 0; });
    if(cartKeys.length === 0){ tbody.innerHTML = '<tr><td colspan="5" style="font-family:var(--sans);color:var(--text-soft);padding:16px 14px">Coșul e gol. Adaugă produse de mai jos sau direct din tab-ul Comparație produse.</td></tr>'; return; }
    tbody.innerHTML = cartKeys.map(function(key){
      var it = items.find(function(x){ return x.key === key; });
      if(!it) return '';
      var qty = cart[key];
      var transit = getInTransitInfo(it.key);
      var transitNote = transit.qty > 0 ? ('<br><span style="font-size:10px;color:' + (transit.overdue?'var(--bad)':'var(--rank2)') + '">' + (transit.overdue ? 'întârziat' : 'pe drum (' + freightLabel(transit.freight) + ')') + ': ' + transit.qty + (transit.eta ? (' · '+transit.eta) : '') + '</span>') : '';
      var lastP = it.e.lastPurchase ? ('<br><span style="font-size:10px;color:var(--text-soft)">ultima achiziție: ' + fmt(toUSD(it.e.lastPurchase.price, it.e.lastPurchase.currency)) + ' USD</span>') : '';
      var moqNote = it.e.moq ? ('<br><span style="font-size:10px;color:var(--text-soft)">MOQ: ' + it.e.moq + ' buc</span>') : '';
      var belowMoq = it.e.moq && qty && qty < it.e.moq;
      return '<tr><td style="font-family:var(--sans)">' + it.p.displayName + (it.p.quantity ? ' <span style="color:var(--text-soft)">(' + it.p.quantity + ')</span>' : '') + transitNote + '</td>' +
        '<td>' + (it.p.brand||'—') + '</td><td>' + (it.e.price != null ? (fmt(toUSD(it.e.price, it.e.currency)) + ' USD') : 'fără preț de listă') + lastP + moqNote + '</td>' +
        '<td><input class="qty-input" type="number" min="0" value="' + qty + '" style="' + (belowMoq?'border-color:var(--bad)':'') + '" onchange="ptSetOrderQty(\'' + it.key.replace(/'/g,"\\'") + '\', this.value)">' +
        (belowMoq ? '<br><span style="font-size:10px;color:var(--bad)">sub MOQ (min ' + it.e.moq + ')</span>' : '') + '</td>' +
        '<td><button class="icon-x" onclick="ptSetOrderQty(\'' + it.key.replace(/'/g,"\\'") + '\', 0)" title="Elimină din coș">✕</button></td></tr>';
    }).join('');
  }

  window.ptOrderSearch = function(query){
    var box = document.getElementById('pt-order-search-results');
    if(!box) return;
    var q = normName(query);
    if(q.length < 2){ box.innerHTML = ''; return; }
    var cart = myCart(currentOrderSupplier);
    var matches = productsForSupplier(currentOrderSupplier).filter(function(it){
      return !cart[it.key] && normName(it.p.displayName).indexOf(q) !== -1;
    }).slice(0, 8);
    if(matches.length === 0){ box.innerHTML = '<span style="font-size:11.5px;color:var(--text-soft)">Niciun rezultat</span>'; return; }
    box.innerHTML = matches.map(function(it){
      return '<button class="icon-link" style="display:block;width:100%;text-align:left;border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin-top:4px" onclick="ptAddOrderProduct(\'' + it.key.replace(/'/g,"\\'") + '\')">' + it.p.displayName + ' — ' + (it.e.price != null ? (fmt(toUSD(it.e.price, it.e.currency)) + ' USD') : 'fără preț de listă') + '</button>';
    }).join('');
  };
  window.ptAddOrderProduct = function(key){
    var cart = myCart(currentOrderSupplier);
    cart[key] = (cart[key] || 0) + 1;
    doSaveNow(true); renderOrderRows(); renderOrderSummary();
    var box = document.getElementById('pt-order-search-results'); if(box) box.innerHTML = '';
    var inp = document.getElementById('pt-order-search'); if(inp) inp.value = '';
  };

  window.ptSetOrderQty = function(key, val){
    var n = parseInt(val, 10);
    var cart = myCart(currentOrderSupplier);
    if(!n || n <= 0) delete cart[key]; else cart[key] = n;
    doSaveNow(true); renderOrderRows(); renderOrderSummary();
  };

  function getOrderLines(){
    var items = productsForSupplier(currentOrderSupplier);
    var cart = myCart(currentOrderSupplier);
    var discPct = supplierDiscountPct(currentOrderSupplier);
    return Object.keys(cart).map(function(key){
      var it = items.find(function(x){ return x.key === key; });
      if(!it) return null;
      var qty = cart[key];
      var priceUSD = toUSD(it.e.price, it.e.currency) * (1 - discPct/100);
      return { key: key, name: it.p.displayName, brand: it.p.brand, currency: 'USD', price: priceUSD, qty: qty, lineTotal: priceUSD * qty, discPct: discPct, weightGrams: it.e.weightGrams || 0 };
    }).filter(Boolean);
  }

  function getOrderCoef(){
    var el = document.getElementById('pt-order-coef');
    return el && parseFloat(el.value) > 0 ? parseFloat(el.value) : state.settings.coef;
  }
  function getOrderFreight(){
    var el = document.getElementById('pt-order-freight');
    return el ? el.value : 'sea';
  }
  function renderOrderSummary(){
    var lines = getOrderLines();
    var box = document.getElementById('pt-order-summary');
    if(lines.length === 0){ box.innerHTML = '<div style="color:var(--text-soft);font-size:13px">Nicio cantitate introdusă încă.</div>'; return; }
    var totals = {};
    lines.forEach(function(l){ totals[l.currency] = (totals[l.currency]||0) + l.lineTotal; });
    var coef = getOrderCoef();
    var landedTotal = 0;
    lines.forEach(function(l){ landedTotal += toUSD(l.price, l.currency) * state.settings.exchangeRate * coef; });
    var totalWeightKg = 0;
    lines.forEach(function(l){ totalWeightKg += (l.weightGrams * l.qty) / 1000; });
    var discPct = lines[0] ? lines[0].discPct : 0;
    var html = discPct ? ('<div class="feedback ok" style="margin-bottom:8px">Reducere ' + discPct + '% aplicată la prețurile ' + supplierName(currentOrderSupplier) + ' (prețuri deja finale).</div>') : '';
    html += lines.map(function(l){ return '<div class="order-line"><span>' + l.name + ' × ' + l.qty + '</span><span>' + fmt(l.lineTotal) + ' ' + l.currency + '</span></div>'; }).join('');
    Object.keys(totals).forEach(function(cur){
      html += '<div class="order-total"><span>Total ' + cur + '</span><span>' + fmt(totals[cur]) + '</span></div>';
    });
    html += '<div class="order-total" style="color:var(--accent-dark)"><span>Cost estimat la destinație</span><span>' + fmt(landedTotal) + ' MDL</span></div>';
    if(totalWeightKg > 0){
      html += '<div class="order-total" style="color:var(--text-soft);font-weight:400"><span>Greutate totală estimată</span><span>' + fmt(totalWeightKg) + ' kg</span></div>';
    }
    box.innerHTML = html;
  }

  function exportOrderExcel(){
    var lines = getOrderLines();
    if(lines.length === 0){ ptToast('Adaugă cel puțin o cantitate.', false); return; }
    var coef = getOrderCoef(), freight = getOrderFreight();
    var wsData = [['Produs','Brand','Cantitate','Preț unitar','Monedă','Total linie']];
    lines.forEach(function(l){ wsData.push([l.name, l.brand, l.qty, l.price, l.currency, l.lineTotal]); });
    var totals = {};
    lines.forEach(function(l){ totals[l.currency] = (totals[l.currency]||0) + l.lineTotal; });
    Object.keys(totals).forEach(function(cur){ wsData.push(['','','','','TOTAL '+cur, totals[cur]]); });
    var landedTotal = 0;
    lines.forEach(function(l){ landedTotal += toUSD(l.price, l.currency) * state.settings.exchangeRate * coef; });
    wsData.push(['','','','','Coeficient folosit', coef + ' (' + freightLabel(freight) + ')']);
    wsData.push(['','','','','Cost estimat la destinație (MDL)', landedTotal.toFixed(2)]);
    var ws = XLSX.utils.aoa_to_sheet(wsData);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Comanda');
    var sname = supplierName(currentOrderSupplier).replace(/[^a-zA-Z0-9]/g,'_');
    XLSX.writeFile(wb, 'comanda_' + sname + '_' + todayStr() + '.xlsx');
  }

  function saveOrderToHistory(){
    var lines = getOrderLines();
    if(lines.length === 0){ ptToast('Adaugă cel puțin o cantitate.', false); return; }
    var eta = document.getElementById('pt-order-eta').value || null;
    var coef = getOrderCoef(), freight = getOrderFreight();
    var today = todayStr();
    var totals = {};
    lines.forEach(function(l){ totals[l.currency] = (totals[l.currency]||0) + l.lineTotal; });
    var landedTotal = 0;
    lines.forEach(function(l){ landedTotal += toUSD(l.price, l.currency) * state.settings.exchangeRate * coef; });
    state.orders.unshift({ id: uid(), supplierId: currentOrderSupplier, date: today, eta: eta, status: 'trimisa', freight: freight, coef: coef, landedTotal: landedTotal, lines: lines, totals: totals });
    lines.forEach(function(l){
      var prod = state.products[l.key];
      if(prod && prod.bySupplier[currentOrderSupplier]){
        var lpLanded = (l.currency === 'MDL') ? l.price : (toUSD(l.price, l.currency) * state.settings.exchangeRate * coef);
        prod.bySupplier[currentOrderSupplier].lastPurchase = { price: l.price, currency: l.currency, date: today, qty: l.qty, landedCost: lpLanded };
      }
    });
    save();
    state.carts[currentUserEmail || '_'][currentOrderSupplier] = {};
    renderOrderRows(); renderOrderSummary(); renderOrderHistory(); renderCompare();
  }

  var ORDER_STATUS_COLORS = { 'trimisa':'var(--text-soft)', 'confirmata':'var(--rank2)', 'in-transit':'var(--rank3)', 'received':'var(--rank1)' };

  // ================= COST TRANSPORT REAL → COEFICIENT REAL PE COMANDĂ =================
  function orderInvoiceUSD(o){
    var sum = 0;
    Object.keys(o.totals || {}).forEach(function(c){ sum += toUSD(o.totals[c], c); });
    return sum;
  }
  function computeRealCoef(o){
    var af = o.actualFreight;
    if(!af || af.cost == null || isNaN(af.cost)) return null;
    var invoiceUSD = orderInvoiceUSD(o);
    if(!invoiceUSD) return null;
    var invoiceMDL = invoiceUSD * state.settings.exchangeRate;
    var freightMDL = toUSD(af.cost, af.currency) * state.settings.exchangeRate;
    var customsPct = (af.customsPct != null && !isNaN(af.customsPct)) ? af.customsPct : 27;
    var baseMDL = invoiceMDL + freightMDL;
    var totalLandedMDL = baseMDL * (1 + customsPct/100);
    return totalLandedMDL / invoiceMDL;
  }
  function buildRealFreightPanelHtml(o){
    var af = o.actualFreight || {};
    var currency = af.currency || 'USD';
    var rateLabel = currency === 'MDL' ? 'Curs USD → MDL' : (currency === 'EUR' ? 'Curs USD → EUR' : 'Curs');
    var rateVal = currency === 'MDL' ? state.settings.exchangeRate : (currency === 'EUR' ? state.settings.eurPerUsd : 1);
    var realCoef = computeRealCoef(o);
    var appliedNote = (o.appliedRealCoef != null) ? ('<div style="color:var(--rank1);font-size:11.5px;margin-top:6px">✓ Coeficient real aplicat comenzii: ' + fmt(o.appliedRealCoef) + ' (implicit era ' + fmt(state.settings.coef) + ')</div>') : '';
    return '<div class="panel" style="background:var(--bg)"><h2 style="font-size:14px">Cost transport real (de la transportator)</h2>' +
      '<div class="hint">Dacă transportatorul ți-a dat deja prețul de transport pentru comandă, introdu-l aici — sinecostul se recalculează automat pe baza sumei reale (invoice + transport + ~taxe vamale), în loc de coeficientul implicit.</div>' +
      '<div class="row"><div><label>Cost transport</label><input type="number" step="0.01" id="pt-rf-cost" value="' + (af.cost != null ? af.cost : '') + '" placeholder="ex: 450"></div>' +
      '<div><label>Monedă</label><select id="pt-rf-currency"><option value="USD" ' + (currency==='USD'?'selected':'') + '>USD</option><option value="MDL" ' + (currency==='MDL'?'selected':'') + '>MDL</option><option value="EUR" ' + (currency==='EUR'?'selected':'') + '>EUR</option></select></div>' +
      '<div><label>' + rateLabel + '</label><input type="number" step="0.0001" id="pt-rf-rate" value="' + rateVal + '" ' + (currency==='USD'?'disabled title="Nu e nevoie de curs — transportul e deja în USD"':'title="Ajustează cursul dacă nu e cel corect — se salvează în Setări"') + '></div>' +
      '<div><label>Taxe vamale (%)</label><input type="number" step="0.5" id="pt-rf-customs" value="' + (af.customsPct != null ? af.customsPct : 27) + '"></div></div>' +
      (realCoef != null ? ('<div class="feedback ok" style="margin-top:0">Coeficient real calculat: <b>' + fmt(realCoef) + '</b> (invoice ' + fmt(orderInvoiceUSD(o)) + ' USD + transport + ~' + (af.customsPct != null ? af.customsPct : 27) + '% taxe vamale)</div>') : '') +
      '<button class="primary" id="pt-rf-apply" style="margin-top:8px">Aplică acest coeficient produselor din comandă</button>' +
      appliedNote + '</div>';
  }
  window.ptApplyRealFreight = function(id){
    var o = state.orders.find(function(x){ return x.id === id; });
    if(!o) return;
    var cost = parseFloat(document.getElementById('pt-rf-cost').value);
    var currency = document.getElementById('pt-rf-currency').value;
    var customsPct = parseFloat(document.getElementById('pt-rf-customs').value);
    if(isNaN(cost)){ ptToast('Introdu costul de transport.', false); return; }
    o.actualFreight = { cost: cost, currency: currency, customsPct: isNaN(customsPct) ? 27 : customsPct };
    var realCoef = computeRealCoef(o);
    if(realCoef == null){ ptToast('Nu am putut calcula — verifică valorile comenzii.', false); return; }
    o.appliedRealCoef = realCoef;
    o.coef = realCoef;
    o.landedTotal = orderInvoiceUSD(o) * state.settings.exchangeRate * realCoef;
    o.lines.forEach(function(l){
      var prod = state.products[l.key];
      if(prod && prod.bySupplier[o.supplierId] && prod.bySupplier[o.supplierId].lastPurchase && prod.bySupplier[o.supplierId].lastPurchase.date === o.date){
        prod.bySupplier[o.supplierId].lastPurchase.landedCost = toUSD(l.price, l.currency) * state.settings.exchangeRate * realCoef;
      }
    });
    save();
    renderOrderHistory(); renderCompare(); renderOrderRows();
    ptToast('Coeficient real aplicat: ' + fmt(realCoef) + '. Sinecosturile produselor din comandă au fost actualizate.', true);
  };
  window.ptSetOrderFreight = function(id, val){
    var o = state.orders.find(function(x){ return x.id === id; });
    if(!o) return;
    o.freight = val;
    save(); renderOrderHistory(); renderCompare();
  };
  window.ptSetOrderCoef = function(id, val){
    var o = state.orders.find(function(x){ return x.id === id; });
    if(!o) return;
    var n = parseFloat(val);
    if(isNaN(n) || n <= 0){ ptToast('Coeficientul trebuie să fie un număr pozitiv.', false); renderOrderHistory(); return; }
    o.coef = n;
    o.appliedRealCoef = null;
    o.landedTotal = orderInvoiceUSD(o) * state.settings.exchangeRate * n;
    o.lines.forEach(function(l){
      var prod = state.products[l.key];
      if(prod && prod.bySupplier[o.supplierId] && prod.bySupplier[o.supplierId].lastPurchase && prod.bySupplier[o.supplierId].lastPurchase.date === o.date){
        prod.bySupplier[o.supplierId].lastPurchase.landedCost = toUSD(l.price, l.currency) * state.settings.exchangeRate * n;
      }
    });
    save();
    renderOrderHistory(); renderCompare(); renderOrderRows();
    ptToast('Coeficient actualizat: ' + fmt(n) + '. Sinecosturile produselor din comandă au fost recalculate.', true);
  };
  window.ptSetOrderLineQty = function(key, val){
    var o = state.orders.find(function(x){ return x.id === openOrderId; });
    if(!o) return;
    var matching = o.lines.filter(function(l){ return l.key === key; });
    if(!matching.length) return;
    var n = parseInt(val, 10);
    if(isNaN(n) || n <= 0){
      o.lines = o.lines.filter(function(l){ return l.key !== key; });
    } else {
      matching[0].qty = n;
      matching[0].lineTotal = matching[0].price * n;
      // dacă produsul avea mai multe linii sub aceeași cheie, le combinăm pe toate în prima,
      // ca noua cantitate să nu se adune la cele vechi rămase separat
      if(matching.length > 1){
        var kept = false;
        o.lines = o.lines.filter(function(l){
          if(l.key !== key) return true;
          if(!kept){ kept = true; return true; }
          return false;
        });
      }
    }
    var totals = {};
    o.lines.forEach(function(l){ totals[l.currency] = (totals[l.currency]||0) + l.lineTotal; });
    o.totals = totals;
    var landedTotal = 0;
    o.lines.forEach(function(l){ landedTotal += toUSD(l.price, l.currency) * state.settings.exchangeRate * o.coef; });
    o.landedTotal = landedTotal;
    save(); renderOrderDetailTable();
  };

  function renderOrderHistory(){
    var box = document.getElementById('pt-order-history');
    if(state.orders.length === 0){ box.innerHTML = '<div style="color:var(--text-soft);font-size:13px">Nicio comandă salvată încă.</div>'; return; }
    var today = todayStr();
    box.innerHTML = state.orders.map(function(o){
      ensureOrderStatusChecked(o);
      var totalStr = Object.keys(o.totals).map(function(c){ return fmt(o.totals[c]) + ' ' + c; }).join(' + ');
      var overdue = o.status !== 'received' && o.eta && o.eta < today;
      var statusSelect = '<select style="width:auto;margin-bottom:0;display:inline-block;font-weight:600;color:' + (overdue ? 'var(--bad)' : ORDER_STATUS_COLORS[o.status] || 'var(--text)') + '" onchange="ptSetOrderStatus(\'' + o.id + '\', this.value)">' +
        ORDER_STATUSES.map(function(s){ return '<option value="' + s + '" ' + (o.status === s ? 'selected' : '') + '>' + ORDER_STATUS_LABELS[s] + '</option>'; }).join('') +
        '</select>' + (overdue ? ' <span style="color:var(--bad);font-size:11px">· întârziat (est. ' + o.eta + ')</span>' : (o.eta && o.status !== 'received' ? ' <span style="color:var(--text-soft);font-size:11px">· sosire est. ' + o.eta + '</span>' : ''));
      var isOpen = openOrderId === o.id;
      // Comanda deschisă capătă doar o RAMĂ colorată în jurul întregului bloc (rînd + panou) — nu
      // un fundal colorat peste tot, care ar amesteca vizual toate cîmpurile/panourile din interior
      // unele cu altele. Fundalul rămîne alb (var(--panel)), ca înăuntru totul să se citească normal.
      var row = '<div class="history-row"' + (isOpen ? ' style="border-top:none;padding:8px 10px"' : '') + '><span>' + o.date + ' — ' + supplierName(o.supplierId) + ' (' + o.lines.length + ' produse) · ' + statusSelect + '</span>' +
        '<span style="font-family:var(--mono)">' + totalStr + (o.landedTotal ? (' · ~' + fmt(o.landedTotal) + ' MDL') : '') +
        ' <button class="icon-link" onclick="ptToggleOrderDetail(\'' + o.id + '\')">' + (isOpen ? '▲ Închide' : '▼ Deschide') + '</button>' +
        ' <button class="icon-x" onclick="ptDeleteOrder(\'' + o.id + '\')">✕</button></span></div>';
      if(!isOpen) return row;
      var detail = '<div class="panel" style="margin-top:0;border-top:none;border-top-left-radius:0;border-top-right-radius:0">' +
        '<div class="row" style="margin-bottom:10px"><div><label>Tip transport</label><select onchange="ptSetOrderFreight(\'' + o.id + '\',this.value)">' + freightOptionsHtml(o.freight) + '</select></div>' +
        '<div><label>Coeficient comandă</label><input type="number" step="0.01" value="' + o.coef + '" onchange="ptSetOrderCoef(\'' + o.id + '\',this.value)"></div></div>' +
        buildRealFreightPanelHtml(o) +
        '<div class="row" style="margin-bottom:10px">' +
        '<div><button class="secondary" style="width:100%" onclick="exportOrderPricingExcel(\'' + o.id + '\')">📊 Descarcă Excel</button></div>' +
        (state.settings.moyskladProxyUrl ? (
          '<div><button class="secondary" id="pt-ms-import-btn" style="width:100%" onclick="ptImportPricesFromMoySklad(\'' + o.id + '\')" title="Aduce prețurile deja setate pe produs în MoySklad, ca punct de plecare">📥 Importă prețuri din MoySklad</button></div>' +
          '<div><button class="secondary" id="pt-ms-push-btn" style="width:100%" onclick="ptPushPricesToMoySklad(\'' + o.id + '\')" title="Trimite prețurile de mai jos în cîmpurile personalizate ale produsului din MoySklad">📤 Trimite prețurile în MoySklad</button></div>'
        ) : '') +
        '</div>' +
        '<div id="pt-order-detail-table">' + buildOrderPricingTableHtml(o) + '</div></div>';
      return '<div style="border:2px solid var(--accent);border-radius:10px;background:var(--panel);overflow:hidden;margin-bottom:2px">' + row + detail + '</div>';
    }).join('');
    if(openOrderId){
      // La prima deschidere a unei comenzi (nu la o re-randare ulterioară, care trece prin
      // renderOrderDetailTable), tabelul de prețuri nu primea niciodată înălțimea calculată
      // dinamic — rămânea la valoarea implicită din CSS, prea mică dacă tabelul precedent
      // deschis era mai mic. La închidere+redeschidere "se repara" doar pentru că, între timp,
      // se întâmpla să se declanșeze un re-render (ex: la încărcarea imaginilor din MoySklad).
      // Calculul de mai jos citește poziția reală a tabelului pe ecran (getBoundingClientRect) —
      // dacă îl facem imediat, sincron, browserul poate să nu fi terminat încă layout-ul pentru
      // conținutul tocmai inserat (mai ales la o comandă mare), și citește o poziție/înălțime
      // greșită. requestAnimationFrame îl amînă pînă după ce pagina chiar s-a așezat.
      requestAnimationFrame(function(){
        var openWrap = document.querySelector('#pt-order-detail-table .table-wrap');
        if(openWrap){ mountStickyHeader(openWrap); fitTableWrapHeight(openWrap); }
      });
      var rfApply = document.getElementById('pt-rf-apply');
      if(rfApply) rfApply.addEventListener('click', function(){ ptApplyRealFreight(openOrderId); });
      var rfRate = document.getElementById('pt-rf-rate');
      if(rfRate) rfRate.addEventListener('change', function(){
        var n = parseFloat(rfRate.value);
        if(isNaN(n) || n <= 0) return;
        var cur = document.getElementById('pt-rf-currency').value;
        if(cur === 'MDL') state.settings.exchangeRate = n;
        else if(cur === 'EUR') state.settings.eurPerUsd = n;
        recomputeAllLandedCosts(); save(); renderOrderHistory(); renderCompare();
      });

  // ================= PRICING TAB =================
  function getSinecost(key, coefOverride){
    var p = state.products[key];
    // Corectare manuală a prețului de achiziție — are prioritate peste orice altă sursă, ca să
    // poată fi îndreptat direct dacă e greșit sau nesincronizat. Folosește coeficientul COMENZII
    // curente cînd e disponibil (coefOverride), nu doar cel implicit global — altfel schimbarea
    // coeficientului per comandă nu avea niciun efect asupra produselor corectate manual.
    var coef = (coefOverride != null) ? coefOverride : state.settings.coef;
    if(p.buyPriceOverrideUsd != null){
      return { cost: p.buyPriceOverrideUsd * state.settings.exchangeRate * coef, usdPrice: p.buyPriceOverrideUsd, source: 'corectat manual' };
    }
    var best = null, bestDate = null, bestSid = null, bestUsd = null;
    Object.keys(p.bySupplier).forEach(function(sid){
      var e = p.bySupplier[sid];
      if(e.lastPurchase && e.lastPurchase.landedCost != null){
        if(!bestDate || e.lastPurchase.date > bestDate){ bestDate = e.lastPurchase.date; best = e.lastPurchase.landedCost; bestSid = sid; bestUsd = toUSD(e.lastPurchase.price, e.lastPurchase.currency); }
      }
    });
    if(best != null){
      return { cost: best, usdPrice: bestUsd, source: 'ultima achiziție (' + bestDate + ')' };
    }
    var min = null, minSid = null, minUsd = null;
    Object.keys(p.bySupplier).forEach(function(sid){
      var e = p.bySupplier[sid];
      if(e.price == null) return; // fără preț de listă real (doar asociat printr-o comandă) — nu concurează
      var uc = effectiveLandedCost(e, sid);
      if(min === null || uc < min){ min = uc; minSid = sid; minUsd = toUSD(e.price, e.currency); var d = supplierDiscountPct(sid); if(d) minUsd = minUsd * (1 - d/100); }
    });
    var discPct2 = minSid ? supplierDiscountPct(minSid) : 0;
    return { cost: min, usdPrice: minUsd, source: min !== null ? ('cel mai bun preț din listă curentă' + (discPct2 ? ' cu reducere ' + discPct2 + '%' : '')) : null };
  }
  // Sinecostul unui produs ÎN CONTEXTUL unei comenzi anume, în ordinea deciziei luate cu
  // utilizatorul: (1) corectare manuală — mereu prioritară, e o intervenție explicită; (2) "Pret
  // furnizor in $" citit LIVE din MoySklad, dacă produsul e legat și cîmpul chiar are o valoare
  // acolo — e întreținut manual de echipă și trebuie să rămînă sursa oficială; (3) prețul de pe
  // factura ACESTEI comenzi, doar dacă MoySklad nu are încă nimic acolo (nu "ultima achiziție" — un
  // cîmp global, comun tuturor comenzilor de la același furnizor, care putea reflecta prețul altei
  // comenzi, mai recent importate, nu al celei deschise acum).
  function getOrderLineSinecost(o, key){
    var p = state.products[key];
    if(!o) return getSinecost(key);
    if(p.buyPriceOverrideUsd != null){
      return { cost: p.buyPriceOverrideUsd * state.settings.exchangeRate * o.coef, usdPrice: p.buyPriceOverrideUsd, source: 'corectat manual' };
    }
    var msProd = state.settings.moyskladProxyUrl ? moyskladLookup(p) : null;
    if(msProd){
      ensureMsAttrsLoaded(msProd.id);
      var cached = msAttrsCache[msProd.id];
      if(cached && cached.attrs && cached.attrs[MS_PRICE_ATTRS.buyPriceUsd] != null){
        var msUsd = cached.attrs[MS_PRICE_ATTRS.buyPriceUsd];
        return { cost: msUsd * state.settings.exchangeRate * o.coef, usdPrice: msUsd, source: '„Pret furnizor in $" (MoySklad)' };
      }
    }
    var line = o.lines.find(function(l){ return l.key === key; });
    if(line && line.price != null){
      return { cost: line.price * state.settings.exchangeRate * o.coef, usdPrice: line.price, source: 'factura acestei comenzi (MoySklad nu are „Pret furnizor in $" pentru acest produs)' };
    }
    return getSinecost(key, o.coef);
  }
  function suggestedPrice(cost, markupPct){ return cost * (1 + (markupPct||0)/100); }
  function pachet2Discount(markupPct){
    if(markupPct > 45) return 40;
    if(markupPct >= 30) return 35;
    return 30;
  }
  function pachet3Discount(markupPct){
    if(markupPct < 20) return 30;
    if(markupPct < 30) return 35;
    return 40;
  }
  function isNearOrBelowCost(price, cost){ return cost != null && price != null && price <= cost * 1.05; }

  // ================= SINCRONIZARE PREȚURI CU CÎMPURILE PERSONALIZATE DIN MOYSKLAD =================
  // UUID-urile atributelor personalizate configurate pe produs în MoySklad, date de utilizator.
  // Test de siguranță (dezactivat): a confirmat că sincronizarea funcționează corect (verificat
  // atît import cît și push, pe Pachet 3) după ce am descoperit adevărata structură a cîmpurilor
  // (tipuri de preț — salePrices — nu atribute personalizate). Las flag-ul, ca să poată fi repornit
  // rapid dacă apare vreodată un motiv nou să testăm izolat un singur cîmp.
  var PUSH_ONLY_PACHET3_TEST = false;
  var MS_PRICE_ATTRS = {
    buyPriceMdl: 'bd72d8fc-55bc-11d9-848a-00112f43529a',    // Закупочная цена — sinecost final (MDL)
    buyPriceUsd: '0a55a9b4-0646-411d-a5f5-48fa88114a7d',    // Pret furnizor in $ — ultimul preț de achiziție (USD)
    sellPrice: 'cbcf493b-55bc-11d9-848a-00112f43529a',      // Pret de Vinzare
    secondaryPrice: 'df2c7f04-fd28-4994-896c-1fa16a548e5c', // Preț secundar
    pachet1: 'b2f2373c-e60b-4728-9593-12a0136f8523',        // Pachet I (-30%)
    pachet2: 'cc207389-e4f3-4154-96e5-04590d99948c',        // Pachet II
    pachet3: '8359da17-c0b5-46aa-acba-9734fae2532c'         // Pachet III
  };
  // Rulează worker-ul peste o listă de elemente cu maxim `limit` cereri simultane — la comenzi
  // cu sute de produse, secvențial ar fi mult prea lent, iar fără limită am supraîncărca proxy-ul.
  function runWithConcurrency(items, limit, worker){
    return new Promise(function(resolve){
      var i = 0, active = 0;
      function next(){
        if(i >= items.length && active === 0){ resolve(); return; }
        while(active < limit && i < items.length){
          var item = items[i++]; active++;
          worker(item).catch(function(){}).then(function(){ active--; next(); });
        }
      }
      next();
    });
  }
  function computeOrderRowPachete(p, sc){
    var markupPct = (p.sellPrice != null && sc.cost) ? (((p.sellPrice - sc.cost)/sc.cost)*100) : null;
    var pachet1 = null, pachet2 = null, pachet3 = null;
    if(p.sellPrice != null && markupPct != null){
      pachet1 = p.sellPrice * 0.70;
      pachet2 = p.sellPrice * (1 - pachet2Discount(markupPct)/100);
      pachet3 = p.sellPrice * (1 - pachet3Discount(markupPct)/100);
    }
    return {
      pachet1: p.pachet1Price != null ? p.pachet1Price : pachet1,
      pachet2: p.pachet2Price != null ? p.pachet2Price : pachet2,
      pachet3: p.pachet3Price != null ? p.pachet3Price : pachet3
    };
  }
  // Import/trimitere prețuri MoySklad pot dura (zeci de produse, cereri la rînd) — fără protecție,
  // un al doilea clic pornea un al doilea ciclu concurent peste primul, riscînd rezultate amestecate.
  var msPriceSyncBusy = false;
  function setMsSyncBtn(id, busy, busyLabel, idleLabel){
    var b = document.getElementById(id);
