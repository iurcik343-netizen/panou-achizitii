  window.ptImportPricesFromMoySklad = async function(orderId){
    if(msPriceSyncBusy) return;
    var o = state.orders.find(function(x){ return x.id === orderId; });
    if(!o) return;
    var base = state.settings.moyskladProxyUrl;
    if(!base){ ptToast('MoySklad nu e configurat în Setări.', false); return; }
    var allProductKeys = orderProductKeys(o);
    var keys = allProductKeys.filter(function(k){ return moyskladLookup(state.products[k]); });
    // Produsele nelegate erau sărite silențios — utilizatorul vedea doar "N importate" și presupunea
    // greșit că restul chiar AU fost aduse din MoySklad, cînd de fapt rămăseseră cu formula generică
    // (adaos implicit), niciodată atinse. De obicei cauza e un catalog MoySklad local învechit —
    // spunem clar cîte au fost sărite, ca să știe să sincronizeze catalogul din nou.
    var skipped = allProductKeys.length - keys.length;
    if(!keys.length){ ptToast('Niciun produs din comandă nu e legat de MoySklad — sincronizează catalogul MoySklad (tab Comparație produse) și încearcă din nou.', false); return; }
    msPriceSyncBusy = true;
    setMsSyncBtn('pt-ms-import-btn', true, '⏳ Se importă…', '📥 Importă prețuri din MoySklad');
    setMsSyncBtn('pt-ms-push-btn', true, '', '📤 Trimite prețurile în MoySklad');
    ptToast('Se importă prețurile din MoySklad (' + keys.length + ' produse)…', true);
    var imported = 0, failed = 0;
    try {
      await runWithConcurrency(keys, 6, async function(k){
        var p = state.products[k];
        var mp = moyskladLookup(p);
        try {
          var res = await fetch(base + (base.indexOf('?')===-1?'?':'&') + 'attrs=' + encodeURIComponent(mp.id));
          var data = await res.json();
          if(!res.ok || data.error || !data.attributes){ failed++; return; }
          var a = data.attributes;
          // "Pret furnizor in $" e exact cîmpul în care scriem noi, la trimitere, sc.usdPrice —
          // deci la import citim din ACELAȘI cîmp, în buyPriceOverrideUsd (nu în "Закупочная цена",
          // care e doar sinecostul FINAL, deja cu curs+coeficient aplicat — s-ar recalcula oricum
          // diferit dacă cursul/coeficientul s-au schimbat între timp; USD-ul brut e sursa reală).
          if(a[MS_PRICE_ATTRS.buyPriceUsd] != null) p.buyPriceOverrideUsd = a[MS_PRICE_ATTRS.buyPriceUsd];
          if(a[MS_PRICE_ATTRS.sellPrice] != null) p.sellPrice = Math.round(a[MS_PRICE_ATTRS.sellPrice]);
          if(a[MS_PRICE_ATTRS.secondaryPrice] != null) p.secondaryPrice = Math.round(a[MS_PRICE_ATTRS.secondaryPrice]);
          if(a[MS_PRICE_ATTRS.pachet1] != null) p.pachet1Price = a[MS_PRICE_ATTRS.pachet1];
          if(a[MS_PRICE_ATTRS.pachet2] != null) p.pachet2Price = a[MS_PRICE_ATTRS.pachet2];
          if(a[MS_PRICE_ATTRS.pachet3] != null) p.pachet3Price = a[MS_PRICE_ATTRS.pachet3];
          // Reținem și procentul echivalent (relativ la prețul de vînzare importat), la fel ca la
          // o editare manuală — altfel, la prima modificare ulterioară a prețului de vînzare,
          // valorile tocmai importate ar fi înlocuite cu formula generică în loc să urmeze
          // reducerea reală adusă din MoySklad.
          if(p.sellPrice != null && p.sellPrice > 0){
            if(p.secondaryPrice != null) p.secondaryPct = Math.round((1 - p.secondaryPrice/p.sellPrice)*100);
            if(p.pachet2Price != null) p.pachet2Pct = Math.round((1 - p.pachet2Price/p.sellPrice)*100);
            if(p.pachet3Price != null) p.pachet3Pct = Math.round((1 - p.pachet3Price/p.sellPrice)*100);
          }
          imported++;
        } catch(e){ failed++; }
      });
      save(); renderOrderDetailTable();
      ptToast('Prețuri importate din MoySklad: ' + imported + ' produse' + (failed?(', ' + failed + ' eșuate'):'') + (skipped?(', ' + skipped + ' nelegate de MoySklad (sincronizează catalogul)'):'') + '. Verifică și corectează mai jos.', true);
    } finally {
      msPriceSyncBusy = false;
      setMsSyncBtn('pt-ms-import-btn', false, '', '📥 Importă prețuri din MoySklad');
      setMsSyncBtn('pt-ms-push-btn', false, '', '📤 Trimite prețurile în MoySklad');
    }
  };
  window.ptPushPricesToMoySklad = async function(orderId){
    if(msPriceSyncBusy) return;
    var o = state.orders.find(function(x){ return x.id === orderId; });
    if(!o) return;
    var base = state.settings.moyskladProxyUrl;
    if(!base){ ptToast('MoySklad nu e configurat în Setări.', false); return; }
    var allProductKeys2 = orderProductKeys(o);
    var keys = allProductKeys2.filter(function(k){ return moyskladLookup(state.products[k]); });
    var skippedPush = allProductKeys2.length - keys.length;
    if(!keys.length){ ptToast('Niciun produs din comandă nu e legat de MoySklad — sincronizează catalogul MoySklad (tab Comparație produse) și încearcă din nou.', false); return; }
    var testNote = PUSH_ONLY_PACHET3_TEST ? ' TEST DE SIGURANȚĂ: se trimite doar cîmpul Pachet 3, restul rămîn neatinse.' : '';
    if(!confirm('Trimiți prețurile curente pentru ' + keys.length + ' produse direct în MoySklad?' + testNote + ' Suprascrie cîmpurile de preț existente acolo pentru aceste produse.')) return;
    msPriceSyncBusy = true;
    setMsSyncBtn('pt-ms-push-btn', true, '⏳ Se trimit…', '📤 Trimite prețurile în MoySklad');
    setMsSyncBtn('pt-ms-import-btn', true, '', '📥 Importă prețuri din MoySklad');
    ptToast('Se trimit prețurile în MoySklad (' + keys.length + ' produse)' + (PUSH_ONLY_PACHET3_TEST ? ' — doar Pachet 3, test' : '') + '…', true);
    var sent = 0, failed = 0, firstErr = null;
    try {
      await runWithConcurrency(keys, 4, async function(k){
        var p = state.products[k];
        var mp = moyskladLookup(p);
        var sc = getOrderLineSinecost(o, k);
        var pachete = computeOrderRowPachete(p, sc);
        var attrsToSet = [];
        if(!PUSH_ONLY_PACHET3_TEST){
          if(sc.cost != null) attrsToSet.push({ id: MS_PRICE_ATTRS.buyPriceMdl, value: Math.round(sc.cost) });
          if(sc.usdPrice != null) attrsToSet.push({ id: MS_PRICE_ATTRS.buyPriceUsd, value: Math.round(sc.usdPrice * 100) / 100 });
          if(p.sellPrice != null) attrsToSet.push({ id: MS_PRICE_ATTRS.sellPrice, value: p.sellPrice });
          if(p.secondaryPrice != null) attrsToSet.push({ id: MS_PRICE_ATTRS.secondaryPrice, value: p.secondaryPrice });
          if(pachete.pachet1 != null) attrsToSet.push({ id: MS_PRICE_ATTRS.pachet1, value: Math.round(pachete.pachet1) });
          if(pachete.pachet2 != null) attrsToSet.push({ id: MS_PRICE_ATTRS.pachet2, value: Math.round(pachete.pachet2) });
        }
        if(pachete.pachet3 != null) attrsToSet.push({ id: MS_PRICE_ATTRS.pachet3, value: Math.round(pachete.pachet3) });
        if(!attrsToSet.length) return;
        try {
          var r = await moyskladPost('setAttrs', { id: mp.id, attributes: attrsToSet });
          if(!r.ok){
            failed++;
            if(!firstErr) firstErr = (r.data && r.data.error) || ('eroare necunoscută la ' + (p.name||k));
            console.error('ptPushPricesToMoySklad eșuat pentru', p.name, k, r.data);
            return;
          }
          sent++;
        } catch(e){ failed++; if(!firstErr) firstErr = String(e); }
      });
      ptToast('Prețuri trimise în MoySklad: ' + sent + ' produse' + (failed?(', ' + failed + ' eșuate — ' + firstErr):'') + (skippedPush?(', ' + skippedPush + ' nelegate de MoySklad (sincronizează catalogul)'):'') + '.', true);
    } finally {
      msPriceSyncBusy = false;
      setMsSyncBtn('pt-ms-import-btn', false, '', '📥 Importă prețuri din MoySklad');
      setMsSyncBtn('pt-ms-push-btn', false, '', '📤 Trimite prețurile în MoySklad');
    }
  };

  // ================= PREȚURI PE PRODUSELE UNEI COMENZI (în Istoric comenzi) =================
  function pkgCellHtml(key, idx, tierVal, manualVal, tierDiscPct, cost, sellPrice, manualPct, editablePct, reviewed){
    var effPct = (manualPct != null) ? manualPct : tierDiscPct;
    var pctComputedVal = (sellPrice != null && effPct != null) ? sellPrice * (1 - effPct/100) : tierVal;
    var effVal = (manualVal != null) ? manualVal : pctComputedVal;
    var isAlert = isNearOrBelowCost(effVal, cost);
    var marginPct = (effVal != null && cost) ? Math.round(((effVal - cost)/cost)*100) : null;
    var profitLei = (effVal != null && cost != null) ? Math.round(effVal - cost) : null;
    var displayDiscPct = (effVal != null && sellPrice) ? Math.round((1 - effVal/sellPrice)*100) : effPct;
    var borderStyle = reviewed ? 'border-color:var(--rank1);' : '';
    // Reducerea (-30% etc.) stătea inline lîngă cîmp doar la pachetul needitabil, dar jos la
    // celelalte — inconsecvent. Acum stă mereu jos, la fel ca "ad +Y%", indiferent de pachet.
    var pctControl = editablePct
      ? ' <input class="qty-input pt-pct-input" style="width:40px;padding:9px 4px;text-align:center;' + borderStyle + '" type="number" step="1" title="Procent reducere" value="' + (effPct!=null?Math.round(effPct):'') + '" onchange="ptSetPachetPct(\'' + key + '\',' + idx + ',this.value)">%'
      : '';
    var bottomParts = [];
    if(editablePct){
      // Procentul e deja vizibil și editabil în cîmpul din dreapta — repetarea lui jos era
      // redundantă (și dublu negativă cînd procentul e negativ). Punem profitul în lei în loc.
      if(profitLei != null) bottomParts.push((profitLei>=0?'+':'') + profitLei + ' lei');
    } else if(displayDiscPct != null){
      bottomParts.push('-' + displayDiscPct + '%');
    }
    if(marginPct != null) bottomParts.push('ad ' + (marginPct>=0?'+':'') + marginPct + '%');
    // Valoarea calculată automat trebuie să fie value= real, nu placeholder — un placeholder nu
    // se poate selecta/copia, ceea ce bloca exact fluxul pentru care exista cîmpul.
    var shownVal = effVal != null ? Math.round(effVal) : '';
    return '<td' + (isAlert ? ' style="background:var(--bad-bg);color:var(--bad);font-weight:700"' : '') + '>' +
      '<div style="display:flex;align-items:center;gap:4px;white-space:nowrap"><input class="qty-input pt-price-input" style="width:100%;' + borderStyle + '" type="number" step="0.01" value="' + shownVal + '" onchange="ptSetPachetPrice(\'' + key + '\',' + idx + ',this.value)">' + pctControl + '</div>' +
      (bottomParts.length ? '<div style="font-size:11px;color:var(--text-soft);margin-top:2px">' + bottomParts.join(' · ') + '</div>' : '') +
      (isAlert ? '<div style="font-size:10.5px">⚠ aproape/sub sinecost</div>' : '') + '</td>';
  }
  function orderProductKeys(o){
    // Păstrăm ordinea din comandă/factură (nu alfabetică) — e mai ușor de verificat linie cu
    // linie față de documentul original, fie el din MoySklad sau Excel-ul furnizorului.
    var seen = {}, keys = [];
    o.lines.forEach(function(l){
      if(state.products[l.key] && !seen[l.key]){ seen[l.key] = true; keys.push(l.key); }

    html += hiddenColsChipsHtml('inv', [ { col:'qty', label:'Cant. comandată' }, { col:'buy', label:'Achiziție (USD)' }, { col:'cost', label:'Sinecost (MDL)' } ].concat(msOnInv ? [{ col:'hist', label:'Istoric' }] : []));
    // Fiecare coloană poate fi micșorată pînă aproape de dispariție (min 15px) — inclusiv peste

    html += '<div class="table-wrap" style="overflow-y:auto"><table class="sticky-col-table pt-order-pricing-table"><thead><tr>' +
      resizableThHtml('inv', 'name', 'Produs', 230, 150, 640, false) +

      (isColHidden('inv','qty') ? '' : resizableThHtml('inv', 'qty', 'Cant. comandată', 110, 15, 220)) +
      (isColHidden('inv','buy') ? '' : resizableThHtml('inv', 'buy', 'Achiziție (USD)', 110, 15, 220)) +
      resizableThHtml('inv', 'sell', 'Preț de vânzare', 140, 15, 300, false) +
      (isColHidden('inv','cost') ? '' : resizableThHtml('inv', 'cost', 'Sinecost (MDL)', 110, 15, 220)) +
      resizableThHtml('inv', 'secondary', 'Preț secundar', 140, 15, 300, false) +
      resizableThHtml('inv', 'pachet1', 'Pachet 1 (-30%)', 120, 15, 300, false) +
      resizableThHtml('inv', 'pachet2', 'Pachet 2', 120, 15, 300, false) +
      resizableThHtml('inv', 'pachet3', 'Pachet 3', 120, 15, 300, false) +
      '</tr></thead><tbody>';
    keys.forEach(function(k){
      var p = state.products[k];
      var sc = getOrderLineSinecost(o, k);
      var msProd = moyskladLookup(p);
      if(msProd){ ensureImageUrl(msProd); ensureHistoryLoaded(msProd.id); }
      // Valori vechi, corupte (calculate înainte să existe rotunjirea — ex: 658.9570105263158)
      // rămâneau blocate la nesfîrșit: fiindcă NU sînt null, nici sincronizarea live din MoySklad
      // (care doar completează golurile), nici formula de rezervă nu le mai atingeau vreodată. Un
      // preț real (tastat de om, din MoySklad, sau calculat de aplicație) are cel mult 2 zecimale —
      // orice altceva e sigur gunoi numeric vechi. Îl resetăm ca să fie recalculat corect mai jos.
      function clearIfGarbagePrice(v){
        if(v == null) return null;
        var cents = v * 100;
        return (Math.abs(cents - Math.round(cents)) > 0.01) ? null : v;
      }
      p.sellPrice = clearIfGarbagePrice(p.sellPrice);
      p.secondaryPrice = clearIfGarbagePrice(p.secondaryPrice);
      p.pachet1Price = clearIfGarbagePrice(p.pachet1Price);
      p.pachet2Price = clearIfGarbagePrice(p.pachet2Price);
      p.pachet3Price = clearIfGarbagePrice(p.pachet3Price);
      // Preț de vânzare / secundar / Pachet 1-2-3: la fel ca sinecostul, urmăresc LIVE valoarea din
      // MoySklad (dacă produsul e legat și cîmpul respectiv are ceva acolo) — dar NUMAI cît timp
      // cîmpul n-a fost atins manual în ACEASTĂ comandă (marginea verde/reviewedFields). O dată ce
      // editezi un cîmp, MoySklad nu-l mai suprascrie — altfel orice re-randare (frecventă: la
      // fiecare editare, la fiecare poză încărcată) ți-ar șterge din greșeală ce tocmai ai tastat.
      function msLive(attrId){
        if(!msProd) return null;
        ensureMsAttrsLoaded(msProd.id);
        var cached = msAttrsCache[msProd.id];
        return (cached && cached.attrs && cached.attrs[attrId] != null) ? cached.attrs[attrId] : null;
      }
      if(!isFieldReviewed(o, k, 'sell')){
        var msSell = msLive(MS_PRICE_ATTRS.sellPrice);
        if(msSell != null) p.sellPrice = Math.round(msSell);
      }
      if(!isFieldReviewed(o, k, 'secondary')){
        var msSecondary = msLive(MS_PRICE_ATTRS.secondaryPrice);
        if(msSecondary != null) p.secondaryPrice = Math.round(msSecondary);
      }
      // Pachet 1 NU intră în sincronizarea live — e prin definiție mereu exact 70% din Preț de
      // vânzare (fără procent propriu, fără excepții, cerut explicit așa). Dacă l-am sincroniza și
      // pe el din MoySklad, ar intra în conflict direct cu propria lui formulă fixă: la fiecare
      // schimbare a Prețului de vânzare, formula îl recalculează corect, dar randarea următoare
      // l-ar suprascrie înapoi cu valoarea (acum neactualizată) din MoySklad, dînd impresia că
      // "nu se schimbă niciodată".
      if(!isFieldReviewed(o, k, 'pachet2')){
        var msP2 = msLive(MS_PRICE_ATTRS.pachet2);
        if(msP2 != null) p.pachet2Price = msP2;
      }
      if(!isFieldReviewed(o, k, 'pachet3')){
        var msP3 = msLive(MS_PRICE_ATTRS.pachet3);
        if(msP3 != null) p.pachet3Price = msP3;
      }
      // Prețul de vânzare vine din ce are produsul deja setat (import live de mai sus, sau editare
      // manuală); dacă tot n-are nimic, pornește de la adaosul implicit (dacă știm sinecostul),
      // altfel 0 — se poate ajusta oricum manual.
      if(p.sellPrice == null){
        p.sellPrice = (sc.cost != null) ? Math.round(suggestedPrice(sc.cost, state.settings.defaultMarkup)) : 0;
        save();
      }
      var sellVal = (p.sellPrice != null) ? p.sellPrice : '';
      var secondaryPct = (p.secondaryPct != null) ? p.secondaryPct : 15;
      if(p.secondaryPrice == null && p.sellPrice != null){ p.secondaryPrice = Math.round(p.sellPrice * (1 - secondaryPct/100)); save(); }
      var secondaryVal = (p.secondaryPrice != null) ? p.secondaryPrice : '';
      var markupPct = (p.sellPrice != null && sc.cost) ? (((p.sellPrice - sc.cost)/sc.cost)*100) : null;

      var pachet1 = null, pachet2 = null, pachet3 = null, disc2 = null, disc3 = null;
      if(p.sellPrice != null && markupPct != null){
        pachet1 = p.sellPrice * 0.70;
        disc2 = pachet2Discount(markupPct); pachet2 = p.sellPrice * (1 - disc2/100);
        disc3 = pachet3Discount(markupPct); pachet3 = p.sellPrice * (1 - disc3/100);
      }
      var kEsc = k.replace(/'/g,"\\'");
      var idSafe = k.replace(/[^a-zA-Z0-9]/g,'_');
      var invImgUrl = (msProd && msProd.imageUrl) || p.excelImageUrl || null;
      var barcodeRow = '<div style="display:flex;align-items:center;gap:3px;margin-top:2px">' +
        '<input type="text" value="' + escAttr(p.barcode||'') + '" placeholder="fără barcode" style="font-size:10px;padding:2px 4px;width:105px;margin:0;' + (p.barcode?'':'border-color:var(--bad)') + '" onchange="ptSetProductBarcode(\'' + kEsc + '\',this.value)" title="Barcode-ul produsului — corectează-l dacă e greșit sau lipsă, ca să se lege corect de MoySklad (poză/istoric)">' +
        '<button class="icon-link" style="padding:0 3px;font-size:10px;flex-shrink:0" onclick="ptToggleOrderMerge(\'' + kEsc + '\')" title="E același produs cu un barcode diferit, deja în sistem? Caută-l și unește-le">🔀</button>' +
        '</div>' +
        (orderMergeOpenKey === k ? ('<div style="margin-top:4px;max-width:230px"><input type="text" id="inv-merge-search-' + idSafe + '" placeholder="Scrie măcar 2 litere din numele produsului…" style="font-size:11px;margin:0" oninput="ptMergeSearch(\'' + kEsc + '\', this.value, \'inv-\')"><div id="inv-merge-results-' + idSafe + '"></div></div>') : '');

      html += '<tr><td style="font-family:var(--sans)"><div style="display:flex;align-items:center;gap:4px">' +
        (invImgUrl ? '<img src="' + escAttr(invImgUrl) + '" style="width:28px;height:28px;object-fit:cover;border-radius:5px;flex-shrink:0" onerror="this.style.visibility=\'hidden\'">' : '<div style="width:28px;height:28px;flex-shrink:0"></div>') +
        '<span class="pt-prodname-resizable" data-colw="inv:name" style="width:' + getColWidth('inv','name',230) + 'px;font-weight:700" title="' + jsAttrEscape(p.displayName) + '">' + p.displayName + (p.quantity?' <span style="color:var(--text-soft);font-weight:400">('+p.quantity+')</span>':'') + '</span>' +
        ' <button class="icon-link" style="padding:0 3px;flex-shrink:0" title="Copiază denumirea" onclick="ptCopyText(\'' + jsAttrEscape(p.displayName) + '\', \'Denumirea\')">📋</button>' +
        ' <button class="icon-link" style="padding:0 3px;flex-shrink:0" title="Caută denumirea pe Google" onclick="ptSearchGoogle(\'' + jsAttrEscape(p.displayName) + '\')">🔍</button></div>' +
        barcodeRow +
        (sc.source ? '<br><span style="font-size:10px;color:var(--text-soft)">sinecost: '+sc.source+'</span>' : '<br><span style="font-size:10px;color:var(--bad)">fără cost cunoscut</span>') + '</td>' +
        (msOnInv && !isColHidden('inv','hist') ? '<td>' + colwDivHtml('inv','hist',220, msProd ? (historyPreviewHtml(msProd.id) || '<span class="dim" style="font-size:11px">—</span>') : '<span class="dim" style="font-size:11px">—</span>') + '</td>' : '') +
        (isColHidden('inv','qty') ? '' : '<td style="text-align:center"><input class="qty-input" style="width:100%;text-align:center;font-weight:700" type="number" step="1" value="' + (qtyMap[k] != null ? qtyMap[k] : '') + '" onchange="ptSetOrderLineQty(\'' + kEsc + '\',this.value)"></td>') +
        (isColHidden('inv','buy') ? '' : '<td><input class="qty-input pt-price-input" style="width:100%;' + reviewedBorder(o,k,'buy') + '" type="number" step="0.01" value="' + (sc.usdPrice!=null?fmt(sc.usdPrice):'') + '" onchange="ptSetBuyPriceOverride(\'' + kEsc + '\',this.value)" title="Corectează dacă prețul de achiziție e greșit sau nesincronizat"></td>') +
        '<td><input class="qty-input pt-price-input pt-sell-price-input" style="width:100%;' + reviewedBorder(o,k,'sell') + '" type="number" step="0.01" value="' + sellVal + '" onchange="ptSetSellPrice(\'' + kEsc + '\',this.value)">' +
          '<div style="font-size:11px;color:var(--text-soft);margin-top:2px">' + (markupPct!=null?('ad '+(markupPct>=0?'+':'')+Math.round(markupPct)+'%'):'—') + '</div></td>' +
        (isColHidden('inv','cost') ? '' : '<td>' + colwDivHtml('inv','cost',110, sc.cost!=null?fmt(sc.cost):'—') + '</td>') +
        '<td><div style="display:flex;align-items:center;gap:4px;white-space:nowrap"><input class="qty-input pt-price-input" style="width:100%;' + reviewedBorder(o,k,'secondary') + '" type="number" step="0.01" value="' + secondaryVal + '" onchange="ptSetSecondaryPrice(\'' + kEsc + '\',this.value)">' +
          '<input class="qty-input pt-pct-input" style="width:42px;padding:9px 4px;text-align:center;' + reviewedBorder(o,k,'secondary') + '" type="number" step="1" title="Procent reducere pentru prețul secundar" value="' + secondaryPct + '" onchange="ptSetSecondaryPct(\'' + kEsc + '\',this.value)">%</div></td>' +
        pkgCellHtml(kEsc, 1, pachet1, p.pachet1Price, 30, sc.cost, p.sellPrice, null, false, isFieldReviewed(o,k,'pachet1')) +
        pkgCellHtml(kEsc, 2, pachet2, p.pachet2Price, disc2, sc.cost, p.sellPrice, p.pachet2Pct, true, isFieldReviewed(o,k,'pachet2')) +
        pkgCellHtml(kEsc, 3, pachet3, p.pachet3Price, disc3, sc.cost, p.sellPrice, p.pachet3Pct, true, isFieldReviewed(o,k,'pachet3')) +
        '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }
  // Marchează UN CÎMP anume ca „trecut prin” (editat) în comanda curent deschisă — per cîmp, nu
  // per rînd, ca marginea verde din tabel să arate exact ce a fost deja setat, cîmp cu cîmp.
  function markFieldReviewed(key, field){
    var o = state.orders.find(function(x){ return x.id === openOrderId; });
    if(!o) return;
    if(!o.reviewedFields) o.reviewedFields = {};
    if(!o.reviewedFields[key]) o.reviewedFields[key] = {};
    o.reviewedFields[key][field] = true;
  }
  function isFieldReviewed(o, key, field){
    return !!(o.reviewedFields && o.reviewedFields[key] && o.reviewedFields[key][field]);
  }
  function reviewedBorder(o, key, field){
    return isFieldReviewed(o, key, field) ? 'border-color:var(--rank1);' : '';
  }
  window.ptSetBuyPriceOverride = function(key, val){
    var p = state.products[key];
    if(!p) return;
    var n = parseFloat(val);
    p.buyPriceOverrideUsd = isNaN(n) ? null : n;
    markFieldReviewed(key, 'buy');
    save(); renderOrderDetailTable();
  };
  window.ptSetSellPrice = function(key, val){
    var n = parseFloat(val);
    var p = state.products[key];
    p.sellPrice = isNaN(n) ? null : Math.round(n);
    // Prețul secundar și pachetele urmăresc automat procentul curent (implicit sau moștenit
    // dintr-o editare/import anterior) ori de cîte ori se schimbă prețul de bază — altfel
    // rămîneau "înghețate" la valoarea calculată/importată prima dată.
    if(p.sellPrice != null){
      var pct = (p.secondaryPct != null) ? p.secondaryPct : 15;
      p.secondaryPrice = Math.round(p.sellPrice * (1 - pct/100));
      p.pachet1Price = Math.round(p.sellPrice * 0.70); // Pachet 1 e mereu -30% fix, fără procent propriu.
      var ordForCoef = state.orders.find(function(x){ return x.id === openOrderId; });
      var sc = getOrderLineSinecost(ordForCoef, key);
      var markupPct = sc.cost ? (((p.sellPrice - sc.cost)/sc.cost)*100) : null;
      var pct2 = (p.pachet2Pct != null) ? p.pachet2Pct : (markupPct != null ? pachet2Discount(markupPct) : null);
      var pct3 = (p.pachet3Pct != null) ? p.pachet3Pct : (markupPct != null ? pachet3Discount(markupPct) : null);
      if(pct2 != null) p.pachet2Price = Math.round(p.sellPrice * (1 - pct2/100));
      if(pct3 != null) p.pachet3Price = Math.round(p.sellPrice * (1 - pct3/100));
    }
    markFieldReviewed(key, 'sell');
    save(); renderOrderDetailTable();
  };
  window.ptSetSecondaryPrice = function(key, val){
    var n = parseFloat(val);
    var p = state.products[key];
    p.secondaryPrice = isNaN(n) ? null : Math.round(n);
    if(p.secondaryPrice != null && p.sellPrice != null && p.sellPrice > 0){
      p.secondaryPct = Math.round((1 - p.secondaryPrice / p.sellPrice) * 100);
    }
    markFieldReviewed(key, 'secondary');
    save(); renderOrderDetailTable();
  };
  window.ptSetSecondaryPct = function(key, val){
    var pct = parseFloat(val);
    if(isNaN(pct)) return;
    var p = state.products[key];
    p.secondaryPct = pct;
    if(p.sellPrice != null) p.secondaryPrice = Math.round(p.sellPrice * (1 - pct/100));
    markFieldReviewed(key, 'secondary');
    save(); renderOrderDetailTable();
  };
  window.ptSetPachetPrice = function(key, idx, val){
    var n = parseFloat(val);
    var p = state.products[key];
    var field = 'pachet' + idx + 'Price';
    p[field] = isNaN(n) ? null : n;
    if(!isNaN(n) && p.sellPrice != null && p.sellPrice > 0 && idx !== 1){
      p['pachet' + idx + 'Pct'] = Math.round((1 - n / p.sellPrice) * 100);
    }
    markFieldReviewed(key, 'pachet' + idx);
    save(); renderOrderDetailTable();
  };
  window.ptSetPachetPct = function(key, idx, val){
    var pct = parseFloat(val);
    if(isNaN(pct)) return;
    var p = state.products[key];
    p['pachet' + idx + 'Pct'] = pct;
    markFieldReviewed(key, 'pachet' + idx);
    if(p.sellPrice != null) p['pachet' + idx + 'Price'] = p.sellPrice * (1 - pct/100);
    save(); renderOrderDetailTable();
  };
  // Restaurarea poziției e ACUM necondiționată, la fiecare randare — nu doar la editările "de
  // la tastatură". Motivul: la o comandă mare, zeci de re-randări din fundal (poze/istoric/prețuri
  // MoySklad care tot sosesc) pot veni la milisecunde după o editare — dacă doar editarea își
  // proteja scroll-ul, o re-randare de fundal imediat următoare (neprotejată) anula exact
  // restaurarea abia făcută, și pagina tot sărea. Restaurarea e sincronă, imediat după schimbarea
  // de conținut — nu mai există o "a doua încercare" întîrziată (pe cadrul următor), care lupta cu
  // scroll-ul activ al utilizatorului cît timp acesta chiar derula pagina.
  function renderOrderDetailTable(){
    if(!openOrderId) return;
    var o = state.orders.find(function(x){ return x.id === openOrderId; });
    var box = document.getElementById('pt-order-detail-table');
    if(!o || !box) return;
    var prevPageScrollY = window.scrollY;
    var prevWrap = box.querySelector('.table-wrap');
    var prevScrollLeft = prevWrap ? prevWrap.scrollLeft : 0;
    var prevScrollTop = prevWrap ? prevWrap.scrollTop : 0;
    box.innerHTML = buildOrderPricingTableHtml(o);
    var newWrap = box.querySelector('.table-wrap');
    if(newWrap){
      newWrap.scrollLeft = prevScrollLeft;
      newWrap.scrollTop = prevScrollTop;
      mountStickyHeader(newWrap);
      fitTableWrapHeight(newWrap);
    }
    if(window.scrollY !== prevPageScrollY) window.scrollTo(0, prevPageScrollY);
    // DEBUG TEMPORAR — de scos după ce găsim cauza săriturii de scroll la editarea prețurilor.
    console.log('[scrollDbg] renderOrderDetailTable done: prevPageScrollY=', prevPageScrollY, 'finalScrollY=', window.scrollY, 'activeElement=', document.activeElement && document.activeElement.tagName);
  }
  window.exportOrderPricingExcel = function(orderId){
    var o = state.orders.find(function(x){ return x.id === orderId; });
    if(!o) return;
    var wsData = [['Produs','Brand','Cantitate','Cant. comandată','Barcode','Achiziție (USD)','Preț de vânzare','Sinecost (MDL)','Preț secundar','Adaos %','Pachet 1 (-30%)','Pachet 2','Pachet 2 %','Pachet 3','Pachet 3 %','Alertă marjă']];
    var qtyMap = orderLineQtyMap(o);
    orderProductKeys(o).forEach(function(k){
      var p = state.products[k];
      var sc = getOrderLineSinecost(o, k);
      var markupPct = (p.sellPrice != null && sc.cost) ? (((p.sellPrice - sc.cost)/sc.cost)*100) : null;
      var pachet1 = null, pachet2 = null, pachet3 = null, disc2 = null, disc3 = null, alertFlag = '';
      if(p.sellPrice != null && markupPct != null){
        pachet1 = p.sellPrice * 0.70;
        disc2 = (p.pachet2Pct != null) ? p.pachet2Pct : pachet2Discount(markupPct); pachet2 = p.sellPrice * (1 - disc2/100);
        disc3 = (p.pachet3Pct != null) ? p.pachet3Pct : pachet3Discount(markupPct); pachet3 = p.sellPrice * (1 - disc3/100);
      }
      var eff1 = (p.pachet1Price != null) ? p.pachet1Price : pachet1;
      var eff2 = (p.pachet2Price != null) ? p.pachet2Price : pachet2;
      var eff3 = (p.pachet3Price != null) ? p.pachet3Price : pachet3;
      if(isNearOrBelowCost(eff1, sc.cost) || isNearOrBelowCost(eff2, sc.cost) || isNearOrBelowCost(eff3, sc.cost)) alertFlag = 'ATENȚIE — aproape/sub sinecost';
      wsData.push([
        p.displayName, p.brand||'', p.quantity||'', qtyMap[k] != null ? qtyMap[k] : '', p.barcode||'',
        sc.usdPrice!=null?sc.usdPrice.toFixed(2):'', p.sellPrice!=null?p.sellPrice.toFixed(2):'',
        sc.cost!=null?sc.cost.toFixed(2):'', p.secondaryPrice!=null?p.secondaryPrice.toFixed(2):'',
        markupPct!=null?markupPct.toFixed(1):'',
        eff1!=null?eff1.toFixed(2):'', eff2!=null?eff2.toFixed(2):'', disc2!=null?disc2:'',
        eff3!=null?eff3.toFixed(2):'', disc3!=null?disc3:'', alertFlag
      ]);
    });
    var ws = XLSX.utils.aoa_to_sheet(wsData);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Preturi');
    XLSX.writeFile(wb, 'preturi_comanda_' + o.date + '_' + supplierName(o.supplierId).replace(/[^a-z0-9]+/gi,'_') + '.xlsx');
  }

    state.suppliers = state.suppliers.filter(function(s){ return s.id !== id; });

  window.ptDeletePriceList = function(id){

      : ('Ștergi price list-ul „' + pl.fileName + '" (' + pl.productKeys.length + ' produse) de la ' + supplierName(pl.supplierId) + '?\n\nPrețurile acestor produse de la acest furnizor vor fi eliminate din Comparație produse — poți reimporta oricând o versiune curată.');

    var removed = 0;

      state.settings.eurPerUsd = parseFloat(document.getElementById('pt-set-eur').value) || state.settings.eurPerUsd;
      state.settings.coef = parseFloat(document.getElementById('pt-set-coef').value) || state.settings.coef;
      recomputeAllLandedCosts();
      save();
      var fb = document.getElementById('pt-set-feedback'); fb.className = 'feedback ok'; fb.textContent = 'Setări salvate și costuri recalculate.';
      renderCompare();
    });
    document.getElementById('pt-ms-test').addEventListener('click', async function(){
      var proxyUrl = document.getElementById('pt-ms-proxy').value.trim();
      var fb = document.getElementById('pt-ms-feedback');
      if(!proxyUrl){ fb.className = 'feedback err'; fb.textContent = 'Completează URL-ul serverului intermediar.'; return; }
      fb.className = 'feedback'; fb.textContent = 'Se testează…';
      try {
        var res = await fetch(proxyUrl);
        var data = await res.json();
        if(!res.ok || data.error){
          fb.className = 'feedback err'; fb.textContent = 'Serverul a răspuns cu eroare: ' + (data.detail || data.error || res.status) + '. Verifică URL-ul și secretele configurate pe Worker.';
          return;
        }
        state.settings.moyskladProxyUrl = proxyUrl;
        save();
        fb.className = 'feedback ok'; fb.textContent = '✓ Conectat! ' + Object.keys(data.stock || {}).length + ' coduri de bare cu stoc găsite. Mergi în tab-ul Comparație produse sau Produse MoySklad și apasă „Actualizează"/„Sincronizează" ca să aduci și restul datelor (preț, imagine, zile în depozit).';
        renderCompare();
      } catch(err){
        fb.className = 'feedback err';
        fb.textContent = 'Nu am putut ajunge la acest URL. Verifică dacă e corect și dacă Worker-ul e publicat. Eroare: ' + (err && err.message ? err.message : err);
      }
    });
    document.getElementById('pt-export-json').addEventListener('click', function(){
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'panou-achizitii-backup-' + todayStr() + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
    document.getElementById('pt-import-json-btn').addEventListener('click', function(){
      document.getElementById('pt-import-json').click();
    });
    document.getElementById('pt-import-json').addEventListener('change', function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        var fb = document.getElementById('pt-backup-feedback');
        try {
          var parsed = JSON.parse(reader.result);
          applyImportedState(parsed);
          save();
          renderCompare(); renderSettings();
          fb.className = 'feedback ok'; fb.textContent = '✓ Backup încărcat și salvat.';
        } catch(err){
          fb.className = 'feedback err'; fb.textContent = 'Fișier invalid: ' + (err && err.message ? err.message : err);
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });
    document.getElementById('pt-history-open').addEventListener('click', function(){ ptOpenHistoryPanel(); });
    document.getElementById('pt-cleanup-order-prices').addEventListener('click', ptRepairSupplierPrices);
    document.getElementById('pt-signout').addEventListener('click', async function(){
      await supabaseClient.auth.signOut();
      location.reload();
    });
    document.getElementById('pt-change-password-btn').addEventListener('click', async function(){
      var password = document.getElementById('pt-change-password').value;
      var fb = document.getElementById('pt-account-feedback');
      if(!password || password.length < 6){
        fb.className = 'feedback err'; fb.textContent = 'Parola trebuie să aibă cel puțin 6 caractere.';
        return;
      }
      fb.className = 'feedback'; fb.textContent = 'Se salvează…';
      var result = await supabaseClient.auth.updateUser({ password: password });
      if(result.error){
        fb.className = 'feedback err'; fb.textContent = 'Nu am putut schimba parola: ' + result.error.message;
        return;
      }
      document.getElementById('pt-change-password').value = '';
      fb.className = 'feedback ok'; fb.textContent = 'Parolă schimbată.';
    });
  }

  // ================= ENTER = SALVEAZĂ ȘI SARI LA URMĂTORUL PREȚ =================
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    var input = e.target;
    if(!input.classList || !input.classList.contains('pt-sell-price-input')) return;
    e.preventDefault();
    var allInputs = Array.prototype.slice.call(document.querySelectorAll('.pt-sell-price-input'));
    var idx = allInputs.indexOf(input);
    input.blur();
    var newInputs = Array.prototype.slice.call(document.querySelectorAll('.pt-sell-price-input'));
    var next = newInputs[idx + 1];
    if(next){ next.focus(); next.select(); }
  });

  // ================= CLIC PE UN CÎMP NUMERIC: GOL DACĂ E 0, SELECTAT DACĂ NU =================
  // La orice cîmp numeric din aplicație: dacă valoarea curentă e 0, o ștergem la focus (ca să nu
  // mai fie nevoie s-o ștergi manual înainte de a scrie cifra reală); altfel, selectăm tot textul,
  // ca o cifră nouă să înlocuiască imediat valoarea veche, fără ștergere manuală. La fel pentru
  // cîmpurile de procent — sînt tot type=number, deci intră automat sub aceeași regulă.
  // IMPORTANT: dacă utilizatorul doar dă clic și pleacă fără să scrie nimic, cîmpul rămînea gol —
  // browserul declanșează oricum 'change' (0 → ''), iar handlerul de preț salva asta ca ștergere
  // reală a valorii. Reținem ce am șters (data-pt-zero) și, dacă nimic nu a fost tastat pînă la
  // 'change', restabilim valoarea ÎNAINTE ca handlerul propriu-zis (onchange) s-o vadă — de-asta
  // ascultătorul de 'change' de mai jos e în faza de capturare, nu de propagare.
  document.addEventListener('focusin', function(e){
    var el = e.target;
    if(!el || el.tagName !== 'INPUT' || el.type !== 'number') return;
    if(el.value !== '' && parseFloat(el.value) === 0){
      el.dataset.ptZeroCleared = el.value;
      el.value = '';
    } else {
      delete el.dataset.ptZeroCleared;
      // .select() imediat pe 'focus'/'focusin' e uneori suprascris de poziționarea implicită a
      // cursorului la locul clicului (Chrome) — un setTimeout(…,0) îl aplică după acel pas.
      setTimeout(function(){ try { el.select(); } catch(err){} }, 0);
    }
  });
  document.addEventListener('input', function(e){
    var el = e.target;
    if(el && el.dataset && el.dataset.ptZeroCleared !== undefined) delete el.dataset.ptZeroCleared;
  }, true);
  document.addEventListener('change', function(e){
    var el = e.target;
    if(!el || !el.dataset) return;
    if(el.dataset.ptZeroCleared !== undefined && el.value === '') el.value = el.dataset.ptZeroCleared;
    delete el.dataset.ptZeroCleared;
  }, true);

  // ================= DRAG-TO-SCROLL PENTRU TABELE LATE =================
  (function(){
    var dragEl = null, startX = 0, startScroll = 0, moved = false;
    document.addEventListener('mousedown', function(e){
      var wrap = e.target.closest ? e.target.closest('#pt-root .table-wrap') : null;
      if(!wrap || wrap.scrollWidth <= wrap.clientWidth) return;
      dragEl = wrap; startX = e.pageX; startScroll = wrap.scrollLeft; moved = false;
      wrap.classList.add('dragging');
    });
    document.addEventListener('mousemove', function(e){
      if(!dragEl) return;
      var dx = e.pageX - startX;
      if(Math.abs(dx) > 3) moved = true;
      if(moved){ dragEl.scrollLeft = startScroll - dx; e.preventDefault(); }
    });
    function endDrag(){
      if(!dragEl) return;
      dragEl.classList.remove('dragging');
      if(moved){
        var suppressClick = function(ev){ ev.stopPropagation(); ev.preventDefault(); document.removeEventListener('click', suppressClick, true); };
        document.addEventListener('click', suppressClick, true);
      }
      dragEl = null; moved = false;
    }
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('mouseleave', endDrag);
  })();

  // ================= DEBUG TEMPORAR — depistare salt de scroll la editare preț =================
  // De scos după ce găsim cauza. Loghează un stack trace la ORICE schimbare de scroll mai mare de
  // 40px — nu doar la un salt spre 0 — ca să nu ratăm tiparul real dacă saltul nu ajunge chiar la 0.
  (function(){
    var lastY = window.scrollY;
    window.addEventListener('scroll', function(){
      var y = window.scrollY;
      if(Math.abs(y - lastY) > 40){
        console.log('[scrollDbg] PAGINA SCROLL SCHIMBAT: era ' + lastY + ', acum ' + y + ' @ ' + new Date().toISOString());
        console.trace('[scrollDbg] stack la momentul schimbării (pagină)');
      }
      lastY = y;
    });
  })();
  // La fel, dar pentru scrollul PROPRIU al tabelului (.table-wrap), separat de scrollul paginii —
  // dacă tabelul își resetează singur poziția internă, window.scrollY n-ar arăta nimic anormal.
  (function(){
    var lastWrapY = {};
    document.addEventListener('scroll', function(e){
      var el = e.target;
      if(!el || !el.classList || !el.classList.contains('table-wrap')) return;
      if(!el.dataset.dbgId) el.dataset.dbgId = 'wrap' + Math.random().toString(36).slice(2, 7);
      var id = el.dataset.dbgId;
      var y = el.scrollTop;
      var prev = lastWrapY[id];
      if(prev !== undefined && Math.abs(y - prev) > 40){
        console.log('[scrollDbg] TABLE-WRAP (' + id + ') SCROLL SCHIMBAT: era ' + prev + ', acum ' + y + ' @ ' + new Date().toISOString());
        console.trace('[scrollDbg] stack la momentul schimbării (table-wrap)');
      }
      lastWrapY[id] = y;
    }, true);
  })();

  // ================= TABS WIRING =================
  var tabButtons = document.querySelectorAll('#pt-root .tab-btn');
  tabButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      tabButtons.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelectorAll('#pt-root .tab-content').forEach(function(c){ c.style.display = 'none'; });
      document.getElementById('tab-' + btn.dataset.tab).style.display = 'block';
      if(btn.dataset.tab === 'add') renderAdd();
      if(btn.dataset.tab === 'orders') renderOrders();
      if(btn.dataset.tab === 'catalog') renderCatalog();
      if(btn.dataset.tab === 'suppliers') renderSuppliers();
      if(btn.dataset.tab === 'settings') renderSettings();
    });
  });

  async function startApp(){
    if(appStarted) return;
    appStarted = true;
    document.getElementById('tab-compare').innerHTML = '<div class="panel empty">Se încarcă…</div>';
    await load();
    if(!state.settings.ratesUpdatedAt){
      fetchRates().then(function(ok){
        autoFetchFailed = !ok;
        renderCompare();
        var settingsTab = document.getElementById('tab-settings');
        if(settingsTab && settingsTab.style.display !== 'none') renderSettings();
      });
    }
    renderCompare();
  }

  // ================= AUTENTIFICARE =================
  var authMode = 'login';
  function showApp(session){
    currentUserEmail = (session && session.user && session.user.email) || '';
    document.getElementById('pt-auth-gate').style.display = 'none';
    document.getElementById('pt-app-wrap').style.display = '';
    startApp();
  }
  function showAuthGate(){
    document.getElementById('pt-auth-gate').style.display = '';
    document.getElementById('pt-app-wrap').style.display = 'none';
  }
  function setAuthMode(mode){
    authMode = mode;
    var recovery = mode === 'recovery';
    document.getElementById('pt-auth-title').textContent = recovery ? 'Parolă nouă' : 'Panou achiziții';
    document.getElementById('pt-auth-hint').textContent = recovery ? 'Alege o parolă nouă pentru contul tău.' : 'Autentifică-te pentru a accesa datele.';
    document.getElementById('pt-auth-email-row').style.display = recovery ? 'none' : '';
    document.getElementById('pt-auth-forgot-row').style.display = recovery ? 'none' : '';
    document.getElementById('pt-auth-password-label').textContent = recovery ? 'Parolă nouă' : 'Parolă';
    document.getElementById('pt-auth-password').autocomplete = recovery ? 'new-password' : 'current-password';
    document.getElementById('pt-auth-submit').textContent = recovery ? 'Salvează parola' : 'Intră';
    document.getElementById('pt-auth-feedback').style.display = 'none';
  }
  async function doSignIn(){
    var email = document.getElementById('pt-auth-email').value.trim();
    var password = document.getElementById('pt-auth-password').value;
    var fb = document.getElementById('pt-auth-feedback');
    fb.style.display = 'block'; fb.className = 'feedback'; fb.textContent = 'Se autentifică…';
    if(SUPABASE_URL.indexOf('YOUR-PROJECT') !== -1){
      fb.className = 'feedback err';
      fb.textContent = 'Aplicația nu e încă legată de un proiect Supabase — completează SUPABASE_URL și SUPABASE_ANON_KEY în cod (vezi comentariul din partea de sus a scriptului).';
      return;
    }
    if(!email || !password){
      fb.className = 'feedback err'; fb.textContent = 'Completează email și parolă.';
      return;
    }
    var result = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
    if(result.error){
      fb.className = 'feedback err'; fb.textContent = 'Autentificare eșuată: ' + result.error.message;
      return;
    }
    fb.style.display = 'none';
  }
  async function doSetNewPassword(){
    var password = document.getElementById('pt-auth-password').value;
    var fb = document.getElementById('pt-auth-feedback');
    fb.style.display = 'block'; fb.className = 'feedback'; fb.textContent = 'Se salvează…';
    if(!password || password.length < 6){
      fb.className = 'feedback err'; fb.textContent = 'Parola trebuie să aibă cel puțin 6 caractere.';
      return;
    }
    var result = await supabaseClient.auth.updateUser({ password: password });
    if(result.error){
      fb.className = 'feedback err'; fb.textContent = 'Nu am putut salva parola: ' + result.error.message;
      return;
    }
    fb.style.display = 'none';
    authMode = 'login';
    var sessionResult = await supabaseClient.auth.getSession();
    if(sessionResult.data && sessionResult.data.session) showApp(sessionResult.data.session);
  }
  document.getElementById('pt-auth-form').addEventListener('submit', function(e){
    e.preventDefault();
    if(authMode === 'recovery') doSetNewPassword(); else doSignIn();
  });
  document.getElementById('pt-auth-forgot').addEventListener('click', async function(){
    var email = document.getElementById('pt-auth-email').value.trim();
    var fb = document.getElementById('pt-auth-feedback');
    fb.style.display = 'block';
    if(!email){
      fb.className = 'feedback err'; fb.textContent = 'Completează email-ul, apoi apasă din nou „Am uitat parola”.';
      return;
    }
    fb.className = 'feedback'; fb.textContent = 'Se trimite emailul de resetare…';
    var redirectUrl = window.location.href.split('#')[0].split('?')[0];
    var result = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl });
    if(result.error){
      fb.className = 'feedback err'; fb.textContent = 'Nu am putut trimite emailul: ' + result.error.message;
      return;
    }
    fb.className = 'feedback ok'; fb.textContent = 'Ți-am trimis un email cu link de resetare a parolei — verifică inbox-ul (și Spam).';
  });
  supabaseClient.auth.onAuthStateChange(function(event, session){
    if(event === 'PASSWORD_RECOVERY'){ setAuthMode('recovery'); showAuthGate(); return; }
    if(session){ showApp(session); } else { showAuthGate(); }
  });
  supabaseClient.auth.getSession().then(function(result){
    if(result.data && result.data.session){ showApp(result.data.session); } else { showAuthGate(); }
  });
})();
</script>
