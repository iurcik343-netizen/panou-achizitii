<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panou achiziții</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #F2F5F4;
    --panel: #FFFFFF;
    --border: #DCE4E1;
    --text: #1E2624;
    --text-soft: #71827D;
    --accent: #0F6E56;
    --accent-dark: #085041;
    --accent-soft: #E1F5EE;
    --rank1: #0F6E56; --rank1-bg: #E1F5EE;
    --rank2: #1B6FA8; --rank2-bg: #E6F1FB;
    --rank3: #A9762B; --rank3-bg: #FAEEDA;
    --bad: #C23B3B; --bad-bg: #FBEAEA;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --sans: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    --radius: 12px;
    --shadow-sm: 0 1px 3px rgba(15,110,86,0.07);
    --shadow-md: 0 4px 16px rgba(15,110,86,0.12);
  }
  * { box-sizing: border-box; }
  #pt-root { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; padding: 28px 20px 60px; }
  #pt-root .wrap { max-width: 1600px; margin: 0 auto; }
  #pt-root h1 { font-family: var(--sans); font-size: 27px; font-weight: 700; margin: 0 0 2px; letter-spacing: -0.01em; }
  #pt-root .sub { color: var(--text-soft); font-size: 13.5px; margin-bottom: 20px; }
  #pt-root .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; }
  #pt-root .tab-btn { background: none; border: none; padding: 10px 14px; font-size: 13.5px; font-weight: 700; color: var(--text); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: var(--sans); transition: color .15s ease, border-color .15s ease; }
  #pt-root .tab-btn:hover { color: var(--accent-dark); }
  #pt-root .tab-btn.active { color: var(--accent-dark); border-bottom-color: var(--accent); }
  #pt-root .subtabs { display: flex; gap: 8px; margin-bottom: 16px; }
  #pt-root .subtab-btn { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 12.5px; font-weight: 600; color: var(--text-soft); cursor: pointer; transition: background .15s ease, border-color .15s ease, color .15s ease; }
  #pt-root .subtab-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
  #pt-root .subtab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #pt-root .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
  #pt-root .panel h2 { font-family: var(--sans); font-weight: 600; font-size: 17px; margin: 0 0 4px; }
  #pt-root .panel .hint { color: var(--text-soft); font-size: 12.5px; margin-bottom: 14px; line-height: 1.5; }
  #pt-root label { display: block; font-size: 11.5px; font-weight: 700; color: var(--text); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.02em; }
  #pt-root input[type=text], #pt-root input[type=password], #pt-root input[type=number], #pt-root input[type=file], #pt-root select, #pt-root textarea {
    width: 100%; border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 9px 11px;
    font-size: 13.5px; font-family: var(--sans); color: var(--text); margin-bottom: 14px; transition: border-color .15s ease, box-shadow .15s ease;
  }
  #pt-root input[type=text]:focus, #pt-root input[type=password]:focus, #pt-root input[type=number]:focus, #pt-root select:focus, #pt-root textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #pt-root .auth-link { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 12px; font-weight: 600; padding: 0; }
  #pt-root .auth-link:hover { color: var(--accent-dark); text-decoration: underline; }
  #pt-root textarea { font-family: var(--mono); font-size: 12px; min-height: 120px; resize: vertical; }
  #pt-root .row { display: flex; gap: 12px; flex-wrap: wrap; }
  #pt-root .row > div { flex: 1; min-width: 130px; }
  #pt-root button.primary { background: var(--accent); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow-sm); transition: background .15s ease, box-shadow .15s ease, transform .1s ease; }
  #pt-root button.primary:hover { background: var(--accent-dark); box-shadow: var(--shadow-md); }
  #pt-root button.primary:active { transform: translateY(1px); }
  #pt-root button.primary:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
  #pt-root button.secondary { background: var(--panel); border: 1px solid var(--accent); color: var(--accent-dark); padding: 9px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s ease, box-shadow .15s ease; }
  #pt-root button.secondary:hover { background: var(--accent-soft); box-shadow: var(--shadow-sm); }
  #pt-root button.icon-x { background: none; border: none; color: var(--text-soft); cursor: pointer; font-size: 12.5px; padding: 2px 6px; border-radius: 5px; transition: color .15s ease, background .15s ease; }
  #pt-root button.icon-x:hover { color: var(--bad); background: var(--bad-bg); }
  #pt-root button.icon-link { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 11.5px; padding: 2px 6px; font-weight: 600; border-radius: 5px; transition: background .15s ease; }
  #pt-root button.icon-link:hover { background: var(--accent-soft); }
  #pt-root .supplier-chip { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; font-size: 14px; background: var(--panel); box-shadow: var(--shadow-sm); }
  #pt-root .feedback { font-size: 12.5px; padding: 10px 12px; border-radius: 7px; margin-top: 8px; white-space: pre-line; }
  #pt-root .feedback.ok { background: var(--rank1-bg); color: var(--rank1); }
  #pt-root .feedback.err { background: var(--bad-bg); color: var(--bad); }
  #pt-root .search-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  #pt-root .search-row input { margin-bottom: 0; }
  #pt-root .stat-strip { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  #pt-root .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; font-family: var(--mono); box-shadow: var(--shadow-sm); }
  #pt-root .stat .n { font-size: 20px; font-weight: 700; color: var(--accent-dark); }
  #pt-root .stat .l { font-size: 10.5px; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.04em; }
  #pt-root .legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--text-soft); margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  #pt-root .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  #pt-root .product-card { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow-sm); }
  #pt-root .product-head { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; background: var(--bg); border-bottom: 1px solid var(--border); gap: 8px; flex-wrap: wrap; }
  #pt-root .product-head .name { font-weight: 600; font-size: 13px; }
  #pt-root .product-head .meta { font-size: 10px; color: var(--text-soft); font-family: var(--mono); }
  #pt-root .product-head .rrp { font-family: var(--mono); font-size: 11px; background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 12px; }
  #pt-root .product-head .actions { display: flex; gap: 4px; align-items: center; }
  #pt-root table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  #pt-root th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-soft); padding: 8px 14px; }
  #pt-root td { padding: 7px 14px; border-top: 1px solid var(--border); font-family: var(--mono); }
  #pt-root .entry-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 12px; border-top: 1px solid var(--border); gap: 8px; flex-wrap: wrap; font-size: 11.5px; }
  #pt-root .entry-row.rank-1 { background: var(--rank1-bg); }
  #pt-root .entry-row.rank-2 { background: var(--rank2-bg); }
  #pt-root .entry-row.rank-3 { background: var(--rank3-bg); }
  #pt-root .entry-main { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-family: var(--mono); }
  #pt-root .entry-main b { font-family: var(--sans); font-weight: 600; font-size: 12px; }
  #pt-root .entry-tag { font-family: var(--sans); font-weight: 700; font-size: 9px; text-transform: uppercase; }
  #pt-root .entry-dim { color: var(--text-soft); }
  #pt-root .entry-actions { display: flex; gap: 0; align-items: center; }
  #pt-root .entry-actions button { padding: 2px 5px; }
  #pt-root .merge-toggle-row { padding: 4px 12px; border-top: 1px solid var(--border); }
  #pt-root .merge-toggle-row button { font-size: 10.5px; color: var(--text-soft); }
  #pt-root .merge-box { padding: 8px 12px; background: var(--bg); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  #pt-root .merge-box select { margin-bottom: 0; flex: 1; }
  #pt-root .cmp-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; table-layout: fixed; }
  #pt-root .cmp-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--text-soft); padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--bg); }
  #pt-root .sticky-col-table td:first-child, #pt-root .sticky-col-table th:first-child { position: sticky; left: 0; background: var(--panel); z-index: 2; box-shadow: 2px 0 4px rgba(0,0,0,0.05); }
  #pt-root .sticky-col-table th:first-child { background: var(--bg); z-index: 3; }
  #pt-root .cmp-table td { padding: 6px 10px; vertical-align: top; }
  #pt-root .cmp-table .prod-meta { font-size: 9.5px; color: var(--text-soft); font-family: var(--mono); margin-top: 1px; }
  #pt-root .prod-title-btn { background: none; border: none; cursor: pointer; text-align: left; padding: 0; font-family: var(--sans); font-weight: 700; font-size: 13px; color: var(--text); line-height: 1.3; }
  #pt-root .prod-title-btn:hover { color: var(--accent-dark); }
  #pt-root .price-cell-btn { background: none; border: none; cursor: pointer; font-family: var(--mono); font-size: 12px; text-align: left; padding: 3px 5px; border-radius: 5px; width: 100%; color: var(--text); }
  #pt-root .price-cell-btn:hover { background: var(--accent-soft); }
  #pt-root .price-cell-btn .sub { display: block; font-size: 9.5px; color: var(--text-soft); }
  #pt-root td.cheapest-cell { background: var(--rank1-bg); }
  #pt-root td.second-cell { background: rgba(27,111,168,0.08); }
  #pt-root td.third-cell { background: var(--rank3-bg); }
  #pt-root td.dim { color: var(--text-soft); text-align: center; font-size: 11px; }
  #pt-root .detail-panel { padding: 10px 12px; background: var(--bg); border-radius: 8px; }
  #pt-root tr.rank-1 td { background: var(--rank1-bg); }
  #pt-root tr.rank-1 .tag { color: var(--rank1); }
  #pt-root tr.rank-2 td { background: var(--rank2-bg); }
  #pt-root tr.rank-2 .tag { color: var(--rank2); }
  #pt-root tr.rank-3 td { background: var(--rank3-bg); }
  #pt-root tr.rank-3 .tag { color: var(--rank3); }
  #pt-root .tag { font-family: var(--sans); font-weight: 700; font-size: 10px; text-transform: uppercase; }
  #pt-root .price-up { color: var(--bad); font-weight: 700; }
  #pt-root .empty { text-align: center; padding: 40px 20px; color: var(--text-soft); font-size: 13.5px; }
  #pt-root .table-wrap { position: relative; overflow-x: auto; cursor: grab; scrollbar-width: thin; scrollbar-color: var(--accent) var(--bg); overscroll-behavior: contain; }
  #pt-root .cmp-sticky-header { display: flex; position: absolute; top: 0; left: 0; right: 0; z-index: 4; background: var(--bg); border-bottom: 1px solid var(--border); pointer-events: none; }
  #pt-root .cmp-sticky-header-cell { position: relative; flex: 0 0 auto; box-sizing: border-box; padding: 7px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; color: var(--text-soft); white-space: normal; word-break: break-word; line-height: 1.2; overflow: hidden; }
  #pt-root .cmp-sticky-header-cell:first-child { position: sticky; left: 0; background: var(--bg); box-shadow: 2px 0 4px rgba(0,0,0,0.05); }
  #pt-root .table-wrap.dragging { cursor: grabbing; user-select: none; }
  #pt-root .table-wrap::-webkit-scrollbar { height: 11px; }
  #pt-root .table-wrap::-webkit-scrollbar-track { background: var(--bg); }
  #pt-root .table-wrap::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 6px; }
  #pt-root .table-wrap::-webkit-scrollbar-thumb:hover { background: var(--accent-dark); }
  #pt-root input[type=number]::-webkit-inner-spin-button,
  #pt-root input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #pt-root input[type=number] { -moz-appearance: textfield; }
  #pt-root input[type=number].pt-pct-input::-webkit-inner-spin-button,
  #pt-root input[type=number].pt-pct-input::-webkit-outer-spin-button { -webkit-appearance: auto; margin: 0; }
  #pt-root input[type=number].pt-pct-input { -moz-appearance: auto; }
  #pt-root table.pt-order-pricing-table { width: max-content; min-width: 100%; }
  #pt-root table.pt-order-pricing-table td { padding: 6px 10px; vertical-align: top; }
  #pt-root .pt-prodname-resizable { display: inline-block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 50px; max-width: 640px; vertical-align: middle; }
  #pt-root th.pt-prodname-th, #pt-root th.pt-resizable-th { position: relative; }
  #pt-root .pt-colresize-handle { position: absolute; right: 0; top: 0; bottom: 0; width: 10px; cursor: col-resize; border-right: 2px solid var(--border); }
  #pt-root .pt-colresize-handle:hover, #pt-root .pt-colresize-handle.active { background: var(--accent); opacity: 0.4; border-right-color: var(--accent); }
  #pt-root .pt-colhide-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: var(--bg); border: none; color: var(--text-soft); font-size: 9px; line-height: 1; cursor: pointer; padding: 3px; border-radius: 3px; }
  #pt-root .pt-colhide-btn:hover { background: var(--bad); color: #fff; }
  #pt-root .qty-input { width: 70px; padding: 5px 7px; margin-bottom: 0; }
  #pt-root input[type=number].pt-pct-input { color: var(--bad); }
  #pt-root .map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 10px 14px; margin-bottom: 14px; }
  #pt-root .map-grid label { margin-bottom: 4px; }
  #pt-root .map-grid select { margin-bottom: 0; }
  #pt-root .preview-wrap { max-height: 220px; overflow: auto; border: 1px solid var(--border); border-radius: 7px; margin-bottom: 14px; }
  #pt-root .preview-wrap table { font-size: 11.5px; }
  #pt-root .order-summary { position: sticky; top: 0; }
  #pt-root .order-line { display: flex; justify-content: space-between; font-size: 12.5px; padding: 5px 0; border-bottom: 1px dashed var(--border); font-family: var(--mono); }
  #pt-root .order-total { display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; padding-top: 10px; margin-top: 6px; border-top: 1px solid var(--border); font-family: var(--mono); }
  #pt-root .two-col { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  #pt-root .two-col > .main { flex: 2; min-width: 320px; }
  #pt-root .two-col > .side { flex: 1; min-width: 260px; }
  #pt-root .history-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
  #pt-auth-gate { max-width: 380px; margin: 90px auto 0; }
  #pt-root .table-wrap { -webkit-overflow-scrolling: touch; }
  @media (max-width: 640px) {
    #pt-root { padding: 16px 12px 40px; }
    #pt-root h1 { font-size: 21px; }
    #pt-auth-gate { margin-top: 40px; max-width: 100%; }
    #pt-root .tabs { flex-wrap: nowrap; overflow-x: auto; }
    #pt-root .tab-btn { white-space: nowrap; padding: 10px 12px; }
    #pt-root .search-row { flex-direction: column; }
    #pt-root .stat-strip { gap: 8px; }
    #pt-root .stat { flex: 1 1 calc(50% - 8px); }
    #pt-root .panel { padding: 14px; }
  }
</style>
</head>
<body>

<div id="pt-root">
  <div id="pt-auth-gate">
    <form class="panel" id="pt-auth-form">
      <h2 id="pt-auth-title" style="font-family:var(--sans);font-weight:700;margin:0 0 4px">Panou achiziții</h2>
      <div class="hint" id="pt-auth-hint">Autentifică-te pentru a accesa datele.</div>
      <div id="pt-auth-email-row">
        <label>Email</label>
        <input type="text" id="pt-auth-email" name="email" autocomplete="username">
      </div>
      <label id="pt-auth-password-label">Parolă</label>
      <input type="password" id="pt-auth-password" autocomplete="current-password">
      <button class="primary" type="submit" id="pt-auth-submit" style="width:100%">Intră</button>
      <div style="text-align:center;margin-top:10px" id="pt-auth-forgot-row"><button type="button" class="auth-link" id="pt-auth-forgot">Am uitat parola</button></div>
      <div id="pt-auth-feedback" class="feedback" style="display:none"></div>
    </form>
  </div>
  <div class="wrap" id="pt-app-wrap" style="display:none">
    <h1>Panou achiziții</h1>
    <div class="sub">Compară furnizori pe barcode/nume, construiește comenzi, urmărește scumpirile.</div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="compare">Comparație produse</button>
      <button class="tab-btn" data-tab="add">Adaugă listă de preț</button>
      <button class="tab-btn" data-tab="orders">Comenzi</button>
      <button class="tab-btn" data-tab="catalog">Produse MoySklad</button>
      <button class="tab-btn" data-tab="suppliers">Furnizori</button>
      <button class="tab-btn" data-tab="settings">Setări</button>
    </div>

    <div id="tab-compare" class="tab-content"></div>
    <div id="tab-add" class="tab-content" style="display:none"></div>
    <div id="tab-orders" class="tab-content" style="display:none"></div>
    <div id="tab-catalog" class="tab-content" style="display:none"></div>
    <div id="tab-suppliers" class="tab-content" style="display:none"></div>
    <div id="tab-settings" class="tab-content" style="display:none"></div>
  </div>
</div>

<script>
(function(){
  // ================= CONFIG SUPABASE =================
  // 1) Creează un proiect gratuit pe https://supabase.com
  // 2) În proiectul nou → SQL Editor → rulează:
  //
  //      create table app_state (
  //        id text primary key default 'main',
  //        data jsonb not null default '{}'::jsonb,
  //        updated_at timestamptz not null default now()
  //      );
  //      alter table app_state enable row level security;
  //      create policy "authenticated select" on app_state for select using (auth.role() = 'authenticated');
  //      create policy "authenticated insert" on app_state for insert with check (auth.role() = 'authenticated');
  //      create policy "authenticated update" on app_state for update using (auth.role() = 'authenticated');
  //
  // 3) Authentication → Users → Add user: creează-ți contul (email + parolă). Nu e sign-up public,
  //    doar conturile create manual aici pot intra în aplicație.
  // 4) Settings → API: copiază "Project URL" și cheia "anon public" mai jos.
  var SUPABASE_URL = 'https://wijumzjsgjrzzipgdeyd.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_HSpJConvyLeGt3zPf7h8bw_RniB4NC7';
  var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var STATE_ROW_ID = 'main';
  var currentUserEmail = '';
  var appStarted = false;

  var state = {
    suppliers: [],
    products: {},
    orders: [],
    carts: {},
    importMappings: {},
    priceLists: [],
    settings: { exchangeRate: 17.68, krwPerUsd: 1375, eurPerUsd: 0.92, coef: 1.4, ratesUpdatedAt: null, defaultMarkup: 100, hiddenMoyskladBrandIds: [], hiddenMoyskladProductIds: [], pinnedBrands: [] }
  };

  var autoFetchFailed = false;
  function normName(s){ return String(s||'').toLowerCase().trim().replace(/\s+/g,' '); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function fmt(n){ return isFinite(n) ? Number(n).toFixed(2) : '—'; }

  // ================= REDIMENSIONARE COLOANE (persistă local, per dispozitiv) =================
  var COLWIDTH_KEY = 'pt_col_widths_v1';
  var colWidths = (function(){
    try { return JSON.parse(localStorage.getItem(COLWIDTH_KEY)) || {}; } catch(e){ return {}; }
  })();
  function getColWidth(table, col, dflt){
    return (colWidths[table] && colWidths[table][col]) || dflt;
  }
  function saveColWidthsToStorage(){
    try { localStorage.setItem(COLWIDTH_KEY, JSON.stringify(colWidths)); } catch(e){}
  }
  window.ptColResizeStart = function(e, table, col, dflt, min, max){
    e.preventDefault();
    e.stopPropagation();
    var handle = e.currentTarget || e.target;

  function extractBarcodes(raw){
    if(raw === null || raw === undefined || raw === '') return [];
    var s = String(raw).trim();
    if(/^\d+\.0+$/.test(s)) s = s.split('.')[0];
    var matches = s.match(/\d{8,14}/g);
    if(matches && matches.length){
      var seen = {};
      return matches.filter(function(m){ if(seen[m]) return false; seen[m] = true; return true; });
    }
    var cleaned = s.replace(/\s+/g,'');
    return cleaned ? [cleaned] : [];
  }

  var saveTimer = null;
  var lastKnownUpdatedAt = null;
  var staleWarningShown = false;
  var sizeWarningShown = false;
  function save(){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(doSaveNow, 200);
  }
  // Dacă pagina se închide/reîncarcă exact în fereastra de 200ms de debounce (ex: adaugi în coș
  // la mai mulți furnizori, apoi dai F5 imediat), timer-ul programat e anulat de navigare înainte
  // să apuce să se declanșeze — ultimele modificări se pierd fără nicio eroare vizibilă. Pornim
  // salvarea imediat, fără să mai așteptăm restul debounce-ului, cînd pagina chiar pleacă.
  function flushPendingSave(){
    if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; doSaveNow(true); }
  }
  window.addEventListener('beforeunload', flushPendingSave);
  window.addEventListener('pagehide', flushPendingSave);
  async function doSaveNow(skipStaleCheck, retriesLeft){
    if(retriesLeft === undefined) retriesLeft = 2;
    try {
      // Verificăm dacă altcineva (alt tab, alt calculator) a salvat între timp — cu o singură
      // versiune partajată, o salvare de-a noastră ar suprascrie orbește modificările lor.
      // Nu blocăm salvarea (ar risca să pierdem chiar modificarea curentă), dar avertizăm clar,
      // o singură dată, ca să știe să reîncarce pagina înainte să mai schimbe ceva. La flush de
      // urgență (pagina se închide chiar acum) sărim peste verificare — e o cerere de rețea în
      // plus, care ar putea consuma tot timpul pe care browserul ni-l mai dă înainte să plece.
      if(lastKnownUpdatedAt && !staleWarningShown && !skipStaleCheck){
        try {
          var check = await supabaseClient.from('app_state').select('updated_at').eq('id', STATE_ROW_ID).maybeSingle();
          if(check.data && check.data.updated_at && check.data.updated_at !== lastKnownUpdatedAt){
            staleWarningShown = true;
            ptToast('⚠ Cineva a salvat modificări din altă parte (alt tab sau alt calculator) de când ai deschis pagina asta. Ca să nu le suprascrii, reîncarcă pagina (F5) ACUM, apoi refă ultima modificare.', false);
          }
        } catch(e){ /* verificarea e doar o măsură de siguranță — dacă eșuează, continuăm cu salvarea */ }
      }
      var payload = JSON.stringify(state);
      // Pragul e generos — un rând JSONB în Postgres/Supabase duce fără probleme mult peste atît;
      // avertizăm doar ca semnal timpuriu, nu pentru că am fi aproape de o limită reală. Avertizăm
      // o singură dată per sesiune, nu la fiecare salvare, ca să nu enerveze degeaba.
      if(payload.length > 15000000 && !sizeWarningShown){
        sizeWarningShown = true;
        ptToast('Atenție: baza de date e mare (~' + Math.round(payload.length/1024) + ' KB). Ia în calcul să ștergi cataloage vechi nefolosite.', false);
      }
      var nowIso = new Date().toISOString();
      // Cerem rândul înapoi (select) după upsert, ca să reținem exact formatul de timestamp pe
      // care îl întoarce Supabase — dacă am reține în schimb string-ul nostru local (toISOString),
      // comparația de mai sus la salvarea următoare ar pica mereu fals-pozitiv, pentru că Postgres
      // serializează timestamp-urile puțin diferit (alt format de precizie/fus orar).
      var result = await supabaseClient.from('app_state').upsert({ id: STATE_ROW_ID, data: state, updated_at: nowIso }).select('updated_at').maybeSingle();
      if(result.error){
        // Erori de tip timeout/conexiune sînt adesea trecătoare (o interogare paralelă care ținea
        // rândul ocupat, o reconectare) — încercăm din nou de cîteva ori, tăcut, înainte să deranjăm
        // utilizatorul cu un mesaj; modificarea lui nu trebuie pierdută doar pentru un blip trecător.
        if(retriesLeft > 0){
          await new Promise(function(r){ setTimeout(r, 1500); });
          return doSaveNow(true, retriesLeft - 1);
        }
        ptToast('Salvarea nu a reușit: ' + result.error.message, false);
      }
      // NU resetăm staleWarningShown aici — dacă altcineva/altă filă tot salvează în paralel,
      // fiecare salvare a NOASTRĂ ar re-declanșa avertismentul, într-un potop de notificări
      // identice. O dată e suficient să anunțe problema; soluția cerută (F5) oricum repornește
      // sesiunea și flag-ul, ca să reapară dacă un conflict nou, real, apare mai târziu.
      else { lastKnownUpdatedAt = (result.data && result.data.updated_at) || nowIso; saveHistorySnapshotIfDue(); }
    } catch(e){
      if(retriesLeft > 0){
        await new Promise(function(r){ setTimeout(r, 1500); });
        return doSaveNow(true, retriesLeft - 1);
      }
      ptToast('Eroare la salvare: ' + (e && e.message ? e.message : 'necunoscută') + '. Modificarea ar putea să nu fi fost păstrată.', false);
    }
  }
  // ================= ISTORIC VERSIUNI (plasă de siguranță în caz de ștergere din greșeală) =================
  // Nu e un undo pas cu pas (ar însemna să rescriem fiecare acțiune din aplicație ca să fie
  // reversibilă) — e mai simplu și mai robust: la fiecare salvare (dar nu mai des decît o dată la
  // 15 minute, ca să nu umplem tabelul la fiecare click de coș) păstrăm o copie completă a datelor
  // într-un tabel separat. Din Setări, utilizatorul poate vedea lista de momente salvate și reveni
  // la oricare dintre ele — iar cum restaurarea salvează la rîndul ei starea curentă înainte să o
  // înlocuiască, poate la fel de ușor să "meargă înainte" din nou dacă se răzgîndește.
  var HISTORY_SNAPSHOT_MIN_GAP_MS = 15 * 60 * 1000;
  var HISTORY_KEEP_COUNT = 200;
  var lastHistorySnapshotAt = 0;
  async function saveHistorySnapshotNow(){
    try {
      lastHistorySnapshotAt = Date.now();
      await supabaseClient.from('app_state_history').insert({ data: state });
      var old = await supabaseClient.from('app_state_history').select('id').order('created_at', { ascending: false }).range(HISTORY_KEEP_COUNT, HISTORY_KEEP_COUNT + 50);
      if(old.data && old.data.length) await supabaseClient.from('app_state_history').delete().in('id', old.data.map(function(r){ return r.id; }));
    } catch(e){ /* instantaneele sînt doar o plasă de siguranță — dacă tabelul nu există încă sau eșuează, salvarea principală tot a reușit */ }
  }
  function saveHistorySnapshotIfDue(){
    if(Date.now() - lastHistorySnapshotAt < HISTORY_SNAPSHOT_MIN_GAP_MS) return;
    saveHistorySnapshotNow();
  }

  async function load(){

      if(result.error){ ptToast('Eroare la încărcare: ' + result.error.message, false); return; }

      var parsed = result.data && result.data.data;

        state.suppliers = parsed.suppliers || [];

        state.settings = Object.assign(state.settings, parsed.settings || {});
        if(!parsed.settings || parsed.settings.coef === undefined){
          if(parsed.settings && parsed.settings.seaCoef !== undefined) state.settings.coef = parsed.settings.seaCoef;
        }
        // Migrare unică: un bug marca greșit aproape toate produsele ca „NEW” la prima încărcare

        // greșite deja salvate — logica de mai jos (doExcelImport) e reparată, deci de acum înainte
        // se marchează corect doar produsele apărute la o actualizare reală.
        if(!state.settings.newBadgeMigrated){
          Object.keys(state.products).forEach(function(k){ state.products[k].isNew = false; });

  function normalizeCurrency(raw, def){
    var c = String(raw||'').toUpperCase().trim();
    if(c === 'USD' || c === '$') return 'USD';
    if(c === 'MDL' || c === 'LEI' || c === 'L') return 'MDL';
    if(c === 'KRW' || c === 'WON' || c === '₩') return 'KRW';
    if(c === 'EUR' || c === '€') return 'EUR';
    return def;
  }
  function toUSD(price, currency){
    if(currency === 'KRW') return price / (state.settings.krwPerUsd || 1375);
    if(currency === 'EUR') return price / (state.settings.eurPerUsd || 0.92);
    if(currency === 'MDL') return price / state.settings.exchangeRate;
    return price;
  }
  function landedCost(price, currency, freight, coefOverride){
    if(currency === 'MDL') return price;
    var usd = toUSD(price, currency);
    var coef = (coefOverride != null) ? coefOverride : state.settings.coef;
    return usd * state.settings.exchangeRate * coef;
  }
  function freightLabel(freight){
    if(freight === 'air') return '✈️ AVIA';
    if(freight === 'car') return '🚗 CAR';

  }
  function freightOptionsHtml(current){

      '<option value="air" ' + (current==='air'?'selected':'') + '>✈️ AVIA</option>' +
      '<option value="car" ' + (current==='car'?'selected':'') + '>🚗 CAR</option>';
  }
  async function fetchRates(){
    try {
      var res = await fetch('https://open.er-api.com/v6/latest/USD');
      var data = await res.json();
      if(data && data.result === 'success' && data.rates){
        if(data.rates.MDL) state.settings.exchangeRate = data.rates.MDL;
        if(data.rates.KRW) state.settings.krwPerUsd = data.rates.KRW;
        if(data.rates.EUR) state.settings.eurPerUsd = data.rates.EUR;
        state.settings.ratesUpdatedAt = new Date().toISOString().slice(0,16).replace('T',' ');
        recomputeAllLandedCosts();
        save();
        return true;
      }
    } catch(e){ /* rețea indisponibilă — se folosesc cursurile manuale/implicite */ }
    return false;
  }
  function unitCost(e){ return e.landedCost / (e.packQty && e.packQty > 0 ? e.packQty : 1); }
  function supplierDiscountPct(sid){
    var s = state.suppliers.find(function(x){ return x.id === sid; });
    return (s && s.discountPct) ? s.discountPct : 0;
  }
  function effectiveLandedCost(e, sid){
    var pct = supplierDiscountPct(sid);
    return pct ? e.landedCost * (1 - pct/100) : e.landedCost;
  }
  function effectiveUnitCost(e, sid){
    return effectiveLandedCost(e, sid) / (e.packQty && e.packQty > 0 ? e.packQty : 1);
  }
  function recomputeAllLandedCosts(){
    Object.keys(state.products).forEach(function(k){
      var p = state.products[k];
      Object.keys(p.bySupplier).forEach(function(sid){ var e = p.bySupplier[sid]; if(e.price != null) e.landedCost = landedCost(e.price, e.currency, e.freight); });
    });
  }
  function supplierName(id){
    var s = state.suppliers.find(function(x){ return x.id === id; });
    return s ? s.name : '(furnizor șters)';
  }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  // Eticheta „NEW” ține cont doar de ultima lună — altfel ar rămâne agățată de un produs la
  // nesfârșit, dacă price list-ul lui nu se mai actualizează niciodată.
  function isRecentlyNew(p){
    if(!p.isNew || !p.newAt) return false;
    var ageMs = Date.now() - new Date(p.newAt).getTime();
    return ageMs <= 30 * 24 * 60 * 60 * 1000;
  }
  var ORDER_STATUSES = ['trimisa','confirmata','in-transit','received'];
  var ORDER_STATUS_LABELS = { 'trimisa':'Trimisă', 'confirmata':'Confirmată', 'in-transit':'Pe drum', 'received':'Recepționată' };
  function getInTransitInfo(key){
    var qty = 0, eta = null, freight = null, sid = null;
    state.orders.forEach(function(o){
      if(o.status === 'received') return;
      o.lines.forEach(function(l){
        if(l.key === key){
          qty += l.qty;
          if(o.eta && (!eta || o.eta < eta)){ eta = o.eta; freight = o.freight; sid = o.supplierId; }
          else if(!eta && freight == null){ freight = o.freight; sid = o.supplierId; }
        }
      });
    });
    return { qty: qty, eta: eta, overdue: !!(eta && eta < todayStr()), freight: freight, sid: sid };
  }
  // Un produs poate fi „pe drum” prin mai multe comenzi active deodată — de la furnizori diferiți,
  // sau de la ACELAȘI furnizor dar cu tipuri de transport diferite (ex: una pe avion, una pe vapor).
  // Grupăm pe furnizor+transport, ca fiecare grup să-și arate propria cantitate/ETA, în loc să le
  // amestecăm într-un singur total care ar ascunde care parte vine cum și de unde.
  function getInTransitGroups(key){
    var groups = {};
    var today = todayStr();
    state.orders.forEach(function(o){
      if(o.status === 'received') return;
      o.lines.forEach(function(l){
        if(l.key !== key) return;
        var gk = o.supplierId + '|' + o.freight;
        if(!groups[gk]) groups[gk] = { qty: 0, eta: null, sid: o.supplierId, freight: o.freight, price: null, priceDate: null };
        groups[gk].qty += l.qty;
        if(o.eta && (!groups[gk].eta || o.eta < groups[gk].eta)) groups[gk].eta = o.eta;
        // Prețul din invoice-ul acestei comenzi, nu din price list-ul furnizorului — la produsele
        // deja pe drum, ăsta e prețul real plătit pentru acel lot, care poate diferi de prețul
        // curent din listă (singurul afișat altfel în coloanele de comparație).
        if(!groups[gk].priceDate || o.date > groups[gk].priceDate){ groups[gk].price = l.price; groups[gk].priceDate = o.date; }
      });
    });
    return Object.keys(groups).map(function(gk){
      var g = groups[gk];
      g.overdue = !!(g.eta && g.eta < today);
      return g;
    });
  }
  // Culoare stabilă per (furnizor + tip transport) — ca aceeași combinație să arate mereu la fel,
  // și combinații diferite (alt furnizor sau alt transport) să se deosebească dintr-o privire, fără
  // să mai citești textul. Roșu (bad) rămâne rezervat exclusiv pentru avertismentul de întârziere.
  // Cu doar 5-6 culori fixe, la 7 furnizori x 3 tipuri de transport (pînă la ~21 combinații
  // posibile), coliziunile erau garantate — combinații complet diferite ieșeau cu aceeași culoare.
  // Folosim în schimb o nuanță pe roata de culori (0-360°), care oferă mult mai multe valori
  // distincte posibile, deci coliziuni mult mai rare.
  function transitColorFor(g){
    if(g.overdue) return { fg: 'var(--bad)', bg: 'var(--bad-bg)' };
    var str = String(g.sid) + '|' + String(g.freight);
    var h = 0;
    for(var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
    var hue = Math.abs(h) % 360;
    return { fg: 'hsl(' + hue + ',60%,32%)', bg: 'hsl(' + hue + ',70%,93%)' };
  }

  // Verifică automat, în fundal, dacă o comandă adusă din MoySklad (status „Pe drum") a fost
  // între timp recepționată acolo (o Приемка creată pe baza ei) — dacă da, trece statusul pe
  // „Recepționată", ca produsele să nu mai apară „pe drum" în Comparație produse.
  var orderStatusQueue = [];
  var orderStatusActive = 0;
  var orderStatusChecking = {};
  var ORDER_STATUS_CONCURRENCY = 2;
  var ORDER_STATUS_RECHECK_MS = 5 * 60 * 1000;
  function ensureOrderStatusChecked(o){
    if(!o.moyskladOrderId || o.status !== 'in-transit') return;
    if(!state.settings.moyskladProxyUrl) return;
    if(o.moyskladCheckedAt && (Date.now() - o.moyskladCheckedAt) < ORDER_STATUS_RECHECK_MS) return;
    if(orderStatusChecking[o.id]) return;
    orderStatusChecking[o.id] = true;
    orderStatusQueue.push(o);
    pumpOrderStatusQueue();
  }
  function pumpOrderStatusQueue(){
    while(orderStatusActive < ORDER_STATUS_CONCURRENCY && orderStatusQueue.length){
      (function(o){
        orderStatusActive++;
        var base = state.settings.moyskladProxyUrl;
        var url = base + (base.indexOf('?')===-1?'?':'&') + 'orderstatus=' + encodeURIComponent(o.moyskladOrderId);
        fetch(url).then(function(res){ return res.json(); }).then(function(data){
          o.moyskladCheckedAt = Date.now();
          if(data && data.received && o.status === 'in-transit'){
            o.status = 'received';
            save();
            rerenderVisibleTabs();
          }
        }).catch(function(){}).then(function(){
          delete orderStatusChecking[o.id];
          orderStatusActive--;
          pumpOrderStatusQueue();
        });
      })(orderStatusQueue.shift());
    }
  }

  function convertToMDL(amount, currency){
    if(!currency || currency === 'MDL') return amount;
    if(currency === 'KRW') return (amount / state.settings.krwPerUsd) * state.settings.exchangeRate;
    return amount * state.settings.exchangeRate;
  }
  function rrpCellHtml(p, minLanded){
    if(!p.rrp) return '—';
    var rrpMdl = convertToMDL(p.rrp, p.rrpCurrency);
    var out = '<span style="font-size:14px;font-weight:700">' + Math.round(rrpMdl) + '</span>';
    if(minLanded){
      var markup = ((rrpMdl - minLanded) / minLanded) * 100;
      out += '<br><span style="font-size:11px;color:' + (markup >= 0 ? 'var(--rank1)' : 'var(--bad)') + '">' + (markup >= 0 ? '+' : '') + Math.round(markup) + '%</span>';
    }
    return out;
  }
  function upsertProduct(fields, sid, today, skipPriceUpdate){
    // fields: {name, brand, quantity, barcode, altBarcodes, price, currency, freight, rrp, moq, packQty}
    // skipPriceUpdate: folosit la importul de COMENZI (facturi) — prețul de acolo e prețul plătit
    // pe ACEA factură, nu prețul curent din price list-ul furnizorului; nu trebuie să-l suprascrie
    // niciodată (vezi doOrderImport și lastPurchase, care ține corect prețul de pe factură separat).
    // Dacă produsul există deja în MoySklad (potrivire pe barcode), denumirea de-acolo are prioritate — e deja curățată corect.
    if(fields.barcode && moyskladByBarcode[fields.barcode] && moyskladByBarcode[fields.barcode].name){
      fields.name = moyskladByBarcode[fields.barcode].name;
    }
    if(!fields.brand && fields.name){
      var bracketMatch = fields.name.match(/^\[([^\]]+)\]/);
      if(bracketMatch) fields.brand = bracketMatch[1].trim();
    }
    if(fields.brand && fields.name && normName(fields.name).indexOf(normName(fields.brand)) === -1){
      fields.name = fields.brand + ' ' + fields.name;
    }
    var key = makeKey(fields.barcode, fields.name, fields.quantity);
    if(!state.products[key]){
      state.products[key] = { displayName: fields.name, brand: fields.brand || '', quantity: fields.quantity || '', barcode: fields.barcode || '', altBarcodes: [], rrp: null, archived: false, bySupplier: {} };
    }
    var prod = state.products[key];
    if(fields.name) prod.displayName = fields.name;
    if(fields.brand) prod.brand = fields.brand;
    if(fields.quantity) prod.quantity = fields.quantity;
    if(fields.barcode) prod.barcode = fields.barcode;
    if(fields.altBarcodes && fields.altBarcodes.length){
      var existingAlt = prod.altBarcodes || [];
      fields.altBarcodes.forEach(function(b){ if(existingAlt.indexOf(b) === -1) existingAlt.push(b); });
      prod.altBarcodes = existingAlt;
    }
    if(fields.rrp !== null && fields.rrp !== undefined && !isNaN(fields.rrp) && fields.rrp !== ''){ prod.rrp = fields.rrp; prod.rrpCurrency = fields.currency; }

    var cost = landedCost(fields.price, fields.currency, fields.freight);
    var existing = prod.bySupplier[sid];
    var wasIncrease = false;
    var packQty = (fields.packQty !== null && fields.packQty !== undefined && !isNaN(fields.packQty) && fields.packQty > 0) ? fields.packQty : null;
    var weightGrams = (fields.weightGrams !== null && fields.weightGrams !== undefined && !isNaN(fields.weightGrams) && fields.weightGrams > 0) ? fields.weightGrams : null;
    if(existing){
      if(!skipPriceUpdate){
        wasIncrease = fields.price > existing.price;
        existing.history.push({ date: today, price: fields.price, currency: fields.currency });
        if(existing.history.length > 20) existing.history.splice(0, existing.history.length - 20);
        existing.price = fields.price; existing.currency = fields.currency; existing.freight = fields.freight;
        existing.landedCost = cost; existing.updatedAt = today;
      }
      if(fields.moq !== null && fields.moq !== undefined && !isNaN(fields.moq)) existing.moq = fields.moq;
      if(packQty !== null) existing.packQty = packQty;
      if(weightGrams !== null) existing.weightGrams = weightGrams;
      if(fields.barcode) existing.barcode = fields.barcode;
    } else if(skipPriceUpdate){
      // Furnizor asociat doar printr-o comandă/factură — fără preț de listă real încă (rămâne
      // null pînă cineva completează unul manual, sau apare un price list real de la furnizor).
      prod.bySupplier[sid] = { price: null, currency: null, freight: fields.freight, landedCost: null, updatedAt: null, history: [], moq: (fields.moq !== null && fields.moq !== undefined && !isNaN(fields.moq)) ? fields.moq : null, packQty: packQty, weightGrams: weightGrams, barcode: fields.barcode || '' };
    } else {
      prod.bySupplier[sid] = { price: fields.price, currency: fields.currency, freight: fields.freight, landedCost: cost, updatedAt: today, history: [{ date: today, price: fields.price, currency: fields.currency }], moq: (fields.moq !== null && fields.moq !== undefined && !isNaN(fields.moq)) ? fields.moq : null, packQty: packQty, weightGrams: weightGrams, barcode: fields.barcode || '' };
    }
    return wasIncrease;
  }
  // ================= REPARARE: PREȚURI CONTAMINATE DE FACTURI, ÎNAINTE DE FIX =================
  // Înainte de fix, doOrderImport scria prețul facturii direct în bySupplier[sid].price — la fel
  // ca un price list real — chiar și peste un preț de listă deja existent, corect. Simpla verificare
  // "a fost atins vreodată de un price list real" (prin priceLists[].productKeys) nu ajunge: un
  // produs poate fi acoperit de un price list real ȘI, mai târziu, să-i fi fost suprascris prețul
  // de o comandă — coverage-ul rămâne adevărat, dar valoarea curentă tot e cea din factură.
  // Soluția corectă: REJUCĂM efectiv toate price list-urile reale deja aplicate, în ordine
  // cronologică (folosind rândurile brute + maparea salvate pe fiecare), ca să restabilim prețul
  // AUTENTIC al fiecărui produs acoperit — nu doar să bănuim că era corect. Ce rămâne neacoperit de
  // niciun price list real, la final, chiar n-are preț de listă și se resetează la "fără preț".
  window.ptRepairSupplierPrices = function(){
    if(!confirm('Reconstruiești toate prețurile de furnizor din price list-urile reale deja aplicate (rejoacă fiecare listă, în ordine cronologică, peste orice preț ar fi fost suprascris greșit de o comandă)? Ce nu are niciun price list real rămâne "fără preț". Poate dura câteva secunde. Continui?')) return;
    var realLists = state.priceLists.filter(function(pl){ return !pl.pending && pl.rows && pl.rows.length && pl.mapping; })
      .slice().sort(function(a,b){ return String(a.importedAt||'').localeCompare(String(b.importedAt||'')); });
    var touched = {}; // supplierId -> { productKey: true } — ce a fost efectiv reconstruit dintr-un price list real
    realLists.forEach(function(pl){
      var m = pl.mapping, sid = pl.supplierId;
      var defCurrency = (state.importMappings[sid] && state.importMappings[sid].defCurrency) || 'USD';
      if(!touched[sid]) touched[sid] = {};
      pl.rows.forEach(function(r){
        var name = m.name>=0 ? String(r[m.name]||'').trim() : '';
        var price = parseFloat(String(m.price>=0 ? r[m.price] : '').replace(',','.'));
        if(!name || isNaN(price)) return;
        var barcodeList = m.barcode>=0 ? extractBarcodes(r[m.barcode]) : [];
        var barcode = barcodeList.length ? barcodeList[0] : '';
        var altBarcodes = barcodeList.slice(1);
        var quantity = m.quantity>=0 ? String(r[m.quantity]||'').trim() : '';
        var moqVal = m.moq>=0 ? parseInt(String(r[m.moq]).replace(/[^0-9]/g,''), 10) : NaN;
        var packQtyVal = m.packQty>=0 ? parseInt(String(r[m.packQty]).replace(/[^0-9]/g,''), 10) : NaN;
        var weightVal = m.weight>=0 ? parseFloat(String(r[m.weight]).replace(',','.')) : NaN;
        var key = makeKey(barcode, name, quantity);
        if(!state.products[key]) return; // produsul nu mai există (șters/unit între timp)
        if(!touched[sid][key] && state.products[key].bySupplier[sid]) state.products[key].bySupplier[sid].history = [];
        upsertProduct({ name: name, brand: pl.brand || '', quantity: quantity, barcode: barcode, altBarcodes: altBarcodes, price: price, currency: defCurrency, freight: 'sea', rrp: null, moq: isNaN(moqVal) ? null : moqVal, packQty: isNaN(packQtyVal) ? null : packQtyVal, weightGrams: isNaN(weightVal) ? null : weightVal }, sid, pl.importedAt || todayStr());
        touched[sid][key] = true;
      });
    });
    var restored = 0, cleared = 0;
    Object.keys(state.products).forEach(function(k){
      var p = state.products[k];
      Object.keys(p.bySupplier).forEach(function(sid){
        var e = p.bySupplier[sid];
        if(touched[sid] && touched[sid][k]){ restored++; return; }
        if(e.price == null) return;
        e.price = null; e.currency = null; e.landedCost = null; e.history = [];
        cleared++;
      });
    });
    save(); renderCompare();
    var fb = document.getElementById('pt-cleanup-feedback');
    var msg = 'Reparare finalizată: ' + restored + ' preț(uri) reconstruite din price list-uri reale, ' + cleared + ' resetate la "fără preț" (nu au niciun price list).';
    if(fb){ fb.className = 'feedback ok'; fb.textContent = msg; }
    ptToast(msg, true);
  };

  window.ptMergeSearch = function(key, query, boxPrefix){
    var idSafe = key.replace(/[^a-zA-Z0-9]/g,'_');
    var box = document.getElementById((boxPrefix||'') + 'merge-results-' + idSafe);
    if(!box) return;
    var q = normName(query);
    if(q.length < 2){ box.innerHTML = ''; return; }
    var matches = Object.keys(state.products).filter(function(k2){

    }).slice(0, 6);
    // Cauta si direct in catalogul MoySklad sincronizat — de multe ori produsul corect exista deja
    // acolo cu barcode-ul corect, dar n-a fost niciodata importat ca produs urmarit in aplicatie,
    // deci nu apare printre rezultatele de mai sus. Aici doar preluam barcode-ul, nu unim doua
    // produse (nu exista un al doilea produs urmarit cu care sa unim).
    var msMatches = catalogProducts.filter(function(mp){

    }).slice(0, 6);

    }).join('');
    html += msMatches.map(function(mp){
      var bc = mp.barcodes[0];

      return '<button class="icon-link" style="display:block;width:100%;text-align:left;border:1px solid var(--accent);border-radius:6px;padding:6px 10px;margin-top:4px" onclick="ptSetProductBarcode(\'' + key.replace(/'/g,"\\'") + '\', \'' + bc.replace(/'/g,"\\'") + '\')" title="Preia acest barcode din MoySklad pentru produsul curent">' + label + '</button>';
    }).join('');
    box.innerHTML = html;
  };
  window.ptMergeProducts = function(sourceKey, targetKey){
    if(!targetKey || sourceKey === targetKey) return;
    var src = state.products[sourceKey], tgt = state.products[targetKey];
    if(!src || !tgt) return;
    var srcBarcode = src.barcode || '';
    var tgtBarcode = tgt.barcode || '';
    Object.keys(tgt.bySupplier).forEach(function(sid){
      if(!tgt.bySupplier[sid].barcode) tgt.bySupplier[sid].barcode = tgtBarcode;
    });
    Object.keys(src.bySupplier).forEach(function(sid){
      if(tgt.bySupplier[sid]){
        var merged = tgt.bySupplier[sid].history.concat(src.bySupplier[sid].history).sort(function(a,b){ return a.date.localeCompare(b.date); });
        tgt.bySupplier[sid].history = merged;
        if(src.bySupplier[sid].updatedAt >= tgt.bySupplier[sid].updatedAt){
          tgt.bySupplier[sid].price = src.bySupplier[sid].price;
          tgt.bySupplier[sid].currency = src.bySupplier[sid].currency;
          tgt.bySupplier[sid].freight = src.bySupplier[sid].freight;
          tgt.bySupplier[sid].landedCost = src.bySupplier[sid].landedCost;
          tgt.bySupplier[sid].updatedAt = src.bySupplier[sid].updatedAt;
          tgt.bySupplier[sid].barcode = src.bySupplier[sid].barcode || srcBarcode || tgt.bySupplier[sid].barcode;
        }
      } else {
        var incoming = src.bySupplier[sid];
        if(!incoming.barcode) incoming.barcode = srcBarcode;
        tgt.bySupplier[sid] = incoming;
      }
    });
    if(!tgt.barcode && src.barcode) tgt.barcode = src.barcode;
    if(!tgt.rrp && src.rrp){ tgt.rrp = src.rrp; tgt.rrpCurrency = src.rrpCurrency; }
    delete state.products[sourceKey];
    // Cheia veche dispare — actualizăm orice ar mai fi referit-o, altfel liniile din comenzi deja
    // înregistrate ar "dispărea" pur și simplu (produsul nu mai există sub acea cheie).
    state.orders.forEach(function(o){
      o.lines.forEach(function(l){ if(l.key === sourceKey) l.key = targetKey; });
    });
    Object.keys(state.carts).forEach(function(email){
      Object.keys(state.carts[email]).forEach(function(sid){
        var cart = state.carts[email][sid];
        if(cart[sourceKey] != null){
          cart[targetKey] = (cart[targetKey] || 0) + cart[sourceKey];
          delete cart[sourceKey];
        }
      });
    });
    state.priceLists.forEach(function(pl){
      var idx = pl.productKeys.indexOf(sourceKey);
      if(idx === -1) return;
      if(pl.productKeys.indexOf(targetKey) === -1) pl.productKeys[idx] = targetKey;
      else pl.productKeys.splice(idx, 1);
    });
    save(); renderCompare(); renderOrderDetailTable();
  };

  // ================= MOYSKLAD PARTAJAT (folosit de Comparație produse și Produse MoySklad) =================
  var moyskladByBarcode = {};
  var expandedHistoryFull = {};
  function rebuildMoyskladIndex(){

  function moyskladLookup(p){

  function fmtDateDMY(iso){

  window.ptToggleHistoryFull = function(id){

  function rerenderVisibleTabs(){

  // La o comandă mare (zeci-sute de produse), fiecare poză/istoric/atribut MoySklad care sosește
  // din fundal (sau eșuează — un eșec cheamă rerenderVisibleTabs() la fel ca un succes) cheamă
  // rerenderVisibleTabs(). Cu zeci de cereri concurente, asta însemna zeci de randări complete ale
  // tabelului ÎN CÎTEVA MILISECUNDE — vizibil ca o pagină care "aiurește" cît timp se încarcă, și
  // teren propice pentru o editare a utilizatorului să nimerească exact în mijlocul rafalei. Mai
  // rău, fiecare din acele randări re-declanșează ensureMsAttrsLoaded/ensureImageUrl/
  // ensureHistoryLoaded pentru tot ce nu e încă în cache — inclusiv produsele eșuate, eligibile
  // pentru reîncercare — ceea ce bombardează din nou proxy-ul/MoySklad și alimentează rafala. Aici
  // adunăm mai multe cereri terminate în aceeași fereastră scurtă de timp într-o singură randare.
  var rerenderVisibleTabsTimer = null;
  function rerenderVisibleTabsDebounced(){
    if(rerenderVisibleTabsTimer) return;
    rerenderVisibleTabsTimer = setTimeout(function(){
      rerenderVisibleTabsTimer = null;
      // Dacă utilizatorul tastează chiar acum într-un cîmp din tabelul comenzii, nu rescriem
      // tabelul de sub el — o randare de fundal chiar în acel moment e exact coliziunea vizuală
      // reclamată ("sare sus" la editare). Amânăm din nou; se reia singură imediat ce dă click
      // alături (editarea lui declanșează oricum propria randare, imediată, separat de asta).
      var active = document.activeElement;
      if(active && active.tagName === 'INPUT' && active.closest && active.closest('#pt-order-detail-table')){
        rerenderVisibleTabsDebounced();
        return;
      }
      rerenderVisibleTabs();
    }, 250);
  }
  function setInnerHtmlKeepingFocus(el, html){
    var active = document.activeElement;
    var focusInfo = null;
    if(active && active.id && el.contains(active)){
      focusInfo = { id: active.id, start: active.selectionStart, end: active.selectionEnd };
    }
    el.innerHTML = html;
    if(focusInfo){
      var restored = document.getElementById(focusInfo.id);
      if(restored){
        restored.focus();
        if(typeof restored.setSelectionRange === 'function' && focusInfo.start !== null && focusInfo.start !== undefined){
          try { restored.setSelectionRange(focusInfo.start, focusInfo.end); } catch(e){}
        }
      }
    }
    Array.prototype.forEach.call(el.querySelectorAll('.table-wrap'), function(w){ mountStickyHeader(w); fitTableWrapHeight(w); });
    ensureTableWrapResizeListener();
  }
  // Tabelele foloseau o înălțime fixă (70vh) indiferent de cît spațiu era liber sub ele pe ecran —
  // dacă fereastra e mare sau bara de sus e scurtă, rămînea o zonă goală degeaba. În loc de asta,
  // calculăm exact cît spațiu mai e disponibil pînă la baza ferestrei și întindem tabelul pînă acolo.
  var tableWrapResizeBound = false;
  function fitTableWrapHeight(wrapEl){
    var rect = wrapEl.getBoundingClientRect();
    var available = window.innerHeight - rect.top - 8;
    wrapEl.style.maxHeight = Math.max(240, available) + 'px';

  function ensureTableWrapResizeListener(){
    if(tableWrapResizeBound) return;

  // position:sticky pe <th> are un bug de randare cunoscut in Chrome: textul antetului dispare
  // intermitent la scroll. Il evitam complet: antetul real ramine neschimbat (nesticky, dar tot
  // functional pentru resize/ascundere coloane), iar aici construim un antet "fantoma" — un <div>
  // normal, in afara tabelului, care copiaza etichetele si latimile coloanelor. E afisat permanent
  // (nu doar dupa ce incepe scroll-ul, ca sa nu apara un "flash" la trecerea intre ele) si suprapus
  // exact peste antetul real; are pointer-events:none ca butoanele de resize/ascundere din antetul
  // real sa ramina clickabile prin el.
  function mountStickyHeader(wrapEl){
    var table = wrapEl.querySelector('table.cmp-table');
    var headRow = table && table.querySelector('thead tr');
    if(!headRow) return;
    var overlay = document.createElement('div');
    overlay.className = 'cmp-sticky-header';
    Array.prototype.forEach.call(headRow.children, function(th){
      var cell = document.createElement('div');
      cell.className = 'cmp-sticky-header-cell';
      cell.innerHTML = th.innerHTML;
      if(th.getAttribute('title')) cell.title = th.getAttribute('title');
      overlay.appendChild(cell);
    });
    wrapEl.insertBefore(overlay, wrapEl.firstChild);
    function syncWidths(){
      Array.prototype.forEach.call(headRow.children, function(th, i){
        if(overlay.children[i]) overlay.children[i].style.width = th.offsetWidth + 'px';
      });
    }
    function syncPosition(){
      overlay.style.transform = 'translateY(' + wrapEl.scrollTop + 'px)';
    }
    syncWidths();
    syncPosition();
    wrapEl.addEventListener('scroll', syncPosition);

  var historyQueue = [];
  var historyActive = 0;
  var HISTORY_CONCURRENCY = 6;
  var HISTORY_CACHE_KEY = 'pt_history_cache_v1';
  var historyCacheSaveTimer = null;
  function saveHistoryCacheDebounced(){
    if(historyCacheSaveTimer) clearTimeout(historyCacheSaveTimer);
    historyCacheSaveTimer = setTimeout(function(){
      try {
        var toSave = {};
        Object.keys(catalogHistoryCache).forEach(function(id){
          var v = catalogHistoryCache[id];
          if(v && typeof v === 'object' && v.rows) toSave[id] = v;
        });
        localStorage.setItem(HISTORY_CACHE_KEY, JSON.stringify(toSave));

  function ensureHistoryLoaded(msId){

  function pumpHistoryQueue(){
    while(historyActive < HISTORY_CONCURRENCY && historyQueue.length){
      (function(msId){
        historyActive++;
        fetch(catalogProxyUrl('history=' + encodeURIComponent(msId))).then(function(r){ return r.json(); }).then(function(data){
          catalogHistoryCache[msId] = (data && data.error) ? { error: data.detail || data.error } : { rows: (data && data.history) || [] };
          saveHistoryCacheDebounced();
        }).catch(function(err){
          catalogHistoryCache[msId] = { error: err && err.message ? err.message : String(err) };

  // ================= CÎMPURILE DE PREȚ DIN MOYSKLAD, PENTRU SINECOSTUL DIN COMENZI =================
  // La fel ca poza/istoricul de mai sus: "Pret furnizor in $" e citit live din MoySklad, în fundal,
  // fără să blocheze randarea tabelului de comandă — nu ținut doar în memorie locală, ca prețurile
  // să reflecte mereu ce e ACUM în MoySklad, nu o valoare veche cache-uită pe disc.
  // BUG GRAV, găsit după ședințe întregi de căutat "de ce unele produse nu se sincronizează
  // NICIODATĂ": odată ce un fetch eșua (ex: o comandă cu 76 de produse trimite pînă la 6 cereri
  // simultane către MoySklad — suficient să lovească o limită de rată trecătoare la unele), acel
  // produs rămînea marcat "eșuat" PERMANENT — {error:...} e truthy, deci ensureMsAttrsLoaded nu mai
  // reîncerca NICIODATĂ, indiferent cîte comenzi reimportai sau cataloage resincronizai. Asta
  // explica exact tiparul "unele merg, altele nu, la infinit" — nu erau datele, era cache-ul.
  var msAttrsCache = {};
  var msAttrsRetries = {};
  var attrsQueue = [];
  var attrsActive = 0;
  var ATTRS_CONCURRENCY = 4; // redus de la 6, ca să scadă șansa de-a lovi o limită de rată la comenzi mari
  var ATTRS_MAX_RETRIES = 5;
  function ensureMsAttrsLoaded(msId){
    var cached = msAttrsCache[msId];
    if(cached === 'loading') return;
    if(cached && cached.attrs) return; // succes deja obținut — nu mai reîncercăm
    if(cached && cached.error && (msAttrsRetries[msId]||0) >= ATTRS_MAX_RETRIES) return; // renunțăm doar după eșecuri repetate
    msAttrsCache[msId] = 'loading';
    attrsQueue.push(msId);
    pumpAttrsQueue();
  }
  function pumpAttrsQueue(){
    while(attrsActive < ATTRS_CONCURRENCY && attrsQueue.length){
      (function(msId){
        attrsActive++;
        fetch(catalogProxyUrl('attrs=' + encodeURIComponent(msId))).then(function(r){ return r.json(); }).then(function(data){
          if(data && data.error){
            msAttrsRetries[msId] = (msAttrsRetries[msId]||0) + 1;
            msAttrsCache[msId] = { error: data.detail || data.error };
          } else {
            msAttrsCache[msId] = { attrs: (data && data.attributes) || {} };
            delete msAttrsRetries[msId];
          }
        }).catch(function(err){
          msAttrsRetries[msId] = (msAttrsRetries[msId]||0) + 1;
          msAttrsCache[msId] = { error: err && err.message ? err.message : String(err) };
        }).then(function(){
          attrsActive--;
          pumpAttrsQueue();
          rerenderVisibleTabsDebounced();
        });
      })(attrsQueue.shift());
    }
  }

  var HEADER_KEYWORDS = ['name','product','price','cost','barcode','ean','upc','moq','qty','rrp','recommended','brand','box','wholesale','cantitate','pret','produs','denumire','nume','marca','cutie','monedă','currency'];
  function hasHangul(s){ return /[\uAC00-\uD7A3]/.test(String(s||'')); }
  // Comparam cuvinte intregi, nu simpla potrivire de subsir \u2014 altfel cuvinte scurte din lista de mai
  // sus (ex: "ean") se potrivesc din intamplare in interiorul altor cuvinte obisnuite din denumiri
  // de produs (ex: "cleansing" contine "ean"), ceea ce facea ca un rand oarecare de produs sa fie
  // confundat cu antetul de coloane, iar toate randurile de dinaintea lui erau aruncate ca "antet".
  function tokenizeForHeader(s){ return String(s||'').toLowerCase().split(/[^a-z0-9\u00C0-\u024F]+/i).filter(Boolean); }
  function detectHeaderRowIndex(allRows){
    var maxScan = Math.min(allRows.length, 20);
    var bestIdx = 0, bestScore = -1;
    for(var i=0;i<maxScan;i++){
      var row = allRows[i];
      var nonEmpty = row.filter(function(c){ return String(c).trim() !== ''; }).length;
      if(nonEmpty < 2) continue;
      var score = 0;
      row.forEach(function(cell){
        var tokens = tokenizeForHeader(cell);
        if(!tokens.length) return;
        HEADER_KEYWORDS.forEach(function(k){ if(tokens.indexOf(k) !== -1) score++; });
      });
      if(score > bestScore){ bestScore = score; bestIdx = i; }
    }
    // -1 = niciun rand nu pare cu adevarat un antet (niciun cuvant-cheie gasit nicaieri) — in acest
    // caz nu se sare NICIUN rand, ca sa nu pierdem un rand real de produs doar pentru ca semana cu
    // un "cel mai bun" candidat de antet care de fapt nu era deloc un antet.
    return bestScore > 0 ? bestIdx : -1;
  }

      var file = ev.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(e){
        try {
          var data = new Uint8Array(e.target.result);
          var wb = XLSX.read(data, { type: 'array' });
          // Facturile vin uneori cu mai multe foi (ex: cîte una per brand/secțiune) — citirea doar
          // a primei foi lăsa produsele de pe celelalte foi complet neimportate, fără niciun
          // avertisment. Citim toate foile și le combinăm într-un singur tabel de rînduri.
          // Foile de tip "packing list" (listă de colete/ambalare) nu sînt un tabel de produse —
          // au alt format complet (expeditor, destinatar, cutii) și le-am strica dacă le-am citi
          // ca și cum ar avea aceleași coloane ca foaia cu produse.
          var combinedRows = [], headers = null, skippedTotal = 0, sheetsUsed = 0;
          wb.SheetNames.forEach(function(sheetName){
            if(/packing/i.test(sheetName)) return;
            var sheetRows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
            sheetRows = sheetRows.filter(function(r){ return r.some(function(c){ return String(c).trim() !== ''; }); });
            if(!sheetRows.length) return;
            sheetsUsed++;
            var hIdx = detectHeaderRowIndex(sheetRows);
            if(headers === null) headers = sheetRows[hIdx >= 0 ? hIdx : 0];
            combinedRows = combinedRows.concat(hIdx >= 0 ? sheetRows.slice(hIdx+1) : sheetRows);
            if(hIdx >= 0) skippedTotal += hIdx;
          });
          if(combinedRows.length < 1){ ptToast('Fișierul pare gol.', false); return; }
          importOrderFile = { fileName: file.name, headers: headers, rows: combinedRows, skippedRows: skippedTotal };
          if(sheetsUsed > 1) ptToast('Fișierul are mai multe foi — au fost combinate ' + sheetsUsed + ' (' + combinedRows.length + ' rânduri în total).', true);
          renderOrderMapping();
        } catch(err){ ptToast('Nu am putut citi fișierul: ' + err.message, false); }
      };
      reader.readAsArrayBuffer(file);
    });

    var msFetchBtn = document.getElementById('pt-ord-ms-fetch');

        fb.className='feedback'; fb.textContent='Se caută în MoySklad…';
        try {
          var url = base + (base.indexOf('?')===-1?'?':'&') + 'ordernum=' + encodeURIComponent(num);
          var res = await fetch(url);
          var data = await res.json();
          if(!res.ok || data.error){ fb.className='feedback err'; fb.textContent = data.error || 'Eroare la citirea comenzii.'; return; }
          if(!data.lines || !data.lines.length){ fb.className='feedback err'; fb.textContent='Comanda nu are niciun produs.'; return; }
          importOrderFile = {
            fileName: 'MoySklad #' + data.orderNumber,
            headers: ['Barcode','Nume','Preț','Cantitate comandată'],
            rows: data.lines.map(function(l){ return [l.barcode||'', l.name || l.code || '(produs necunoscut)', l.price, l.quantity]; }),
            skippedRows: 0,
            moyskladOrderId: data.moyskladOrderId || null,
            moyskladSum: data.sum || 0,

          };
          renderOrderMapping();
          ['barcode','name','price','orderQty'].forEach(function(key, idx){
            var sel = document.getElementById('pt-ord-map-' + key);
            if(sel) sel.value = String(idx);
          });
          // „Cantitate comandată" conține cuvântul „cantitate", care se potrivește din greșeală
          // cu ghicitorul automat pentru mărimea produsului (quantity) — dezactivăm explicit
          // acea mapare, comanda adusă din MoySklad n-are o coloană reală de mărime.
          var qtySel = document.getElementById('pt-ord-map-quantity');
          if(qtySel) qtySel.value = '-1';
          var curEl = document.getElementById('pt-ord-def-currency');
          if(curEl) curEl.value = 'MDL';
          window.ptRenderOrderPreview();
          fb.className='feedback ok'; fb.textContent = '✓ Adus: ' + data.lines.length + ' produse din comanda ' + data.orderNumber + (data.supplier ? ' (' + data.supplier + ')' : '') + '. Verifică maparea și moneda mai jos, apoi înregistrează.';
        } catch(err){
          fb.className='feedback err'; fb.textContent = 'Eroare la conectare: ' + (err && err.message ? err.message : err);
        }
      });

      var prices = sample.map(function(r){ return parseFloat(String(r[m.price]).replace(',','.')); }).filter(function(n){ return !isNaN(n); });
      if(prices.length){
        var avg = prices.reduce(function(a,b){ return a+b; }, 0) / prices.length;
        var allSmallInts = prices.every(function(n){ return n < 200 && Math.round(n) === n; });
        if(allSmallInts) msgs.push('Valorile din coloana de Preț arată ca niște cantități (numere mici, întregi) — verifică dacă nu ai mapat greșit coloana de Cantitate.');
        else if((defCur === 'USD' || defCur === 'MDL') && avg > 300) msgs.push('Prețurile din previzualizare par mari pentru ' + defCur + ' (medie ~' + Math.round(avg) + '). Verifică — nu cumva sunt de fapt woni (KRW)?');
        else if(defCur === 'KRW' && avg < 50) msgs.push('Prețurile din previzualizare par mici pentru woni (medie ~' + Math.round(avg) + '). Verifică — nu cumva sunt de fapt USD?');

      w.innerHTML = msgs.map(function(m2){ return '⚠ ' + m2; }).join('<br>');
      preview.parentNode.parentNode.insertBefore(w, preview.parentNode.nextSibling);
    }
