        '<div id="pt-order-detail-table">' + buildOrderPricingTableHtml(keys, orderLineQtyMap(o)) + '</div></div>';
      return row + detail;
    }).join('');
    if(openOrderId){
      var applyBtn = document.getElementById('pt-apply-markup');
      var markupInput = document.getElementById('pt-def-markup');
      if(applyBtn) applyBtn.addEventListener('click', function(){
        var o = state.orders.find(function(x){ return x.id === openOrderId; });
        if(!o) return;
        orderProductKeys(o).forEach(function(k){
          var p = state.products[k];
          if(p.sellPrice == null){
            var sc = getSinecost(k);
            if(sc.cost != null) p.sellPrice = suggestedPrice(sc.cost, state.settings.defaultMarkup);
          }
        });
        save(); renderOrderDetailTable();
      });
      if(markupInput) markupInput.addEventListener('change', function(ev){
        state.settings.defaultMarkup = parseFloat(ev.target.value) || state.settings.defaultMarkup;
        save(); renderOrderDetailTable();
      });
      var rfApply = document.getElementById('pt-rf-apply');
      if(rfApply) rfApply.addEventListener('click', function(){ ptApplyRealFreight(openOrderId); });
      var rfRate = document.getElementById('pt-rf-rate');
      if(rfRate) rfRate.addEventListener('change', function(){
        var n = parseFloat(rfRate.value);
        if(isNaN(n) || n <= 0) return;
        var cur = document.getElementById('pt-rf-currency').value;
        if(cur === 'MDL') state.settings.exchangeRate = n;
        else if(cur === 'EUR') state.settings.eurPerUsd = n;
        recomputeAllLandedCosts(); save(); renderOrderHistory(); renderCompare();
      });
      ['pt-rf-cost','pt-rf-currency','pt-rf-customs'].forEach(function(id){
        var el = document.getElementById(id);
        if(el) el.addEventListener('change', function(){
          var o = state.orders.find(function(x){ return x.id === openOrderId; });
          if(!o) return;
          o.actualFreight = {
            cost: parseFloat(document.getElementById('pt-rf-cost').value),
            currency: document.getElementById('pt-rf-currency').value,
            customsPct: parseFloat(document.getElementById('pt-rf-customs').value)
          };
          renderOrderHistory();
        });
      });
    }
  }

  // ================= PRICING TAB =================
  function getSinecost(key){
    var p = state.products[key];
    var best = null, bestDate = null, bestSid = null, bestUsd = null;
    Object.keys(p.bySupplier).forEach(function(sid){
      var e = p.bySupplier[sid];
      if(e.lastPurchase && e.lastPurchase.landedCost != null){
        if(!bestDate || e.lastPurchase.date > bestDate){ bestDate = e.lastPurchase.date; best = e.lastPurchase.landedCost; bestSid = sid; bestUsd = toUSD(e.lastPurchase.price, e.lastPurchase.currency); }
      }
    });
    if(best != null){
      return { cost: best, usdPrice: bestUsd, source: 'ultima achiziție (' + bestDate + ')' };
    }
    var min = null, minSid = null, minUsd = null;
    Object.keys(p.bySupplier).forEach(function(sid){
      var e = p.bySupplier[sid];
      var uc = effectiveLandedCost(e, sid);
      if(min === null || uc < min){ min = uc; minSid = sid; minUsd = toUSD(e.price, e.currency); var d = supplierDiscountPct(sid); if(d) minUsd = minUsd * (1 - d/100); }
    });
    var discPct2 = minSid ? supplierDiscountPct(minSid) : 0;
    return { cost: min, usdPrice: minUsd, source: min !== null ? ('cel mai bun preț din listă curentă' + (discPct2 ? ' cu reducere ' + discPct2 + '%' : '')) : null };
  }
  function suggestedPrice(cost, markupPct){ return cost * (1 + (markupPct||0)/100); }
  function pachet2Discount(markupPct){
    if(markupPct > 45) return 40;
    if(markupPct >= 30) return 35;
    return 30;
  }
  function pachet3Discount(markupPct){
    if(markupPct < 20) return 30;
    if(markupPct < 30) return 35;
    return 40;
  }
  function isNearOrBelowCost(price, cost){ return cost != null && price != null && price <= cost * 1.05; }

  // ================= PREȚURI PE PRODUSELE UNEI COMENZI (în Istoric comenzi) =================
  function pkgCellHtml(key, idx, tierVal, manualVal, tierDiscPct, cost, sellPrice, manualPct, editablePct){
    var effPct = (manualPct != null) ? manualPct : tierDiscPct;
    var pctComputedVal = (sellPrice != null && effPct != null) ? sellPrice * (1 - effPct/100) : tierVal;
    var effVal = (manualVal != null) ? manualVal : pctComputedVal;
    var isAlert = isNearOrBelowCost(effVal, cost);
    var marginPct = (effVal != null && cost) ? Math.round(((effVal - cost)/cost)*100) : null;
    var displayDiscPct = (effVal != null && sellPrice) ? Math.round((1 - effVal/sellPrice)*100) : effPct;
    var pctControl = editablePct
      ? ' <input class="qty-input pt-pct-input" style="width:40px;padding:9px 4px;text-align:center" type="number" step="1" title="Procent reducere" value="' + (effPct!=null?Math.round(effPct):'') + '" onchange="ptSetPachetPct(\'' + key + '\',' + idx + ',this.value)">%'
      : (displayDiscPct != null ? ' <span style="font-size:11px;color:var(--text-soft)">-' + displayDiscPct + '%</span>' : '');
    return '<td' + (isAlert ? ' style="background:var(--bad-bg);color:var(--bad);font-weight:700"' : '') + '>' +
      '<div style="display:flex;align-items:center;gap:4px;white-space:nowrap"><input class="qty-input" style="width:calc(6ch + 16px)" type="number" step="0.01" value="' + (manualVal != null ? manualVal : '') + '" placeholder="' + (pctComputedVal != null ? fmt(pctComputedVal) : '') + '" onchange="ptSetPachetPrice(\'' + key + '\',' + idx + ',this.value)">' + pctControl + '</div>' +
      (editablePct && displayDiscPct != null ? '<div style="font-size:11px;color:var(--text-soft);margin-top:2px">-' + displayDiscPct + '%' + (marginPct != null ? ' · ad ' + (marginPct>=0?'+':'') + marginPct + '%' : '') + '</div>' : (marginPct != null ? '<div style="font-size:11px;color:var(--text-soft);margin-top:2px">ad ' + (marginPct>=0?'+':'') + marginPct + '%</div>' : '')) +
      (isAlert ? '<div style="font-size:10.5px">⚠ aproape/sub sinecost</div>' : '') + '</td>';
  }
  function orderProductKeys(o){
    // Păstrăm ordinea din comandă/factură (nu alfabetică) — e mai ușor de verificat linie cu
    // linie față de documentul original, fie el din MoySklad sau Excel-ul furnizorului.
    var seen = {}, keys = [];
    o.lines.forEach(function(l){
      if(state.products[l.key] && !seen[l.key]){ seen[l.key] = true; keys.push(l.key); }
    });
    return keys;
  }

      '<div class="hint">Poți actualiza automat cursurile (USD → MDL și USD → KRW) de la o sursă publică, sau le poți edita manual mai jos.' + (state.settings.ratesUpdatedAt ? (' Ultima actualizare automată: ' + state.settings.ratesUpdatedAt + '.') : (autoFetchFailed ? ' Actualizarea automată nu a reușit (posibil conexiune blocată) — folosește valorile manuale de mai jos sau apasă din nou.' : ' Nu au fost actualizate automat încă.')) + '</div>' +
      '<button class="secondary" id="pt-fetch-rates">Actualizează cursurile acum</button><div id="pt-rates-feedback"></div>' +
      '<div class="row" style="margin-top:14px"><div><label>Curs USD → MDL</label><input type="number" step="0.01" id="pt-set-rate" value="' + state.settings.exchangeRate + '"></div>' +
      '<div><label>Curs USD → KRW (woni per dolar)</label><input type="number" step="1" id="pt-set-krw" value="' + state.settings.krwPerUsd + '"></div>' +
      '<div><label>Curs USD → EUR (euro per dolar)</label><input type="number" step="0.01" id="pt-set-eur" value="' + state.settings.eurPerUsd + '"></div></div></div>';
    html += '<div class="panel"><h2>Coeficient implicit transport</h2>' +
      '<div class="hint">Un singur coeficient, folosit ca punct de plecare peste tot. Îl ajustezi manual în funcție de furnizor sau tipul comenzii — în tab-ul Comenzi, la fiecare comandă în parte.</div>' +
      '<div class="row"><div><label>Coeficient implicit</label><input type="number" step="0.01" id="pt-set-coef" value="' + state.settings.coef + '"></div></div>' +
      '<button class="primary" id="pt-save-settings">Salvează setările</button><div id="pt-set-feedback"></div></div>';
    html += '<div class="panel"><h2>Monedă implicită per brand</h2>' +
      '<div class="hint">Se completează automat pe măsură ce imporți liste de preț — poți și adăuga sau ajusta manual aici, ca să nu mai trebuiască setată moneda la fiecare import pentru un brand pe care-l cunoști deja.</div>' +
      '<div class="row"><div><label>Brand</label><input type="text" id="pt-new-brand-currency-name" placeholder="ex: JMSolution"></div>' +
      '<div><label>Monedă</label><select id="pt-new-brand-currency-value"><option value="USD">USD</option><option value="MDL">MDL</option><option value="EUR">EUR</option><option value="KRW">KRW (won coreean)</option></select></div>' +
      '<div style="display:flex;align-items:flex-end"><button class="secondary" id="pt-add-brand-currency" style="width:100%">+ Adaugă</button></div></div>';
    if(!state.brandCurrencies || !state.brandCurrencies.length){
      html += '<div class="hint" style="margin-top:0">Niciun brand memorat încă.</div></div>';
    } else {
      html += '<div class="panel" style="padding:0;margin-bottom:0">' +
        state.brandCurrencies.slice().sort(function(a,b){ return a.brand.localeCompare(b.brand, undefined, {sensitivity:'base'}); }).map(function(b){
          return '<div class="supplier-chip" style="margin:0;border-radius:0;border-left:none;border-right:none;border-top:none">' +
            '<span>' + escAttr(b.brand) + '</span>' +
            '<span style="display:flex;align-items:center;gap:8px">' +
            '<select style="margin:0" onchange="ptSetBrandCurrencyManual(\'' + jsAttrEscape(b.brand) + '\', this.value)">' +
            ['USD','MDL','EUR','KRW'].map(function(c){ return '<option value="' + c + '" ' + (b.currency===c?'selected':'') + '>' + c + '</option>'; }).join('') +
            '</select>' +
            '<button class="icon-x" onclick="ptRemoveBrandCurrency(\'' + jsAttrEscape(b.brand) + '\')" title="Uită acest brand">✕</button>' +
            '</span></div>';
        }).join('') +
        '</div></div>';
    }
    html += '<div class="panel"><h2>MoySklad — stocuri</h2>' +
      '<div class="hint">Serverul intermediar (Cloudflare Worker) ține tokenul MoySklad în siguranță și trimite aplicației doar perechile barcode → cantitate. Completează URL-ul lui aici.</div>' +
      '<label>URL server intermediar</label>' +
      '<input type="text" id="pt-ms-proxy" value="' + escAttr(state.settings.moyskladProxyUrl||'') + '" placeholder="https://exemplu.workers.dev">' +
      '<button class="secondary" id="pt-ms-test">Testează și salvează</button><div id="pt-ms-feedback"></div></div>';
    html += '<div class="panel"><h2>Backup date</h2>' +
      '<div class="hint">Descarcă tot conținutul (furnizori, produse, comenzi, setări) într-un fișier JSON — util și ca să muți datele dintr-o versiune veche a tool-ului (ex. artifact Claude.ai) în cea conectată la Supabase. Încărcarea unui backup suprascrie datele curente.</div>' +
      '<button class="secondary" id="pt-export-json">⬇ Descarcă backup JSON</button> ' +
      '<button class="secondary" id="pt-import-json-btn">⬆ Încarcă backup JSON</button>' +
      '<input type="file" id="pt-import-json" accept="application/json" style="display:none">' +
      '<div id="pt-backup-feedback"></div></div>';
    html += '<div class="panel"><h2>Cont</h2>' +
      '<div class="hint">Autentificat ca <b>' + escAttr(currentUserEmail) + '</b>.</div>' +
      '<label>Parolă nouă</label><input type="password" id="pt-change-password" autocomplete="new-password" placeholder="minim 6 caractere">' +
      '<button class="secondary" id="pt-change-password-btn">Schimbă parola</button> ' +
      '<button class="secondary" id="pt-signout">Ieși din cont</button>' +
      '<div id="pt-account-feedback"></div></div>';
    el.innerHTML = html;

    document.getElementById('pt-add-brand-currency').addEventListener('click', function(){
      var nameEl = document.getElementById('pt-new-brand-currency-name');
      var name = nameEl.value.trim();
      if(!name){ ptToast('Scrie numele brandului.', false); return; }
      setBrandCurrency(name, document.getElementById('pt-new-brand-currency-value').value);
      save();
      renderSettings();
      ptToast('Brand adăugat: „' + name + '".', true);
    });
    document.getElementById('pt-fetch-rates').addEventListener('click', async function(){
      var fb = document.getElementById('pt-rates-feedback');
      fb.className = 'feedback'; fb.textContent = 'Se actualizează…';
      var ok = await fetchRates();
      fb.className = 'feedback ' + (ok ? 'ok' : 'err');
      fb.textContent = ok ? 'Cursuri actualizate: 1 USD = ' + fmt(state.settings.exchangeRate) + ' MDL, 1 USD = ' + fmt(state.settings.krwPerUsd) + ' KRW, 1 USD = ' + fmt(state.settings.eurPerUsd) + ' EUR.' : 'Nu am putut lua cursurile automat. Le poți introduce manual mai jos.';
      renderSettings();
      renderCompare();
    });
    document.getElementById('pt-save-settings').addEventListener('click', function(){
      state.settings.exchangeRate = parseFloat(document.getElementById('pt-set-rate').value) || state.settings.exchangeRate;
      state.settings.krwPerUsd = parseFloat(document.getElementById('pt-set-krw').value) || state.settings.krwPerUsd;
      state.settings.eurPerUsd = parseFloat(document.getElementById('pt-set-eur').value) || state.settings.eurPerUsd;
      state.settings.coef = parseFloat(document.getElementById('pt-set-coef').value) || state.settings.coef;
      recomputeAllLandedCosts();
      save();
      var fb = document.getElementById('pt-set-feedback'); fb.className = 'feedback ok'; fb.textContent = 'Setări salvate și costuri recalculate.';
      renderCompare();
    });
    document.getElementById('pt-ms-test').addEventListener('click', async function(){
      var proxyUrl = document.getElementById('pt-ms-proxy').value.trim();
      var fb = document.getElementById('pt-ms-feedback');
      if(!proxyUrl){ fb.className = 'feedback err'; fb.textContent = 'Completează URL-ul serverului intermediar.'; return; }
      fb.className = 'feedback'; fb.textContent = 'Se testează…';
      try {
        var res = await fetch(proxyUrl);
        var data = await res.json();
        if(!res.ok || data.error){
          fb.className = 'feedback err'; fb.textContent = 'Serverul a răspuns cu eroare: ' + (data.detail || data.error || res.status) + '. Verifică URL-ul și secretele configurate pe Worker.';
          return;
        }
        state.settings.moyskladProxyUrl = proxyUrl;
        save();
        fb.className = 'feedback ok'; fb.textContent = '✓ Conectat! ' + Object.keys(data.stock || {}).length + ' coduri de bare cu stoc găsite. Mergi în tab-ul Comparație produse sau Produse MoySklad și apasă „Actualizează"/„Sincronizează" ca să aduci și restul datelor (preț, imagine, zile în depozit).';
        renderCompare();
      } catch(err){
        fb.className = 'feedback err';
        fb.textContent = 'Nu am putut ajunge la acest URL. Verifică dacă e corect și dacă Worker-ul e publicat. Eroare: ' + (err && err.message ? err.message : err);
      }
    });
    document.getElementById('pt-export-json').addEventListener('click', function(){
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'panou-achizitii-backup-' + todayStr() + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
    document.getElementById('pt-import-json-btn').addEventListener('click', function(){
      document.getElementById('pt-import-json').click();
    });
    document.getElementById('pt-import-json').addEventListener('change', function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        var fb = document.getElementById('pt-backup-feedback');
        try {
          var parsed = JSON.parse(reader.result);
          applyImportedState(parsed);
          save();
          renderCompare(); renderSettings();
          fb.className = 'feedback ok'; fb.textContent = '✓ Backup încărcat și salvat.';
        } catch(err){
          fb.className = 'feedback err'; fb.textContent = 'Fișier invalid: ' + (err && err.message ? err.message : err);
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });
    document.getElementById('pt-signout').addEventListener('click', async function(){
      await supabaseClient.auth.signOut();
      location.reload();
    });
    document.getElementById('pt-change-password-btn').addEventListener('click', async function(){
      var password = document.getElementById('pt-change-password').value;
      var fb = document.getElementById('pt-account-feedback');
      if(!password || password.length < 6){
        fb.className = 'feedback err'; fb.textContent = 'Parola trebuie să aibă cel puțin 6 caractere.';
        return;
      }
      fb.className = 'feedback'; fb.textContent = 'Se salvează…';
      var result = await supabaseClient.auth.updateUser({ password: password });
      if(result.error){
        fb.className = 'feedback err'; fb.textContent = 'Nu am putut schimba parola: ' + result.error.message;
        return;
      }
      document.getElementById('pt-change-password').value = '';
      fb.className = 'feedback ok'; fb.textContent = 'Parolă schimbată.';
    });
  }

  // ================= ENTER = SALVEAZĂ ȘI SARI LA URMĂTORUL PREȚ =================
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    var input = e.target;
    if(!input.classList || !input.classList.contains('pt-sell-price-input')) return;
    e.preventDefault();
    var allInputs = Array.prototype.slice.call(document.querySelectorAll('.pt-sell-price-input'));
    var idx = allInputs.indexOf(input);
    input.blur();
    var newInputs = Array.prototype.slice.call(document.querySelectorAll('.pt-sell-price-input'));
    var next = newInputs[idx + 1];
    if(next){ next.focus(); next.select(); }
  });

  // ================= DRAG-TO-SCROLL PENTRU TABELE LATE =================
  (function(){
    var dragEl = null, startX = 0, startScroll = 0, moved = false;
    document.addEventListener('mousedown', function(e){
      var wrap = e.target.closest ? e.target.closest('#pt-root .table-wrap') : null;
      if(!wrap || wrap.scrollWidth <= wrap.clientWidth) return;
      dragEl = wrap; startX = e.pageX; startScroll = wrap.scrollLeft; moved = false;
      wrap.classList.add('dragging');
    });
    document.addEventListener('mousemove', function(e){
      if(!dragEl) return;
      var dx = e.pageX - startX;
      if(Math.abs(dx) > 3) moved = true;
      if(moved){ dragEl.scrollLeft = startScroll - dx; e.preventDefault(); }
    });
    function endDrag(){
      if(!dragEl) return;
      dragEl.classList.remove('dragging');
      if(moved){
        var suppressClick = function(ev){ ev.stopPropagation(); ev.preventDefault(); document.removeEventListener('click', suppressClick, true); };
        document.addEventListener('click', suppressClick, true);
      }
      dragEl = null; moved = false;
    }
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('mouseleave', endDrag);
  })();

  // ================= TABS WIRING =================
  var tabButtons = document.querySelectorAll('#pt-root .tab-btn');
  tabButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      tabButtons.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelectorAll('#pt-root .tab-content').forEach(function(c){ c.style.display = 'none'; });
      document.getElementById('tab-' + btn.dataset.tab).style.display = 'block';
      if(btn.dataset.tab === 'add') renderAdd();
      if(btn.dataset.tab === 'orders') renderOrders();
      if(btn.dataset.tab === 'catalog') renderCatalog();
      if(btn.dataset.tab === 'suppliers') renderSuppliers();
      if(btn.dataset.tab === 'settings') renderSettings();
    });
  });

  async function startApp(){
    if(appStarted) return;
    appStarted = true;
    document.getElementById('tab-compare').innerHTML = '<div class="panel empty">Se încarcă…</div>';
    await load();
    if(!state.settings.ratesUpdatedAt){
      fetchRates().then(function(ok){
        autoFetchFailed = !ok;
        renderCompare();
        var settingsTab = document.getElementById('tab-settings');
        if(settingsTab && settingsTab.style.display !== 'none') renderSettings();
      });
    }
    renderCompare();
  }

  // ================= AUTENTIFICARE =================
  var authMode = 'login';
  function showApp(session){
    currentUserEmail = (session && session.user && session.user.email) || '';
    document.getElementById('pt-auth-gate').style.display = 'none';
    document.getElementById('pt-app-wrap').style.display = '';
    startApp();
  }
  function showAuthGate(){
    document.getElementById('pt-auth-gate').style.display = '';
    document.getElementById('pt-app-wrap').style.display = 'none';
  }
  function setAuthMode(mode){
    authMode = mode;
    var recovery = mode === 'recovery';
    document.getElementById('pt-auth-title').textContent = recovery ? 'Parolă nouă' : 'Panou achiziții';
    document.getElementById('pt-auth-hint').textContent = recovery ? 'Alege o parolă nouă pentru contul tău.' : 'Autentifică-te pentru a accesa datele.';
    document.getElementById('pt-auth-email-row').style.display = recovery ? 'none' : '';
    document.getElementById('pt-auth-forgot-row').style.display = recovery ? 'none' : '';
    document.getElementById('pt-auth-password-label').textContent = recovery ? 'Parolă nouă' : 'Parolă';
    document.getElementById('pt-auth-password').autocomplete = recovery ? 'new-password' : 'current-password';
    document.getElementById('pt-auth-submit').textContent = recovery ? 'Salvează parola' : 'Intră';
    document.getElementById('pt-auth-feedback').style.display = 'none';
  }
  async function doSignIn(){
    var email = document.getElementById('pt-auth-email').value.trim();
    var password = document.getElementById('pt-auth-password').value;
    var fb = document.getElementById('pt-auth-feedback');
    fb.style.display = 'block'; fb.className = 'feedback'; fb.textContent = 'Se autentifică…';
    if(SUPABASE_URL.indexOf('YOUR-PROJECT') !== -1){
      fb.className = 'feedback err';
      fb.textContent = 'Aplicația nu e încă legată de un proiect Supabase — completează SUPABASE_URL și SUPABASE_ANON_KEY în cod (vezi comentariul din partea de sus a scriptului).';
      return;
    }
    if(!email || !password){
      fb.className = 'feedback err'; fb.textContent = 'Completează email și parolă.';
      return;
    }
    var result = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
    if(result.error){
      fb.className = 'feedback err'; fb.textContent = 'Autentificare eșuată: ' + result.error.message;
      return;
    }
    fb.style.display = 'none';
  }
  async function doSetNewPassword(){
    var password = document.getElementById('pt-auth-password').value;
    var fb = document.getElementById('pt-auth-feedback');
    fb.style.display = 'block'; fb.className = 'feedback'; fb.textContent = 'Se salvează…';
    if(!password || password.length < 6){
      fb.className = 'feedback err'; fb.textContent = 'Parola trebuie să aibă cel puțin 6 caractere.';
      return;
    }
    var result = await supabaseClient.auth.updateUser({ password: password });
    if(result.error){
      fb.className = 'feedback err'; fb.textContent = 'Nu am putut salva parola: ' + result.error.message;
      return;
    }
    fb.style.display = 'none';
    authMode = 'login';
    var sessionResult = await supabaseClient.auth.getSession();
    if(sessionResult.data && sessionResult.data.session) showApp(sessionResult.data.session);
  }
  document.getElementById('pt-auth-form').addEventListener('submit', function(e){
    e.preventDefault();
    if(authMode === 'recovery') doSetNewPassword(); else doSignIn();
  });
  document.getElementById('pt-auth-forgot').addEventListener('click', async function(){
    var email = document.getElementById('pt-auth-email').value.trim();
    var fb = document.getElementById('pt-auth-feedback');
    fb.style.display = 'block';
    if(!email){
      fb.className = 'feedback err'; fb.textContent = 'Completează email-ul, apoi apasă din nou „Am uitat parola”.';
      return;
    }
    fb.className = 'feedback'; fb.textContent = 'Se trimite emailul de resetare…';
    var redirectUrl = window.location.href.split('#')[0].split('?')[0];
    var result = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl });
    if(result.error){
      fb.className = 'feedback err'; fb.textContent = 'Nu am putut trimite emailul: ' + result.error.message;
      return;
    }
    fb.className = 'feedback ok'; fb.textContent = 'Ți-am trimis un email cu link de resetare a parolei — verifică inbox-ul (și Spam).';
  });
  supabaseClient.auth.onAuthStateChange(function(event, session){
    if(event === 'PASSWORD_RECOVERY'){ setAuthMode('recovery'); showAuthGate(); return; }
    if(session){ showApp(session); } else { showAuthGate(); }
  });
  supabaseClient.auth.getSession().then(function(result){
    if(result.data && result.data.session){ showApp(result.data.session); } else { showAuthGate(); }
  });
})();
</script>
</body>
</html>
